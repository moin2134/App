<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2E6417"></head><body>
<title>GGAF Quizzes!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap">
<style>
:root{
  --forest:#2E6417; --forestShade:#1E440E;
  --leaf:#00BF63;   --leafShade:#00934C;
  --sprout:#7ED957; --sproutShade:#5DB23A;
  --lime:#C1FF72;   --limeShade:#9BD64A;
  --mist:#D9F2CA;
  --orange:#FF9600; --red:#EE4B4F; --redShade:#B8343A;

  --bg:#F5FBF0; --surface:#FFFFFF; --surface2:#E9F7DF;
  --ink:#1B3A0D; --ink2:#557248; --line:#D3E7C5;
  --lock:#E2EDDA; --lockShade:#C6D7BA; --lockInk:#9AB18C;
  --selBg:#EAFBDF; --selInk:#1E6B2E; --leafText:#00934C;
  --okBg:#DDFBC4; --okInk:#1E5A0B; --badBg:#FFE3E3; --badInk:#B42328;
  --rAccent:#F2542D; --rShade:#C23A17; --rSel:#FFE7DB; --rInk:#C2410C; --rBg:#FFF6F0;
  --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1808; --surface:#15250E; --surface2:#1C3113;
    --ink:#E6F6DA; --ink2:#A2C191; --line:#2A4420;
    --lock:#223619; --lockShade:#162710; --lockInk:#5E7C4E;
    --selBg:#1C3A12; --selInk:#C1FF72; --leafText:#7ED957;
    --okBg:#1D3A10; --okInk:#C1FF72; --badBg:#3A1516; --badInk:#FF9A9C;
    --rAccent:#F2542D; --rShade:#A8330F; --rSel:#3A1D10; --rInk:#FFA46B; --rBg:#1C120B;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1808; --surface:#15250E; --surface2:#1C3113;
  --ink:#E6F6DA; --ink2:#A2C191; --line:#2A4420;
  --lock:#223619; --lockShade:#162710; --lockInk:#5E7C4E;
  --selBg:#1C3A12; --selInk:#C1FF72; --leafText:#7ED957;
  --okBg:#1D3A10; --okInk:#C1FF72; --badBg:#3A1516; --badInk:#FF9A9C;
    --rAccent:#F2542D; --rShade:#A8330F; --rSel:#3A1D10; --rInk:#FFA46B; --rBg:#1C120B;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,input{outline:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--leaf);outline-offset:3px}
input:focus{border-color:var(--leaf)}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
.ic{width:1em;height:1em;display:inline-block;vertical-align:middle;flex:none}

/* ---------- Shell ---------- */
#app{max-width:600px;margin:0 auto;min-height:100%}
.topbar{position:-webkit-sticky;position:sticky;top:0;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:2px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em;white-space:nowrap}
.logo .g{color:var(--leafText)}
.logo svg.m{width:34px;height:34px}
.stats{display:flex;gap:4px}
.stat{display:flex;align-items:center;gap:5px;font-weight:900;font-size:16px;background:none;border:0;padding:6px 8px;border-radius:12px;font-variant-numeric:tabular-nums}
.stat:hover{background:var(--surface2)}
.stat .ic{width:24px;height:24px}
.stat.streak{color:var(--orange)} .stat.streak.off{color:var(--lockInk)}
.stat.xp{color:var(--leafText)} .stat.hearts{color:var(--red)}
main{padding:16px 16px 170px;overflow-x:hidden;overflow-x:clip}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--line);padding:6px 8px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar .in{max-width:600px;margin:0 auto;display:flex;gap:4px}
.tabbar .tab{flex:1 1 0}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:2px solid transparent;border-radius:14px;background:none;font-weight:800;font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;min-width:0}
.tab .ic{width:26px;height:26px}
.tab[aria-current="page"]{border-color:var(--leaf);background:var(--selBg);color:var(--leafText)}
.corner{max-width:600px;margin:0 auto 2px;padding:0 6px;text-align:right;font-size:11px;line-height:1.3;color:var(--ink2);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.corner b{font-family:var(--display);font-size:13px;color:var(--leafText);letter-spacing:.02em}
.corner .mmg{display:inline-block;padding:0 6px;margin-right:4px;border-radius:6px;background:var(--forest);color:var(--lime)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:14px 22px;font-weight:900;font-size:16px;letter-spacing:.06em;text-transform:uppercase;background:var(--leaf);color:#fff;box-shadow:0 4px 0 var(--leafShade);transition:transform .06s,box-shadow .06s,filter .15s}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--leafShade)}
.btn:disabled{background:var(--lock);color:var(--lockInk);box-shadow:0 4px 0 var(--lockShade);cursor:default;filter:none;transform:none}
.btn.block{width:100%}
.btn.ghost{background:var(--surface);color:var(--leafText);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.dark{background:var(--forest);color:var(--lime);box-shadow:0 4px 0 var(--forestShade)}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--redShade)}
.btn.plain{background:none;box-shadow:none;color:var(--ink2)}

/* ---------- Learn / path ---------- */
.hello{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.hello .m{width:78px;flex:none}
.say{position:relative;flex:1;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:700}
.say::before{content:"";position:absolute;left:-9px;top:24px;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.say small{display:block;color:var(--ink2);font-weight:700;margin-top:2px}
.goalring{flex:none;width:58px;height:58px;position:relative;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;color:var(--ink2)}
.goalring svg{position:absolute;top:0;right:0;bottom:0;left:0;transform:rotate(-90deg)}

.unit{margin-top:22px;border-radius:18px;padding:16px 18px;background:var(--c);color:var(--i);box-shadow:0 5px 0 var(--s)}
.unit .eb{font-weight:900;font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.unit h2{font-size:25px;margin-top:2px}
.unit p{margin:4px 0 0;font-weight:700;opacity:.92;max-width:44ch}
.path{display:flex;flex-direction:column;align-items:center;gap:22px;padding:30px 0 16px}
.nwrap{position:relative}
.node{position:relative;width:78px;height:72px;border-radius:50%;border:0;background:var(--c);color:var(--i);box-shadow:0 7px 0 var(--s);display:flex;align-items:center;justify-content:center;transition:transform .08s,box-shadow .08s}
.node .ic{width:36px;height:36px}
.node:active{transform:translateY(6px);box-shadow:0 1px 0 var(--s)}
.nwrap.locked .node{background:var(--lock);color:var(--lockInk);box-shadow:0 7px 0 var(--lockShade)}
.nwrap.current::before{content:"";position:absolute;top:-10px;right:-10px;bottom:-16px;left:-10px;border-radius:50%;border:6px solid var(--line)}
.nwrap.current .node{animation:pulse 2.4s ease-in-out infinite}
.bubble{position:absolute;left:50%;bottom:calc(100% + 18px);transform:translateX(-50%);background:var(--surface);border:2px solid var(--line);color:var(--leafText);font-weight:900;letter-spacing:.08em;padding:6px 12px;border-radius:12px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
.bubble::after{content:"";position:absolute;left:50%;top:100%;width:12px;height:12px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translate(-50%,-6px) rotate(45deg)}
.pmascot{position:absolute;top:50%;width:92px;transform:translateY(-50%);pointer-events:none}
svg.m{display:block;width:100%;height:auto}
.info{display:flex;align-items:center;gap:12px;width:100%;max-width:340px;text-align:left;padding:10px 14px;border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;background:var(--surface);transition:transform .06s}
.info:active{transform:translateY(3px)}
.info + .nwrap.current{margin-top:40px}
.info .bk{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--c);color:var(--i)}
.info .bk .ic{width:26px;height:26px}
.info b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--leafText)}
.info span{font-weight:800;line-height:1.25}
.info .rd{margin-left:auto;color:var(--leafText);flex:none}
.info .rd .ic{width:22px;height:22px}
.info.locked{opacity:.55}
.mbox.infobox{text-align:left;max-height:86vh;overflow:auto}
.infobox .top{display:flex;gap:12px;align-items:center}
.infobox .top .m{width:70px;flex:none}
.infobox ul{margin:0;padding:0;list-style:none;display:grid;grid-gap:10px;gap:10px}
.infobox li{display:flex;gap:10px;font-weight:600;line-height:1.45}
.infobox li::before{content:"";flex:none;width:10px;height:10px;margin-top:7px;border-radius:3px;background:var(--leaf);transform:rotate(45deg)}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
@keyframes pulse{50%{filter:brightness(1.08)}}

/* ---------- Cards (practice / badges / profile) ---------- */
.h1{font-size:30px;margin:6px 0 4px}
.lead{color:var(--ink2);font-weight:700;margin:0 0 18px}
.stack{display:grid;grid-gap:14px;gap:14px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px}
.pcard{display:flex;gap:14px;align-items:center}
.pcard .badge{width:60px;height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none}
.pcard .badge .ic{width:34px;height:34px}
.pcard h3{font-size:20px}
.pcard p{margin:2px 0 0;color:var(--ink2);font-weight:700;font-size:14px}
.pcard .go{margin-left:auto;flex:none}
.tip{background:var(--forest);color:var(--mist);border:0}
.tip .eb{font-weight:900;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--lime)}
.tip h3{font-size:21px;color:#fff;margin:4px 0}
.tip p{margin:0;font-weight:600}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-gap:12px;gap:12px}
.bdg{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.bdg .medal{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--lime);color:var(--forest);box-shadow:inset 0 -5px 0 var(--limeShade)}
.bdg .medal .ic{width:32px;height:32px}
.bdg.off .medal{background:var(--lock);color:var(--lockInk);box-shadow:inset 0 -5px 0 var(--lockShade)}
.bdg h3{font-size:17px}
.bdg p{margin:0;color:var(--ink2);font-size:13px;font-weight:700}
.bar{height:10px;width:100%;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sprout);border-radius:6px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);grid-gap:12px;gap:12px}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center}
.tile .ic{width:28px;height:28px}
.tile b{display:block;font-family:var(--display);font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--ink2);font-weight:700}
.sec{font-size:20px;margin:26px 0 10px}
.field{display:flex;flex-direction:column;gap:6px;font-weight:800}
.field input{font:inherit;font-weight:700;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--surface2);color:var(--ink)}
.seg{display:flex;gap:8px}
.seg button{flex:1 1 0;min-width:0}
.seg button{border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--surface);padding:10px 4px;font-weight:800}
.seg button small{display:block;font-size:11px;color:var(--ink2);font-weight:700}
.seg button[aria-pressed="true"]{border-color:var(--leaf);background:var(--selBg);color:var(--selInk)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{width:54px;height:32px;border-radius:20px;border:0;background:var(--lock);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15);transition:left .15s}
.switch[aria-checked="true"]{background:var(--leaf)}
.switch[aria-checked="true"]::after{left:26px}
.chart{display:flex;gap:8px;align-items:end;height:150px;position:relative;padding-top:18px}
.chart .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.chart .b{width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:var(--sprout);min-height:4px}
.chart .col.today .b{background:var(--leaf)}
.chart .v{font-size:12px;font-weight:800;color:var(--ink2);font-variant-numeric:tabular-nums}
.chart .d{font-size:12px;font-weight:800;color:var(--ink2)}
.chart .goal{position:absolute;left:0;right:0;border-top:2px dashed var(--orange)}
.chart .goal span{position:absolute;right:0;top:-18px;font-size:11px;font-weight:900;color:var(--orange)}
.about{color:var(--ink2);font-weight:700;font-size:14px;margin-top:22px}

/* ---------- Lesson ---------- */
.lesson{position:fixed;top:0;right:0;bottom:0;left:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:0;padding-top:env(safe-area-inset-top,0px)}
.lhead{max-width:680px;width:100%;margin:0 auto;display:flex;align-items:center;gap:14px;padding:16px}
.x{border:0;background:none;color:var(--lockInk);padding:4px;border-radius:10px;display:flex}
.x .ic{width:26px;height:26px}
.prog{flex:1;height:16px;border-radius:10px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;border-radius:10px;background:var(--leaf);position:relative;transition:width .35s ease}
.prog i::after{content:"";position:absolute;left:10px;right:10px;top:4px;height:4px;border-radius:3px;background:rgba(255,255,255,.35)}
.prog.timer i{background:var(--orange);transition:width .1s linear}
.lstat{display:flex;align-items:center;gap:4px;font-weight:900;color:var(--red);font-variant-numeric:tabular-nums;min-width:44px;justify-content:flex-end}
.lesson.beamer .lstat{color:var(--ink2);white-space:nowrap;font-size:15px}
.lstat .ic{width:26px;height:26px}
.lstat.score{color:var(--orange)}
.qwrap{flex:1;overflow:auto}
.qarea{max-width:640px;margin:0 auto;padding:12px 16px 40px}
.combo{height:22px;font-weight:900;color:var(--orange);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.qtype{display:flex;align-items:center;gap:6px;font-weight:900;color:var(--leafText);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.qtype .ic{width:18px;height:18px}
.qtext{font-size:25px;margin:8px 0 22px;font-weight:700}
.qhead{display:flex;gap:12px;align-items:flex-end;margin:8px 0 22px}
.qhead .m{width:70px;flex:none}
.qhead .say{font-family:var(--display);font-size:20px;font-weight:700;line-height:1.2}
.qhead .say::before{top:auto;bottom:18px}
.opts{display:grid;grid-gap:10px;gap:10px}
.opts.tf{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;background:var(--surface);font-weight:700;font-size:17px;line-height:1.3;transition:transform .06s}
.opt:hover{background:var(--surface2)}
.opt:active{transform:translateY(2px)}
.opt .k{width:28px;height:28px;flex:none;border:2px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:var(--ink2)}
.opts.tf .opt{flex-direction:column;justify-content:center;text-align:center;padding:22px 12px;font-family:var(--display);font-size:22px}
.opts.tf .opt .big{width:44px;height:44px}
.opt.sel{border-color:var(--leaf);background:var(--selBg);color:var(--selInk)}
.opt.sel .k{border-color:var(--leaf);color:var(--selInk)}
.opt.right{border-color:var(--leaf);background:var(--okBg);color:var(--okInk)}
.opt.wrong{border-color:var(--red);background:var(--badBg);color:var(--badInk)}
.opt:disabled{cursor:default}
.sentence{font-size:21px;font-weight:700;line-height:2.1;margin:0 0 26px}
.blank{display:inline-block;min-width:120px;padding:0 10px;border-bottom:3px solid var(--ink2);text-align:center;color:var(--ink2);line-height:1.5}
.blank.filled{color:var(--leafText);border-color:var(--leaf)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:10px 16px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--surface);font-weight:800;font-size:16px;text-align:left}
.chip:hover{background:var(--surface2)}
.chip.used{background:var(--line);color:transparent;border-color:var(--line);pointer-events:none}
.chip.sel{border-color:var(--leaf);background:var(--selBg);color:var(--selInk)}
.slots{display:grid;grid-gap:8px;gap:8px;margin-bottom:22px}
.slot{display:flex;align-items:center;gap:10px;min-height:54px;border:2px dashed var(--line);border-radius:14px;padding:4px 6px 4px 12px}
.slot .n{font-family:var(--display);font-weight:800;color:var(--ink2);width:18px;flex:none}
.slot .chip{flex:1}
.orderpool{display:grid;grid-gap:8px;gap:8px}
.orderpool .chip{width:100%}
.mgrid{display:grid;grid-template-columns:1fr 1fr;grid-gap:10px;gap:10px}
.mcol{display:grid;grid-gap:10px;gap:10px;align-content:start}
.mgrid .chip{width:100%;min-height:62px;text-align:center;font-size:15px}
.chip.done{opacity:.35;pointer-events:none;border-color:var(--line)}
.chip.shake,.opt.shake{animation:shake .35s;border-color:var(--red);background:var(--badBg);color:var(--badInk)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.lfoot{border-top:2px solid var(--line);padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.lfoot .in{max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.lfoot .hint{color:var(--ink2);font-weight:800}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:45;transform:translateY(105%);transition:transform .22s ease;padding:18px 16px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--okBg);color:var(--okInk)}
.sheet.show{transform:none}
.sheet.bad{background:var(--badBg);color:var(--badInk)}
.sheet .in{max-width:640px;margin:0 auto;display:grid;grid-gap:12px;gap:12px}
.sheet .t{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:25px;font-weight:800}
.sheet .t .dot{width:40px;height:40px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center}
.sheet .t .dot .ic{width:24px;height:24px}
.sheet .sol{font-weight:800}
.sheet .fact{font-weight:600;color:var(--ink);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:15px}
.sheet .fact b{color:var(--leafText)}
.sheet.bad .btn{background:var(--red);box-shadow:0 4px 0 var(--redShade)}

/* ---------- Result / modal ---------- */
.result{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;background:var(--bg);overflow:auto;padding:24px 16px;padding:max(24px,env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}

  pair('Welcher Begriff passt zu welcher Erklärung?',[['Rechenzentrum','Gebäude voller Server'],['Cloud','Daten auf fremden Servern speichern'],['E-Schrott','Ausgediente Elektrogeräte'],['Refurbished','Generalüberholtes Gebrauchtgerät']],'Die „Cloud“ ist also keine Wolke: Deine Fotos liegen in Rechenzentren, die rund um die Uhr Strom brauchen.'),
  /* Lektion 2 – Vertiefung */
  mc('Wie viel Elektroschrott ist weltweit im Jahr 2022 angefallen?',['rund 62 Millionen Tonnen','rund 62.000 Tonnen','rund 620 Tonnen','rund 6 Milliarden Tonnen'],'Nur knapp ein Viertel davon wurde nachweislich gesammelt und recycelt. Bis 2030 könnten es laut UN rund 82 Millionen Tonnen werden.'),
  tf('Große Elektrohändler und viele Supermärkte müssen kleine Elektro-Altgeräte kostenlos zurücknehmen – auch wenn man nichts Neues kauft.',true,'Das gilt für Geräte bis 25 cm Kantenlänge, z. B. Handys, Ladekabel oder Kopfhörer – bis zu drei Stück pro Geräteart.'),
  mc('Wie viele alte, ungenutzte Handys liegen laut einer Bitkom-Umfrage in deutschen Haushalten herum?',['rund 170 Millionen','rund 1,7 Millionen','rund 17.000','rund 1,7 Milliarden'],'In ihnen stecken Gold, Silber und andere wertvolle Rohstoffe. Die Zahl sinkt zwar – Ende 2022 waren es noch rund 210 Millionen –, ist aber immer noch riesig.'),
  fill('Seit Ende 2024 müssen neue Handys in der EU einen einheitlichen ___-Ladeanschluss haben.',['USB-C','HDMI','VGA','Klinken'],'So passt ein Ladegerät für viele Geräte. Neue Geräte dürfen auch ohne Netzteil verkauft werden – das spart Elektroschrott.'),
  ord('Sortiere nach Stromverbrauch beim Videoschauen – von wenig nach viel.',['Smartphone','Laptop','Großer Fernseher'],'Ein Smartphone braucht nur wenige Watt, ein großer Fernseher oft über 100 Watt. Kleinerer Bildschirm heißt weniger Strom.'),
  mc('Was schreibt die EU seit Juni 2025 für neue Smartphones vor?',['Wichtige Ersatzteile müssen noch 7 Jahre nach Verkaufsende lieferbar sein','Jedes Handy muss 20 Jahre lang funktionieren','Handys dürfen nur noch in Europa hergestellt werden','Handys dürfen keine Kamera mehr haben'],'Außerdem: mindestens 5 Jahre Updates nach Verkaufsende und Akkus, die nach 800 Ladezyklen noch mindestens 80 % Kapazität haben. So halten Handys länger.'),
  /* Lektion 3 – Profi: Rechenzentren & KI */
  mc('Wie viel des weltweiten Stroms verbrauchten Rechenzentren im Jahr 2024 laut Internationaler Energieagentur (IEA)?',['rund 1,5 %','rund 15 %','rund 50 %','rund 0,001 %'],'Bis 2030 könnte sich ihr Verbrauch laut IEA mehr als verdoppeln – auf etwa so viel Strom, wie Japan heute insgesamt verbraucht.'),
  tf('Rechenzentren brauchen nicht nur Strom, sondern oft auch viel Wasser zum Kühlen.',true,'Server werden beim Rechnen heiß. Viele Anlagen kühlen mit Wasser, das dabei teilweise verdunstet – in trockenen Regionen kann das zum Problem werden.'),
  fill('Wenn Technik sparsamer wird, wir sie dadurch aber viel mehr nutzen und am Ende kaum Energie sparen, nennt man das ___-Effekt.',['Rebound','Domino','Treibhaus','Placebo'],'Beispiel: Streaming wird effizienter, aber wir schauen immer mehr Videos in immer höherer Auflösung.'),
  pair('Was gehört zusammen?',[['Server','Computer, der Daten und Dienste für andere bereitstellt'],['KI-Training','Ein Modell lernt aus riesigen Datenmengen'],['Abwärme','Wärme aus Servern, die Wohnungen heizen kann'],['Ökostrom','Strom aus Sonne, Wind und Wasser']],'Das deutsche Energieeffizienzgesetz verlangt, dass Rechenzentren ab 2027 ihren Strom komplett aus erneuerbaren Energien beziehen.'),
  ord('Sortiere diese Datenmengen – von klein nach groß.',['Kilobyte','Megabyte','Gigabyte','Terabyte'],'Jede Stufe ist rund 1.000-mal so groß wie die vorige. Eine Stunde Video in HD-Qualität kann schon mehrere Gigabyte umfassen.'),
  mc('Was treibt den Strombedarf von Rechenzentren derzeit besonders stark nach oben?',['Künstliche Intelligenz (KI)','Gedruckte Zeitungen','Telefonate über das Festnetz','Taschenrechner'],'Das Trainieren und Nutzen großer KI-Modelle erfordert besonders leistungsstarke Chips. Laut IEA ist KI der wichtigste Treiber für den wachsenden Stromverbrauch der Rechenzentren.')
 ]},
 {t:'Kinderrechte', d:'Deine Rechte – in der Schule, online und weltweit.', c:'#7ED957', s:'#5DB23A', i:'#1E440E', qs:[
  /* Lektion 1 – Grundlagen */
  mc('In welchem Jahr haben die Vereinten Nationen die UN-Kinderrechtskonvention beschlossen?',['1989','1948','1968','2015'],'Sie wurde am 20. November 1989 verabschiedet. Deshalb ist der 20. November der Internationale Tag der Kinderrechte.'),
  tf('Laut UN-Kinderrechtskonvention gilt jeder Mensch unter 18 Jahren als Kind.',true,'So steht es in Artikel 1. Die Rechte gelten für alle Kinder – egal, woher sie kommen, welches Geschlecht oder welche Religion sie haben.'),
  fill('Die UN-Kinderrechtskonvention besteht aus ___ Artikeln.',['54','10','17','100'],'Die ersten 41 Artikel beschreiben die Rechte der Kinder. Die übrigen regeln, wie die Staaten sie umsetzen und überprüfen lassen.'),
  mc('Welcher Staat hat die UN-Kinderrechtskonvention als einziger UN-Mitgliedstaat nicht ratifiziert?',['die USA','Deutschland','Frankreich','Brasilien'],'Alle anderen – insgesamt 196 Vertragsstaaten – sind dabei. Die USA haben die Konvention 1995 zwar unterzeichnet, aber nie ratifiziert.'),
  pair('Welches Kinderrecht ist hier betroffen?',[['Ein Mädchen darf nicht zur Schule gehen','Recht auf Bildung'],['Ein Kind hat nach der Schule nie Zeit zum Spielen','Recht auf Freizeit und Spiel'],['Ein Kind wird geschlagen','Recht auf Schutz vor Gewalt'],['Bei der Planung des Schulhofs werden die Kinder nicht gefragt','Recht auf Beteiligung']],'Diese Rechte stehen in den Artikeln 28 (Bildung), 31 (Freizeit und Spiel), 19 (Schutz vor Gewalt) und 12 (Beteiligung).'),
  tf('In Deutschland haben Kinder ein gesetzliches Recht auf gewaltfreie Erziehung.',true,'Seit 2000 steht im Bürgerlichen Gesetzbuch: Körperliche Bestrafungen, seelische Verletzungen und andere entwürdigende Maßnahmen sind verboten.'),
  /* Lektion 2 – Vertiefung */
  mc('Was bedeutet der Grundsatz „Vorrang des Kindeswohls“?',['Bei allen Entscheidungen, die Kinder betreffen, muss ihr Wohl vorrangig berücksichtigt werden','Kinder dürfen alle Entscheidungen allein treffen','Kinder müssen Erwachsenen immer gehorchen','Nur Kinder dürfen über Gesetze abstimmen'],'Das steht in Artikel 3 und gilt z. B. für Gerichte, Behörden, Parlamente und soziale Einrichtungen.'),
  fill('Bei der „Nummer gegen ___“ (116 111) finden Kinder und Jugendliche kostenlos und anonym ein offenes Ohr.',['Kummer','Hunger','Langeweile','Lärm'],'Man muss seinen Namen nicht nennen. Samstags beraten dort auch junge Berater*innen zwischen 16 und 21 Jahren.'),
  mc('Wie heißt das Kinderhilfswerk der Vereinten Nationen?',['UNICEF','NATO','OPEC','FIFA'],'UNICEF wurde 1946 gegründet, um Kindern nach dem Zweiten Weltkrieg zu helfen. Heute ist es in über 190 Ländern und Gebieten aktiv.'),
  ord('Bringe diese Ereignisse der Kinderrechte in die zeitliche Reihenfolge.',['Genfer Erklärung der Rechte des Kindes','Gründung von UNICEF','Verabschiedung der UN-Kinderrechtskonvention','Die Konvention tritt in Deutschland in Kraft'],'1924, 1946, 1989, 1992. Die Genfer Erklärung des Völkerbunds war noch kein verbindlicher Vertrag – die Konvention ist es.'),
  tf('Kinderrechte stehen ausdrücklich im deutschen Grundgesetz.',false,'Darüber wird seit Jahren gestritten, doch bisher (Stand 2026) fehlt die nötige Zwei-Drittel-Mehrheit. Viele Landesverfassungen enthalten dagegen schon Kinderrechte.'),
  mc('Was garantiert Artikel 12 der UN-Kinderrechtskonvention?',['Kinder dürfen in allen Angelegenheiten, die sie betreffen, ihre Meinung sagen – und sie muss berücksichtigt werden','Kinder dürfen ab 12 Jahren wählen','Kinder müssen ab 12 Jahren arbeiten','Kinder bekommen ab 12 Jahren ein eigenes Handy'],'Die Meinung wird je nach Alter und Reife berücksichtigt. Klassensprecher*innen und Schülervertretungen sind ein Beispiel für Beteiligung.'),
  /* Lektion 3 – Profi: Kinderrechte heute – Umwelt, Digitales, Mitbestimmung */
  mc('Was hat der UN-Ausschuss für die Rechte des Kindes 2023 ausdrücklich bestätigt?',['Kinder haben ein Recht auf eine saubere, gesunde und nachhaltige Umwelt','Kinder haben ein Recht auf ein eigenes Smartphone','Kinder dürfen ab 12 Jahren an Wahlen teilnehmen','Kinder müssen keine Schule besuchen'],'In der „Allgemeinen Bemerkung Nr. 26“ fordert der Ausschuss die Staaten auf, Kinder vor den Folgen der Klimakrise zu schützen. Über 16.000 Kinder aus 121 Ländern haben daran mitgewirkt.'),
  tf('Fotos von Mitschüler*innen darf man ohne deren Erlaubnis im Internet veröffentlichen.',false,'Jeder Mensch hat ein Recht am eigenen Bild. Die UN-Kinderrechtskonvention schützt außerdem die Privatsphäre von Kindern (Artikel 16).'),
  fill('Wenn Eltern viele Fotos und Videos ihrer Kinder in sozialen Netzwerken teilen, nennt man das ___.',['Sharenting','Upcycling','Carsharing','Greenwashing'],'Das Wort verbindet „share“ (teilen) und „parenting“ (Erziehung). Kinderschutz-Fachleute raten: Kinder vorher fragen und keine peinlichen Bilder posten.'),
  mc('Was entschied das Bundesverfassungsgericht 2021 nach einer Klage junger Menschen?',['Das Klimaschutzgesetz musste nachgebessert werden, um die Freiheit künftiger Generationen zu schützen','Schulen dürfen keinen Klimaunterricht mehr anbieten','Autos mit Verbrennungsmotor wurden sofort verboten','Klimaschutz ist reine Privatsache'],'Das Gericht stellte fest: Zu wenig Klimaschutz heute würde Jüngeren später sehr harte Einschnitte aufbürden. Der Bundestag verschärfte daraufhin die Klimaziele.'),
  ord('Wie wird ein UN-Vertrag wie die Kinderrechtskonvention in einem Land wirksam? Bringe die Schritte in die richtige Reihenfolge.',['Die UN-Generalversammlung beschließt den Vertrag','Ein Staat unterzeichnet den Vertrag','Der Staat ratifiziert den Vertrag','Der Staat berichtet regelmäßig an den UN-Ausschuss in Genf'],'Der UN-Ausschuss für die Rechte des Kindes prüft die Berichte und gibt den Staaten Empfehlungen, was sie verbessern sollen.'),
  pair('Welche Altersgrenze gilt in Deutschland wofür?',[['7 Jahre','Beschränkt geschäftsfähig (z. B. Taschengeldkäufe)'],['14 Jahre','Strafmündig'],['16 Jahre','Wählen bei der Europawahl'],['18 Jahre','Volljährig']],'Bei der Europawahl 2024 durften in Deutschland erstmals 16-Jährige wählen. Für Bundestags- und bayerische Landtagswahlen gilt weiterhin 18 Jahre.')
 ]},
 {t:'Wald & Moore in Bayern', d:'Wälder im Klimawandel und Moore als Klimaschützer.', c:'#C1FF72', s:'#9BD64A', i:'#2E6417', qs:[
  /* Lektion 1 – Grundlagen */
  mc('Welcher Anteil der Fläche Bayerns ist mit Wald bedeckt?',['gut ein Drittel','rund ein Zehntel','rund zwei Drittel','fast die ganze Fläche'],'Laut Bundeswaldinventur sind es rund 37 % – etwa 2,6 Millionen Hektar.'),
  tf('Bayern hat die größte Waldfläche aller deutschen Bundesländer.',true,'Mit rund 2,6 Millionen Hektar steht in Bayern gut ein Fünftel des deutschen Waldes.'),
  mc('Welche Baumart ist in Bayerns Wäldern am häufigsten?',['Fichte','Buche','Eiche','Birke'],'Die Fichte wächst auf fast 40 % der Waldfläche, danach folgen Kiefer und Buche.'),
  ord('Ein Wald hat Stockwerke. Sortiere von unten nach oben.',['Moosschicht','Krautschicht','Strauchschicht','Baumschicht'],'Jedes Stockwerk bietet anderen Tieren und Pflanzen Lebensraum – ein Grund, warum naturnahe Wälder so artenreich sind.'),
  fill('Der Begriff „Nachhaltigkeit“ stammt aus der ___: Hans Carl von Carlowitz forderte 1713, nur so viel Holz zu fällen, wie nachwächst.',['Forstwirtschaft','Fischerei','Autoindustrie','Raumfahrt'],'Carlowitz leitete den Bergbau in Sachsen. Damals drohte Holzmangel, weil Bergwerke und Hütten riesige Mengen Holz verbrauchten.'),
  pair('Welcher Baum hat welche Früchte oder Zapfen?',[['Rotbuche','Bucheckern'],['Eiche','Eicheln'],['Fichte','Hängende Zapfen'],['Weißtanne','Aufrecht stehende Zapfen']],'Tannenzapfen zerfallen schon am Baum. Was man am Boden findet und „Tannenzapfen“ nennt, sind meist Fichtenzapfen.'),
  /* Lektion 2 – Vertiefung */
  mc('Warum sind viele Fichtenwälder in Bayern in Gefahr?',['Hitze und Trockenheit schwächen die Bäume, dann befällt sie der Borkenkäfer','Es gibt zu viele Eichhörnchen','Fichten brauchen mehr Schnee, als heute fällt','Fichten wachsen zu schnell und brechen ab'],'Geschwächte Fichten können sich kaum mit Harz wehren. Der Buchdrucker, eine Borkenkäferart, vermehrt sich in heißen Sommern besonders schnell.'),
  tf('Die Fichte ist ein Tiefwurzler und kommt deshalb gut mit Trockenheit zurecht.',false,'Die Fichte ist ein Flachwurzler. Tiefwurzler wie Weißtanne oder Eiche erreichen Wasser in tieferen Bodenschichten – und stehen stabiler bei Sturm.'),
  fill('Werden reine Nadelwälder nach und nach in klimastabile Mischwälder verwandelt, spricht man von Wald___.',['umbau','brand','lauf','sterben'],'Bayern will bis 2030 rund 200.000 Hektar im Privat- und Körperschaftswald umbauen. Mischwälder sind widerstandsfähiger gegen Hitze, Sturm und Schädlinge.'),
  mc('Wem gehört der größte Teil des Waldes in Bayern?',['Privatleuten','Dem Bund','Der Europäischen Union','Den Kirchen'],'Gut die Hälfte ist Privatwald, rund 700.000 Menschen besitzen Wald. Rund 30 % gehören dem Freistaat und werden überwiegend von den Bayerischen Staatsforsten bewirtschaftet.'),
  tf('Laut Bundeswaldinventur hat der Wald in Deutschland zwischen 2017 und 2022 mehr Kohlenstoff verloren als gespeichert.',true,'Dürre, Stürme und Borkenkäfer ließen so viele Bäume absterben, dass der Wald in dieser Zeit zur CO₂-Quelle wurde statt zum CO₂-Speicher.'),
  mc('Was ist ein Schutzwald in den Alpen?',['Ein Wald, der Dörfer und Straßen vor Lawinen, Steinschlag und Muren schützt','Ein Wald, den niemand betreten darf','Ein eingezäunter Wald für Wildschweine','Ein Wald nur aus jungen Bäumchen'],'Stirbt ein Schutzwald, müssen teure Verbauungen aus Stahl und Beton seine Aufgabe übernehmen. Bayern pflegt und saniert ihn deshalb gezielt.'),
  /* Lektion 3 – Profi: Moore in Bayern */
  mc('Wie schnell wächst die Torfschicht in einem intakten Hochmoor ungefähr?',['rund 1 Millimeter pro Jahr','rund 1 Meter pro Jahr','rund 10 Zentimeter pro Monat','rund 1 Zentimeter pro Tag'],'Für einen Meter Torf braucht ein Moor also rund 1.000 Jahre. Ein entwässertes Moor schrumpft dagegen viel schneller.'),
  tf('Wer torffreie Blumenerde kauft, hilft beim Schutz der Moore.',true,'Für herkömmliche Blumenerde wird Torf aus Mooren abgebaut. Torffreie Erde enthält stattdessen z. B. Kompost, Holzfasern oder Rindenhumus.'),
  pair('Was passt zusammen?',[['Hochmoor','Wird nur von Regenwasser gespeist'],['Niedermoor','Wird von Grundwasser gespeist'],['Torfmoos','Saugt sich voll Wasser wie ein Schwamm'],['Sonnentau','Fleischfressende Moorpflanze']],'Hochmoore sind sehr nährstoffarm. Der Sonnentau gleicht das aus, indem er kleine Insekten mit klebrigen Tröpfchen fängt.'),
  fill('Wird ein entwässertes Moor wieder nass gemacht, spricht man von ___.',['Wiedervernässung','Trockenlegung','Aufforstung','Flurbereinigung'],'Steht das Wasser wieder hoch, zersetzt sich der Torf nicht weiter. Das Moor setzt kaum noch CO₂ frei und kann wieder wachsen.'),
  ord('Wie entsteht ein Hochmoor aus einem See? Bringe die Stufen in die richtige Reihenfolge.',['Flacher See','Verlandung mit Schilf und Seggen','Niedermoor','Hochmoor'],'Das dauert viele Jahrtausende. Viele bayerische Moore sind nach der letzten Eiszeit im Alpenvorland entstanden.'),
  mc('Wie viel der Moorflächen in Bayern sind entwässert?',['rund 95 %','rund 5 %','rund 25 %','rund 50 %'],'Entwässerte Moore setzen große Mengen CO₂ frei. Im Donaumoos, dem größten Niedermoor Süddeutschlands, ist der Boden dadurch schon um mehr als 3 Meter abgesackt.')
 ]}
];

const NEW_INFOS = [
 [{t:'Unterwegs – aber wie?', l:'Verkehr, Klima und die Wahl des Verkehrsmittels.', p:[
   'Der Verkehr verursacht rund ein Fünftel der Treibhausgase in Deutschland (2023: rund 22 %). Der allergrößte Teil stammt aus dem Straßenverkehr.',
   'Seit 1990 sind die Verkehrs-Emissionen nur wenig gesunken (bis 2023 um rund 11 %): Motoren wurden sparsamer, aber es gibt mehr und größere Autos und mehr Verkehr.',
   'Mit dem Deutschlandticket (seit Mai 2023) fährt man für einen festen Monatspreis bundesweit mit Bus, Straßenbahn und Regionalzug – ICE und IC sind nicht dabei. 2026 kostet es 63 Euro im Monat.',
   'In Deutschland sind knapp 50 Millionen Pkw zugelassen. Ein Auto steht rund 23 Stunden am Tag herum, und im Schnitt sitzen nur rund 1,4 Personen darin.',
   'Begriffe: Carsharing = Autos bei Bedarf stundenweise leihen, Pedelec = Fahrrad mit Elektro-Unterstützung, Park-and-Ride = mit dem Auto zum Bahnhof und weiter mit der Bahn, Fahrgemeinschaft = mehrere Personen fahren zusammen.',
   'E-Scooter darf man ab 14 Jahren fahren – ohne Führerschein, nur allein und nicht auf dem Gehweg.',
   'Ein Elektroauto ist über sein ganzes Leben meist klimafreundlicher als ein Benziner, obwohl die Akku-Herstellung viel CO₂ verursacht. Mit Ökostrom wird der Vorsprung größer.',
   'Antriebe: Elektroauto – Akku, Brennstoffzellenauto – Wasserstoff, Straßenbahn – Strom aus der Oberleitung, Dieselbus – Kraftstoff aus Erdöl.',
   'Werden Kinder mit dem Auto bis vors Schultor gebracht, spricht man vom „Elterntaxi“. Das sorgt für Stau und Gefahr vor Schulen.',
   'Meilensteine: erste deutsche Eisenbahn Nürnberg–Fürth (1835), Benz-Patent für das Auto mit Benzinmotor (1886), erster ICE im Linienverkehr (1991), Deutschlandticket (2023).']},
  {t:'Die Verkehrswende', l:'Wie Städte und Reisen klimafreundlicher werden.', p:[
   'In einer Fahrradstraße dürfen Radfahrende nebeneinander fahren. Autos dürfen nur hinein, wenn ein Zusatzschild es erlaubt, und für alle gilt höchstens Tempo 30.',
   'Beim Fliegen wirken auch Kondensstreifen und Stickoxide aufs Klima. Laut DLR geht nur rund ein Drittel der Klimawirkung des Luftverkehrs auf CO₂ zurück.',
   'Ein Auto-Stellplatz braucht rund 12 m² – so viel wie ein Kinderzimmer. Auf derselben Fläche passen acht bis zehn Fahrräder.',
   'In der „15-Minuten-Stadt“ erreicht man alles Wichtige in einer Viertelstunde zu Fuß oder mit dem Rad. Paris hat das Konzept bekannt gemacht.',
   'Das Prinzip der Verkehrswende: 1. Verkehr vermeiden, 2. Verkehr verlagern (auf Bahn, Bus, Rad), 3. Verkehr verbessern (saubere Antriebe).',
   'Der Motor eines Pedelecs unterstützt bis 25 km/h – rechtlich ist es ein Fahrrad. S-Pedelecs (bis 45 km/h) gelten als Kleinkraftrad.']}],
 [{t:'Der digitale Fußabdruck', l:'Streaming, Geräte und Elektroschrott.', p:[
   'Digitale Technik (Geräte, Netze, Rechenzentren) verursacht rund 2 bis 4 % der weltweiten Treibhausgase – etwa so viel wie der Flugverkehr.',
   'Videos (Streaming) machen den größten Teil des Internet-Datenverkehrs aus. Beim Streaming verbraucht oft das Gerät selbst am meisten Strom: Smartphone < Laptop < großer Fernseher.',
   'Die Übertragung zählt: Eine Stunde HD-Streaming über Glasfaser verursacht rund 2 g CO₂, über das alte 3G-Netz waren es rund 90 g (Studie für das Umweltbundesamt). Zu Hause lieber WLAN nutzen.',
   'Die durchgestrichene Mülltonne bedeutet: Das Gerät gehört nicht in den Hausmüll, sondern zum Wertstoffhof oder in eine Rücknahmestelle.',
   'Begriffe: Rechenzentrum = Gebäude voller Server, Cloud = Daten auf fremden Servern speichern, E-Schrott = ausgediente Elektrogeräte, Refurbished = generalüberholtes Gebrauchtgerät.',
   '2022 fielen weltweit rund 62 Millionen Tonnen Elektroschrott an, nur knapp ein Viertel wurde nachweislich recycelt.',
   'Große Elektrohändler und viele Supermärkte müssen kleine Altgeräte (bis 25 cm) kostenlos zurücknehmen – auch ohne Neukauf.',
   'Laut Bitkom liegen in deutschen Haushalten rund 170 Millionen ungenutzte Alt-Handys (2026) – voller Gold, Silber und anderer Rohstoffe.',
   'Seit Ende 2024 haben neue Handys in der EU einen einheitlichen USB-C-Ladeanschluss.',
   'Seit Juni 2025 gilt in der EU: Ersatzteile für Smartphones müssen noch 7 Jahre nach Verkaufsende lieferbar sein, Updates gibt es mindestens 5 Jahre.']},
  {t:'Rechenzentren & KI', l:'Wo das Internet wohnt – und was es braucht.', p:[
   'Rechenzentren verbrauchten 2024 laut IEA rund 1,5 % des weltweiten Stroms. Bis 2030 könnte sich ihr Verbrauch mehr als verdoppeln.',
   'Wichtigster Treiber ist künstliche Intelligenz (KI): Training und Nutzung großer Modelle brauchen besonders leistungsstarke Chips.',
   'Server werden heiß. Viele Rechenzentren kühlen mit Wasser – in trockenen Regionen ein Problem. Ihre Abwärme kann Wohnungen heizen.',
   'Begriffe: Server = Computer, der Daten und Dienste für andere bereitstellt, KI-Training = ein Modell lernt aus riesigen Datenmengen, Ökostrom = Strom aus Sonne, Wind und Wasser. Das Energieeffizienzgesetz verlangt ab 2027 100 % Ökostrom für Rechenzentren.',
   'Rebound-Effekt: Technik wird sparsamer, wird dadurch aber mehr genutzt – am Ende wird kaum Energie gespart.',
   'Datenmengen: Kilobyte < Megabyte < Gigabyte < Terabyte – jede Stufe ist rund 1.000-mal größer.']}],
 [{t:'Deine Rechte', l:'Die UN-Kinderrechtskonvention und was sie für dich bedeutet.', p:[
   'Die UN-Kinderrechtskonvention wurde am 20. November 1989 beschlossen. Der 20. November ist der Internationale Tag der Kinderrechte.',
   'Sie hat 54 Artikel und gilt für alle Menschen unter 18 Jahren (Artikel 1).',
   '196 Staaten haben sie ratifiziert – nur die USA nicht.',
   'Wichtige Rechte: Bildung (Art. 28), Freizeit und Spiel (Art. 31), Schutz vor Gewalt (Art. 19), Beteiligung (Art. 12): Kinder dürfen bei allem, was sie betrifft, ihre Meinung sagen, und sie muss berücksichtigt werden.',
   'Vorrang des Kindeswohls (Art. 3): Bei allen Entscheidungen, die Kinder betreffen, steht ihr Wohl an erster Stelle.',
   'In Deutschland haben Kinder seit 2000 ein gesetzliches Recht auf gewaltfreie Erziehung.',
   'Bei der „Nummer gegen Kummer“ (116 111) gibt es kostenlose und anonyme Hilfe.',
   'UNICEF ist das Kinderhilfswerk der Vereinten Nationen, gegründet 1946.',
   'Zeitleiste: Genfer Erklärung der Rechte des Kindes (1924), UNICEF (1946), UN-Kinderrechtskonvention (1989), in Deutschland in Kraft (1992).',
   'Im Grundgesetz stehen Kinderrechte bisher nicht ausdrücklich (Stand 2026) – dafür fehlt eine Zwei-Drittel-Mehrheit.']},
  {t:'Kinderrechte heute', l:'Klima, Internet und Mitbestimmung.', p:[

  {t:'Moore – nasse Klimaschützer', l:'Wie Moore wachsen und warum sie nass bleiben müssen.', p:[

/* Speicherstand absichern: falsche Typen aus alten/kaputten Ständen (oder Sicherungscodes) durch Standardwerte ersetzen */
function sanitize(s){
  const d = defaults(), r = Object.assign(defaults(), s);
  Object.keys(d).forEach(k=>{ const def = d[k]; if(Array.isArray(def) ? !Array.isArray(r[k]) : (def!==null && (r[k]===null || typeof r[k]!==typeof def))) r[k] = def; });
  if(!['learn','practice','shop','badges','profile'].includes(r.tab)) r.tab = 'learn';
  return r;
}

  if(S.hearts>=MAX_H){ S.heartsTs = Date.now(); return; }
  while(S.hearts<MAX_H && Date.now()-S.heartsTs >= HEART_MS){ S.hearts++; S.heartsTs += HEART_MS; }
  if(S.hearts>=MAX_H) S.heartsTs = Date.now();
}

function recap(endOffset){
  let xp = 0, lessons = 0, active = 0; const per = {};
  for(let i=0;i<7;i++){ const d = new Date(); d.setDate(d.getDate()-endOffset-i); const k = dayKey(d), ds = S.dstat[k];
    xp += S.log[k]||0; if((S.log[k]||0)>0) active++;
    if(ds){ lessons += ds.l; Object.keys(ds.u).forEach(u=>{ const p = per[u] || (per[u] = [0,0]); p[0] += ds.u[u][0]; p[1] += ds.u[u][1]; }); } }
  const ranked = Object.keys(per).filter(u=>per[u][0]>=3).map(u=>({u, r:per[u][1]/per[u][0], n:per[u][0]})).sort((a,b)=>b.r-a.r || b.n-a.n);
  return {xp, lessons, active, best: ranked[0], worst: ranked.length>1 ? ranked[ranked.length-1] : null};
}

      const t = t0+i*dur; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+dur*1.8);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur*2); });
  }catch(e){}
}

/* u = -1 ist die AG-Einheit (eigener Pfad mit 3 Lektionen, von Anfang an frei) */
const unitOf = u => u<0 ? AG : UNITS[u];
const lessonName = (u,k) => u<0 ? AG.names[k] : LESSON_NAMES[k];
const nodeId = (u,k) => (u<0 ? 'ag' : u)+'-'+k;
const flat = () => UNITS.flatMap((_,u)=>[0,1,2,3].map(k=>[u,k]));
function currentG(){ const f = flat(); const i = f.findIndex(([u,k])=>!S.done[nodeId(u,k)]); return i<0 ? f.length : i; }
function nodeState(u,k){
  if(S.done[nodeId(u,k)]) return 'done';
  if(u<0) return (k===0 || S.done[nodeId(u,k-1)]) ? 'current' : 'locked';
  return u*4+k===currentG() ? 'current' : 'locked';
}
function lessonQs(u,k){
  const qs = unitOf(u).qs;
  if(k===3) return shuffle(qs).slice(0,10);
  return shuffle(qs.slice(k*6, k*6+6));   /* jede Lektion hat ihre eigenen 6 Aufgaben */
}

function modal(html){ $('#mbox').innerHTML = html; $('#modal').hidden = false; const b = $('#mbox').querySelector('.btn'); if(b) b.focus({preventScroll:true}); $('#mbox').scrollTop = 0; }
function closeModal(){ stopQr(); $('#modal').hidden = true; $('#mbox').classList.remove('infobox'); if(S.tab==='learn' && $('#lesson').hidden && $('#result').hidden) renderLearn(); }
$('#modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeModal(); });
function heartsModal(fromLesson){
  regen();
  const hs = Array.from({length:MAX_H},(_,i)=>icon('heart', i<S.hearts?'':'empty')).join('');
  modal(`${mascot(S.hearts?'happy':'sad')}<h2>${S.hearts?'Deine Herzen':'Keine Herzen mehr'}</h2><div class="hrow">${hs}</div>
   <p>${S.hearts>=MAX_H?'Alle Herzen sind voll. Jeder Fehler in einer Lektion kostet ein Herz.':'Nächstes Herz in '+nextHeartIn()+' Minuten. Im Training gewinnst du ein Herz sofort zurück.'}</p>
   ${fromLesson && S.hearts>0 ? `<button class="btn block" data-act="resume">Weiterlernen</button>` : ''}
   ${S.hearts<MAX_H?`<button class="btn ${fromLesson && S.hearts>0?'ghost':''} block" data-act="mix">Üben, um Herzen zu verdienen</button>`:''}
   <button class="btn plain block" data-act="${fromLesson?'endLesson':'close'}">${fromLesson?'Lektion beenden':'Schließen'}</button>`);
}

/* ================= Lektion ================= */
let L = null, blitzTimer = null;
function startLesson(opts){
  closeModal();
  regen();
  const needsHearts = opts.mode==='lesson'||opts.mode==='test';
  if(needsHearts && S.hearts<=0){ heartsModal(false); return; }
  let queue;
  if(opts.mode==='lesson'||opts.mode==='test') queue = lessonQs(opts.u, opts.k);
  else if(opts.mode==='mix'){ const us = UNITS.filter((_,u)=>u===0||S.done[nodeId(u,0)]); queue = shuffle(us.flatMap(u=>u.qs)).slice(0,8); }
  else if(opts.mode==='missed'){ S.missed = S.missed.filter(byId); queue = shuffle(S.missed.map(byId)).slice(0,10); if(!queue.length){ save(); render(); return; } }
  else if(opts.mode==='blitz') queue = shuffle(UNITS.flatMap(u=>u.qs).filter(q=>q.t==='mc'||q.t==='tf'));
  else if(opts.mode==='review'){ queue = shuffle(srsDue().map(byId)).slice(0,10); if(!queue.length){ render(); return; } }
  else if(opts.mode==='beamer') queue = unitOf(opts.u).qs.slice();   /* Klassen-Modus: alle 18 Aufgaben der Einheit in Reihenfolge */
  L = Object.assign({queue, total:queue.length, done:0, mistakes:0, answered:0, combo:0, maxCombo:0, t0:Date.now(), phase:'answer', retry:{}}, opts);
  $('#lesson').hidden = false; document.body.style.overflow = 'hidden';
  $('#lesson').classList.toggle('beamer', L.mode==='beamer');
  $('#quit').innerHTML = icon('close');
  $('#prog').className = 'prog'+(L.mode==='blitz'?' timer':'');
  $('#sheet').className = 'sheet';
  if(L.mode==='blitz'){
    L.score = 0; L.end = Date.now()+60000;
    $('#check').hidden = true; $('#hint').textContent = 'Tippe die richtige Antwort!';
    clearInterval(blitzTimer);
    blitzTimer = setInterval(()=>{ const left = L.end-Date.now(); $('#prog i').style.width = Math.max(0,left/600)+'%'; if(left<=0){ clearInterval(blitzTimer); finish(); } },100);
  } else { $('#check').hidden = false; $('#hint').textContent = ''; }
  updLStat(); nextQ();
}
function updLStat(){
  if(L.mode==='blitz'){ $('#lstat').className = 'lstat score'; $('#lstat').innerHTML = icon('bolt')+L.score; return; }
  $('#lstat').className = 'lstat';
  $('#lstat').innerHTML = (L.mode==='lesson'||L.mode==='test') ? icon('heart')+S.hearts : L.mode==='beamer' ? 'Aufgabe '+Math.min(L.done+1,L.total)+' von '+L.total : icon(L.mode==='review'?'clock':'dumbbell');
  $('#prog i').style.width = (L.done/L.total*100)+'%';
}
const TYPE_LABEL = {mc:['Wähle die richtige Antwort','bulb'], tf:['Stimmt das?','chat'], fill:['Ergänze den Satz','chat'], order:['Bring es in die richtige Reihenfolge','shuffle'], match:['Finde die Paare','shuffle']};
function nextQ(){
  if(L.mode==='blitz' && Date.now()>=L.end) return;
  if(!L.queue.length){ if(L.mode==='blitz'){ L.queue = shuffle(UNITS.flatMap(u=>u.qs).filter(q=>q.t==='mc'||q.t==='tf')); } else { finish(); return; } }
  const q = L.q = L.queue.shift();
  L.phase = 'answer'; L.sel = null;
  const oldCont = $('#cont'); if(oldCont){ oldCont.disabled = true; oldCont.blur(); }
  $('#sheet').className = 'sheet';
  const chk = $('#check'); chk.disabled = true; chk.textContent = 'Überprüfen'; chk.className = 'btn';
  const [lab, ic] = TYPE_LABEL[q.t];
  const isRetry = L.mode==='missed' || !!L.retry[q.id];
  $('#lesson').classList.toggle('retry', isRetry);
  const combo = L.combo>=3 ? `${L.combo} in Folge richtig!` : '';
  let h = isRetry ? `<div class="retrytag">${icon('redo')}Wiederholung – ${L.mode==='missed'?'war schon mal falsch':'das war vorhin falsch'}</div>` : `<div class="combo">${combo}</div>`;
  h += `<div class="qtype">${icon(ic)}${lab}</div>`;
  if(q.t==='mc'||q.t==='tf'){
    L.opts = q.t==='tf' ? [{t:'Stimmt',ok:q.a===true,ic:'check'},{t:'Stimmt nicht',ok:q.a===false,ic:'x'}] : shuffle(q.o.map((t,i)=>({t,ok:i===0})));
    h += q.t==='tf' ? `<div class="qhead">${mascot('wow')}<div class="say">${q.q}</div></div>` : `<h2 class="qtext">${q.q}</h2>`;
    h += `<div class="opts ${q.t==='tf'?'tf':''}">${L.opts.map((o,i)=>`<button class="opt" data-opt="${i}">${q.t==='tf'?icon(o.ic,'big'):`<span class="k">${i+1}</span>`}<span>${o.t}</span></button>`).join('')}</div>`;
  } else if(q.t==='fill'){
    L.opts = shuffle(q.o.map((t,i)=>({t,ok:i===0})));
    const [a,b] = q.q.split('___');
    h += `<p class="sentence">${a}<span class="blank" id="blank">&nbsp;</span>${b}</p><div class="chips">${L.opts.map((o,i)=>`<button class="chip" data-fill="${i}">${o.t}</button>`).join('')}</div>`;
  } else if(q.t==='order'){
    let s; do { s = shuffle(q.o); } while(s.join()===q.o.join());
    L.pool = s; L.ans = [];
    h += `<h2 class="qtext">${q.q}</h2><div class="slots" id="slots"></div><div class="orderpool" id="opool"></div>`;
  } else if(q.t==='match'){
    L.left = shuffle(q.p.map((p,i)=>({t:p[0],i}))); L.right = shuffle(q.p.map((p,i)=>({t:p[1],i}))); L.matched = 0; L.mSel = null; L.mErr = 0;
    h += `<h2 class="qtext">${q.q}</h2><div class="mgrid"><div class="mcol">${L.left.map(o=>`<button class="chip" data-m="L" data-i="${o.i}">${o.t}</button>`).join('')}</div><div class="mcol">${L.right.map(o=>`<button class="chip" data-m="R" data-i="${o.i}">${o.t}</button>`).join('')}</div></div>`;
    chk.textContent = 'Paare finden';
  }
  $('#qarea').innerHTML = h;
  if(q.t==='order') drawOrder();
  $('.qwrap').scrollTop = 0;
}
function drawOrder(){
  const q = L.q;
  $('#slots').innerHTML = q.o.map((_,i)=>`<div class="slot"><span class="n">${i+1}</span>${L.ans[i]!==undefined?`<button class="chip" data-unord="${i}">${L.pool[L.ans[i]]}</button>`:''}</div>`).join('');
  $('#opool').innerHTML = L.pool.map((t,i)=>`<button class="chip ${L.ans.includes(i)?'used':''}" data-ord="${i}" ${L.ans.includes(i)?'tabindex="-1" aria-hidden="true"':''}>${t}</button>`).join('');
  $('#check').disabled = L.ans.length!==q.o.length;
}
function pick(i){
  if(L.phase!=='answer') return;
  const q = L.q;
  if(q.t==='mc'||q.t==='tf'){
    if(i>=L.opts.length) return;
    if(L.mode==='blitz'){ blitzAnswer(i); return; }
    L.sel = i;
    document.querySelectorAll('.opt').forEach((b,j)=>b.classList.toggle('sel', j===i));
    $('#check').disabled = false;
  } else if(q.t==='fill'){
    if(i>=L.opts.length) return;
    L.sel = i;
    document.querySelectorAll('[data-fill]').forEach((b,j)=>b.classList.toggle('sel', j===i));
    const bl = $('#blank'); bl.textContent = L.opts[i].t; bl.classList.add('filled');
    $('#check').disabled = false;
  }
  tone([520],'sine',.05,.05);
}
function blitzAnswer(i){
  const ok = L.opts[i].ok, btns = document.querySelectorAll('.opt');
  L.phase = 'wait';
  btns.forEach((b,j)=>{ b.disabled = true; if(L.opts[j].ok) b.classList.add('right'); });
  if(ok){ L.score++; L.combo++; S.correct++; sOk(); } else { btns[i].classList.add('wrong'); L.combo = 0; sBad(); }
  S.answered++; L.answered++; if(!ok) L.mistakes++;
  updLStat();
  setTimeout(()=>{ if(L && L.mode==='blitz' && Date.now()<L.end) nextQ(); }, ok?380:900);
}
function check(){
  const q = L.q; let ok = false, sol = '';
  if(q.t==='mc'||q.t==='tf'){ ok = L.opts[L.sel].ok; sol = L.opts.find(o=>o.ok).t;
    document.querySelectorAll('.opt').forEach((b,j)=>{ b.disabled = true; if(L.opts[j].ok) b.classList.add('right'); else if(j===L.sel) b.classList.add('wrong'); }); }
  else if(q.t==='fill'){ ok = L.opts[L.sel].ok; sol = q.q.replace('___', q.o[0]); document.querySelectorAll('[data-fill]').forEach(b=>b.disabled = true); }
  else if(q.t==='order'){ ok = L.ans.map(i=>L.pool[i]).join('|')===q.o.join('|'); sol = q.o.join(' → '); document.querySelectorAll('#qarea .chip').forEach(b=>b.disabled = true); }
  else if(q.t==='match'){ ok = true; }
  feedback(ok, sol);
}
function feedback(ok, sol){
  const q = L.q, own = L.mode!=='beamer';   /* Klassen-Modus zählt nicht für den eigenen Fortschritt */
  L.phase = 'feedback'; L.answered++;
  if(own){ S.answered++; if(ok) S.correct++; statAnswer(q, ok); if(!L.retry[q.id]) srsMark(q, ok, L.mode==='review'); }
  if(ok){ L.done++; L.combo++; L.maxCombo = Math.max(L.maxCombo, L.combo); sOk();
    if(L.mode==='missed') S.missed = S.missed.filter(id=>id!==q.id);
  } else { L.mistakes++; L.combo = 0; sBad();
    if(own && !S.missed.includes(q.id)) S.missed.push(q.id);
    if(L.mode==='beamer'){ L.done++; }   /* im Klassen-Modus einfach weiter – Auflösung steht im Feedback */
    else {
      L.retry[q.id] = true;
      if(L.mode==='lesson'||L.mode==='test'){ L.queue.push(q); if(S.hearts>=MAX_H) S.heartsTs = Date.now(); S.hearts = Math.max(0,S.hearts-1); }
      else if(L.mode==='mix'||L.mode==='missed'||L.mode==='review'){ L.queue.push(q); }
    }
  }
  save(); updLStat();
  const praise = PRAISE[Math.floor(Math.random()*PRAISE.length)];
  $('#sheetIn').innerHTML = `<div class="t"><span class="dot">${icon(ok?'check':'x')}</span>${ok?praise:'Nicht ganz.'}</div>
    ${ok?'':`<div class="sol">Richtige Antwort: ${sol}</div>`}
    <div class="fact"><b>Wusstest du?</b> ${q.x}</div>
    <button class="btn block" id="cont">Weiter</button>`;
  $('#sheet').className = 'sheet show '+(ok?'ok':'bad');
  $('#cont').focus();
}
function cont(){
  if(!L || L.phase!=='feedback') return;   /* Doppeltipp auf „Weiter“ darf keine Frage überspringen */
  if((L.mode==='lesson'||L.mode==='test') && S.hearts<=0){ heartsModal(true); return; }
  nextQ();
}
function quitLesson(){
  modal(`${mascot('sad')}<h2>Wirklich aufhören?</h2><p>Dein Fortschritt in dieser Lektion geht verloren.</p><button class="btn block" data-act="close">Weiterlernen</button><button class="btn plain block" data-act="endLesson">Beenden</button>`);
}
function endLesson(){ clearInterval(blitzTimer); L = null; $('#lesson').classList.remove('retry','beamer'); closeModal(); $('#lesson').hidden = true; document.body.style.overflow = ''; render(true); }
function finish(){
  const m = L.mode; clearInterval(blitzTimer);
  let xp, title, sub;
  if(m==='blitz'){ xp = L.score; const rec = L.score>S.blitzBest; if(rec) S.blitzBest = L.score; title = rec&&L.score?'Neuer Rekord!':'Zeit ist um!'; sub = `${L.score} ${L.score===1?'richtige Antwort':'richtige Antworten'} in 60 Sekunden.`; }
  else if(m==='beamer'){ xp = 0; const right = L.answered-L.mistakes;
    title = 'Klassenquiz beendet!'; sub = `${unitOf(L.u).t}: ${right} von ${L.total} Aufgaben richtig gelöst.`; }
  else {
    const perfect = L.mistakes===0;
    xp = (m==='test'?20:m==='lesson'?10:5) + (perfect?5:0) + Math.floor(L.maxCombo/5)*2;
    statDay().l++;
    if(m==='lesson'||m==='test'){ S.done[nodeId(L.u,L.k)] = true; S.lessons++; }
    if(m==='mix'||m==='missed'){ S.hearts = Math.min(MAX_H, S.hearts+1); }
    if(perfect) S.perfect++;
    title = m==='test' ? 'Einheit gemeistert!' : perfect ? 'Fehlerfrei!' : 'Lektion geschafft!';
    sub = m==='test' ? `Du hast „${UNITS[L.u].t}“ abgeschlossen.` : m==='lesson' ? `${unitOf(L.u).t} · ${lessonName(L.u,L.k)}` : m==='review' ? `Wiederholung geschafft – noch ${srsDue().length} fällig.` : 'Training abgeschlossen – +1 Herz.';
  }
  const boosted = S.boost && xp>0;
  if(boosted){ xp *= 2; S.boost = false; }
  const before = todayXp();
  const streakUp = xp>0 ? addXp(xp) : false;
  const goalHit = before<S.goal && todayXp()>=S.goal;
  const nb = checkBadges(); save();
  const acc = L.answered ? Math.round((L.answered-L.mistakes)/L.answered*100) : 0;
  const secs = Math.round((Date.now()-L.t0)/1000), tm = Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');
  $('#resultIn').innerHTML = `${mascot('cheer')}<h1>${title}</h1><p class="sub">${sub}</p>
   <div class="rt">
     <div style="--k:var(--lime)"><span>XP</span><b style="color:var(--leafText)">${icon('leaf')}${xp}</b></div>
     <div style="--k:var(--sprout)"><span>Genauigkeit</span><b>${icon('target')}${acc}%</b></div>
     <div style="--k:var(--mist)"><span>Zeit</span><b>${icon('clock')}${tm}</b></div>
   </div>
   ${boosted?`<div class="streakline">${icon('bolt')}Doppel-XP eingelöst!</div>`:''}
   ${streakUp?`<div class="streakline">${icon('flame')}${S.streak} ${S.streak===1?'Tag':'Tage'} Serie!</div>`:''}
   ${goalHit?`<div class="streakline" style="color:var(--leafText)">${icon('target')}Tagesziel von ${S.goal} XP erreicht!</div>`:''}
   ${nb.map(b=>`<div class="newb"><div class="medal">${icon(b.ic)}</div><div>Neues Abzeichen: ${b.t}<small>${b.d}</small></div></div>`).join('')}
   <button class="btn" id="resDone">Weiter</button>`;
  $('#lesson').hidden = true; $('#lesson').classList.remove('retry','beamer'); $('#result').hidden = false; L = null;
  sWin(); confetti();
  $('#resDone').focus();
}

/* ================= Konfetti ================= */
function confetti(){
  if(reduced) return;
  const c = $('#confetti'), x = c.getContext('2d'), W = c.width = innerWidth, H = c.height = innerHeight;
  const cols = ['#2E6417','#00BF63','#7ED957','#C1FF72','#D9F2CA','#FF9600'];
  const P = Array.from({length:140},()=>({x:W/2+(Math.random()-.5)*W*.3, y:H*.35, vx:(Math.random()-.5)*14, vy:-Math.random()*14-4, r:Math.random()*6.28, vr:(Math.random()-.5)*.3, w:6+Math.random()*6, h:4+Math.random()*6, c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0 = performance.now();
  (function f(t){ x.clearRect(0,0,W,H);
    P.forEach(p=>{ p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.w/2,-p.h/2,p.w,p.h); x.restore(); });
    if(t-t0<3200) requestAnimationFrame(f); else x.clearRect(0,0,W,H); })(t0);
}

/* ================= Events ================= */
document.addEventListener('click', e=>{
  const t = e.target.closest('button'); if(!t) return;
  if(t.dataset.tab){ if(!$('#modal').hidden) closeModal(); S.tab = t.dataset.tab; save(); render(t.dataset.tab==='learn'); return; }
  if(t.classList.contains('node')){
    const u = +t.dataset.u, k = +t.dataset.k, st = nodeState(u,k), un = unitOf(u);
    modal(`<div class="eb">${u<0?'MMG-Special':'Einheit '+(u+1)} · ${un.t}</div><h2>${lessonName(u,k)}</h2>
      <p>${st==='locked' ? 'Schließe zuerst die vorherigen Lektionen ab, um diese freizuschalten.' : k===3 ? '10 Fragen aus der ganzen Einheit. Bestehe den Test, um die nächste Einheit freizuschalten.' : (k===0?'Lektion 1 von 3':k===1?'Lektion 2 von 3':'Lektion 3 von 3')+' · 6 Fragen'}</p>
      ${st==='locked' ? `<button class="btn block" disabled>${icon('lock')} Gesperrt</button>` : `<button class="btn block" data-act="start" data-u="${u}" data-k="${k}">${st==='done'?'Wiederholen':'Starten'} · +${k===3?20:10} XP</button>`}
      <button class="btn plain block" data-act="close">Schließen</button>`);
    return;
  }
  if(t.dataset.info){
    const [u,n] = t.dataset.info.split('|').map(Number), inf = u<0 ? INFOS_AG[n] : INFOS[u][n], k = n*2, st = nodeState(u,k);
    const next = st==='locked' ? '' : `<button class="btn block" data-act="start" data-u="${u}" data-k="${k}" data-read="${u}-${n}">Weiter zu „${lessonName(u,k)}“</button>`;
    $('#mbox').classList.add('infobox');
    modal(`<div class="top">${mascot('happy')}<div><div class="eb">${u<0?'MMG-Special':'Einheit '+(u+1)} · ${unitOf(u).t}</div><h2>${inf.t}</h2></div></div><p>${inf.l}</p>
      <ul>${inf.p.map(x=>`<li>${x}</li>`).join('')}</ul>
      ${next}<button class="btn ${next?'plain':''} block" data-act="close" data-read="${u}-${n}">${next?'Später':'Verstanden'}</button>`);
    return;
  }
  if(t.dataset.read && !S.read[t.dataset.read]){ S.read[t.dataset.read] = true; save(); }
  if(t.dataset.buy) return buy(t.dataset.buy);
  if(t.dataset.wear){ S.outfit = S.outfit===t.dataset.wear ? '' : t.dataset.wear; save(); renderShop(); $('#logoMark').innerHTML = mascot('happy'); return; }
  const a = t.dataset.act;
  if(a==='start') return startLesson({mode:+t.dataset.k===3?'test':'lesson', u:+t.dataset.u, k:+t.dataset.k});
  if(a==='blitz') return startLesson({mode:'blitz'});
  if(a==='mix'){ if(L){ clearInterval(blitzTimer); L = null; $('#lesson').hidden = true; } return startLesson({mode:'mix'}); }
  if(a==='missed') return startLesson({mode:'missed'});
  if(a==='close') return closeModal();
  if(a==='review') return startLesson({mode:'review'});
  if(a==='beamerPick') return modal(`<div class="eb">Klassen-Modus</div><h2>Welche Einheit?</h2><p>Alle 18 Aufgaben der Einheit am Beamer – die Klasse berät, du tippst die Antwort.</p>
      ${[-1].concat(UNITS.map((_,i)=>i)).map(u=>`<button class="btn ghost block" data-beamer="${u}">${u<0?'MMG-Special: AG':'Einheit '+(u+1)+': '+UNITS[u].t}</button>`).join('')}
      <button class="btn plain block" data-act="close">Abbrechen</button>`);
  if(t.dataset.beamer!==undefined) return startLesson({mode:'beamer', u:+t.dataset.beamer});
  if(t.dataset.bgwear){ S.bg = S.bg===t.dataset.bgwear ? '' : t.dataset.bgwear; save(); applyBg(); renderShop(); return; }
  if(a==='shareApk'){ try{ GGAFApp.shareApk(SHARE_TEXT); }catch(err){ modal(`<h2>Teilen nicht möglich</h2><p>${esc(err.message)}</p><button class="btn block" data-act="close">OK</button>`); } return; }
  if(a==='qrShare') return showQr();
  if(a==='backup') return showBackup();
  if(a==='copyCode'){ copyText($('#codeOut')); return; }
  if(a==='shareCode'){ try{ GGAFApp.shareText('Mein GGAF-Quizzes!-Sicherungscode:\n'+$('#codeOut').value); }catch(err){} return; }
  if(a==='restore') return modal(`<h2>Sicherungscode einfügen</h2><p>Füge den Code ein, den du auf deinem alten Gerät erstellt hast. <b>Dein aktueller Fortschritt wird dabei ersetzt.</b></p>
      <textarea class="codebox" id="codeIn" placeholder="GGAF1-…" aria-label="Sicherungscode"></textarea><p id="codeErr" class="why" hidden></p>
      <button class="btn block" data-act="doRestore">Fortschritt laden</button><button class="btn plain block" data-act="close">Abbrechen</button>`);
  if(a==='doRestore'){ const s = decodeBackup($('#codeIn').value);
    if(!s){ const e = $('#codeErr'); e.textContent = 'Dieser Code ist ungültig. Prüfe, ob du ihn vollständig kopiert hast.'; e.hidden = false; return; }
    S = s; save(); applyBg(); $('#logoMark').innerHTML = mascot('happy'); closeModal(); render();
    modal(`${mascot('cheer')}<h2>Fortschritt geladen!</h2><p>${S.xp} XP, ${S.lessons} Lektionen und ${Object.keys(S.badges).length} Abzeichen sind zurück.</p><button class="btn block" data-act="close">Super</button>`); return; }
  if(a==='introNext') return showIntro(introStep+1);
  if(a==='introBack') return showIntro(introStep-1);
  if(a==='introDone') return closeIntro();
  if(a==='intro') return showIntro(0);
  if(t.dataset.igoal){ S.goal = +t.dataset.igoal; const n = $('#introName'); if(n) S.name = n.value.trim(); save(); showIntro(introStep); return; }
  if(a==='resume'){ closeModal(); if(L && S.hearts>0) nextQ(); return; }
  if(a==='endLesson') return endLesson();
  if(a==='reset') return modal(`${mascot('sad')}<h2>Alles zurücksetzen?</h2><p>XP, Serie, Abzeichen und freigeschaltete Lektionen werden gelöscht.</p><button class="btn red block" data-act="doReset">Ja, zurücksetzen</button><button class="btn plain block" data-act="close">Abbrechen</button>`);
  if(a==='doReset'){ S = defaults(); S.tab = 'learn'; save(); closeModal(); applyBg(); $('#logoMark').innerHTML = mascot('happy'); render(); showIntro(0); return; }
  if(t.id==='stHearts') return heartsModal(false);
  if(t.id==='stStreak') return modal(`${mascot(streakNow()?'cheer':'wow')}<h2>${streakNow()} ${streakNow()===1?'Tag':'Tage'} Serie</h2><p>${S.lastDay===dayKey()?'Heute schon gelernt – deine Serie ist sicher!':'Mach heute eine Lektion, um deine Serie '+(streakNow()?'zu verlängern':'zu starten')+'.'}</p><button class="btn block" data-act="close">Weiter</button>`);
  if(t.id==='stXp') return modal(`${mascot('happy')}<h2>${balance()} XP zum Ausgeben</h2><p>Insgesamt verdient: ${S.xp} XP · heute: ${todayXp()} von ${S.goal} XP. Lektionen bringen 10 XP, Einheitstests 20 XP, fehlerfreie Runden +5. Im Shop tauschst du XP gegen Hilfen und Outfits.</p><button class="btn block" data-tab="shop">Zum Shop</button><button class="btn plain block" data-act="close">Schließen</button>`);
  if(t.id==='quit') return L && L.mode==='blitz' ? endLesson() : quitLesson();
  if(t.id==='check') return (L && L.phase==='answer') ? check() : null;
  if(t.id==='cont') return cont();
  if(t.id==='resDone'){ $('#result').hidden = true; document.body.style.overflow = ''; render(true); return; }
  if(t.id==='snd'){ S.sound = !S.sound; save(); t.setAttribute('aria-checked', S.sound); if(S.sound) sOk(); return; }
  if(t.dataset.goal){ S.goal = +t.dataset.goal; save(); renderProfile(); return; }
  if(!L) return;
  if(t.dataset.opt!==undefined) return pick(+t.dataset.opt);
  if(t.dataset.fill!==undefined) return pick(+t.dataset.fill);
  if(t.dataset.ord!==undefined && L.phase==='answer'){ L.ans.push(+t.dataset.ord); tone([520],'sine',.05,.05); return drawOrder(); }
  if(t.dataset.unord!==undefined && L.phase==='answer'){ L.ans.splice(+t.dataset.unord,1); return drawOrder(); }
  if(t.dataset.m && L.phase==='answer'){
    const side = t.dataset.m, i = +t.dataset.i;
    if(!L.mSel || L.mSel.side===side){
      document.querySelectorAll('[data-m].sel').forEach(b=>b.classList.remove('sel'));
      t.classList.add('sel'); L.mSel = {side,i,el:t}; tone([520],'sine',.05,.05); return;
    }
    if(L.mSel.i===i){ [t, L.mSel.el].forEach(b=>{ b.classList.remove('sel'); b.classList.add('done'); }); L.matched++; tone([700,900],'sine',.06,.08);
      t.disabled = true; L.mSel.el.disabled = true;
      L.mSel = null;
      if(L.matched===L.q.p.length){ const q = L.q; L.phase = 'wait';
        /* Match gilt nur als richtig, wenn kein falsches Paar gewählt wurde */
        setTimeout(()=>{ if(L && L.q===q){ L.phase = 'answer'; feedback(L.mErr===0, q.p.map(p=>p[0]+' → '+p[1]).join(' · ')); } }, 250); }
    } else { const o = L.mSel.el; [t,o].forEach(b=>{ b.classList.remove('sel'); b.classList.add('shake'); setTimeout(()=>b.classList.remove('shake'),400); }); L.mSel = null; L.mErr++; sBad(); }
  }
});
document.addEventListener('input', e=>{ if(e.target.id==='name'){ S.name = e.target.value.trim(); save(); } });
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && !$('#modal').hidden){ closeModal(); return; }
  if(!L || $('#lesson').hidden || !$('#modal').hidden || e.target.tagName==='INPUT') return;
  if(/^[1-9]$/.test(e.key)) pick(+e.key-1);
  if(e.key==='Enter'){ const f = document.activeElement; if(f && f.tagName==='BUTTON' && f.id!=='check' && f.id!=='cont') return;   /* Enter auf fokussiertem Button (z. B. ✕) normal auslösen */
    e.preventDefault(); if(L.phase==='answer' && !$('#check').disabled && !$('#check').hidden) check(); else if(L.phase==='feedback') cont(); }
});
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && $('#lesson').hidden && $('#result').hidden){ const s = streakNow(); applyFreeze(); regen(); if(s!==streakNow()) render(); else renderTop(); } });
setInterval(()=>{ if($('#lesson').hidden && $('#result').hidden){ const h = S.hearts; regen(); if(h!==S.hearts){ save(); renderTop(); } } }, 30000);

/* ================= Teilen, QR-Code, Sicherung ================= */
const SHARE_TEXT = 'Hol dir GGAF Quizzes! – Going green and Fair, die Lern-App der AG „Going green und fair“ am MMG.\n\nSo installierst du sie (nur Android):\n1. Öffne die angehängte Datei „GGAF-Quizzes.apk“.\n2. Falls gefragt: Erlaube „Installation aus unbekannten Quellen“ für die App, mit der du die Datei geöffnet hast.\n3. Tippe auf „Installieren“ – fertig!';
let qrOn = false;
function showQr(){
  let url = '';
  try{ url = GGAFApp.startServer(); }catch(e){}
  if(!url){ modal(`${mascot('sad')}<h2>Kein WLAN gefunden</h2><p>Verbinde dein Handy mit einem WLAN (oder schalte deinen Hotspot ein) und versuche es noch einmal.</p><button class="btn block" data-act="close">OK</button>`); return; }
  qrOn = true;
  let img = '';
  try{ const qr = qrcode(0,'M'); qr.addData(url); qr.make(); img = qr.createImgTag(6, 8); }catch(e){ img = ''; }
  modal(`<div class="eb">Im selben WLAN teilen</div><h2>QR-Code scannen</h2>
    ${img?`<div class="qrbox">${img}</div>`:''}<div class="qrurl">${esc(url)}</div>
    <ol><li>Dein*e Freund*in muss im selben WLAN sein wie du.</li><li>Mit der Handykamera den QR-Code scannen und die Seite öffnen.</li><li>„App herunterladen“ antippen, die Datei öffnen und installieren.</li></ol>
    <p>Lass diese Anzeige offen, bis der Download fertig ist.</p>
    <button class="btn block" data-act="close">Fertig</button>`);
}
function stopQr(){ if(qrOn){ qrOn = false; try{ GGAFApp.stopServer(); }catch(e){} } }
function encodeBackup(){ return 'GGAF1-' + btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }
function decodeBackup(code){
  try{ const raw = String(code).replace(/\s+/g,''); if(raw.indexOf('GGAF1-')!==0) return null;
    const obj = JSON.parse(decodeURIComponent(escape(atob(raw.slice(6)))));
    if(!obj || typeof obj.xp!=='number') return null;
    return sanitize(obj); }catch(e){ return null; }
}
function showBackup(){
  modal(`<h2>Dein Sicherungscode</h2><p>Kopiere den Code und bewahre ihn gut auf – zum Beispiel in einer Notiz oder als Nachricht an dich selbst.</p>
    <textarea class="codebox" id="codeOut" readonly aria-label="Sicherungscode">${esc(encodeBackup())}</textarea>
    <button class="btn block" data-act="copyCode">Code kopieren</button>
    ${window.GGAFApp?'<button class="btn ghost block" data-act="shareCode">Code teilen / an mich senden</button>':''}
    <button class="btn plain block" data-act="close">Schließen</button>`);
}
function copyText(ta){
  const done = ()=>{ const b = document.querySelector('[data-act="copyCode"]'); if(b) b.textContent = 'Kopiert!'; };
  const fallback = ()=>{ ta.focus(); ta.select(); try{ if(document.execCommand('copy')) done(); }catch(e){} };
  try{ if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(ta.value).then(done, fallback); } else fallback(); }catch(e){ fallback(); }
}
/* Wochenrückblick: am ersten App-Start einer neuen Woche die Vorwoche zeigen */
function weeklyRecap(){
  const ws = weekStart(); if(S.recapWeek===ws) return;
  const first = !S.recapWeek; S.recapWeek = ws; save();
  if(first) return;
  const r = recap((new Date().getDay()+6)%7 + 1);
  if(!r.xp) return;
  modal(`${mascot('cheer')}<div class="eb">Wochenrückblick</div><h2>Deine letzte Woche</h2>${recapHTML(r)}<button class="btn block" data-act="close">Weiter geht’s</button>`);
}

let introStep = 0;
function showIntro(i){
  introStep = Math.max(0, Math.min(INTRO.length-1, i));
  const s = INTRO[introStep], last = introStep===INTRO.length-1;
  const form = s.form ? `<div class="form">
      <label class="field" for="introName">Wie soll ich dich nennen?<input id="introName" maxlength="24" placeholder="Dein Vorname (freiwillig)" value="${esc(S.name)}"></label>
      <div class="field">Dein Tagesziel<div class="seg">${[[10,'Locker'],[20,'Normal'],[30,'Ernsthaft'],[50,'Intensiv']].map(([g,l])=>`<button data-igoal="${g}" aria-pressed="${S.goal===g}">${g} XP<small>${l}</small></button>`).join('')}</div></div></div>` : '';
  $('#introIn').innerHTML = `${last?'':'<button class="skip" data-act="introDone">Überspringen</button>'}
    <div class="stage">${mascot(s.mood)}<div class="eb">${s.e}</div><h1>${s.t}</h1><p>${s.p}</p>${s.demo?`<div class="demo">${s.demo()}</div>`:''}${form}</div>
    <div class="dots" aria-label="Schritt ${introStep+1} von ${INTRO.length}">${INTRO.map((_,j)=>`<i class="${j===introStep?'on':''}"></i>`).join('')}</div>
    <div class="nav">${introStep>0?'<button class="btn ghost" data-act="introBack">Zurück</button>':''}<button class="btn" data-act="${last?'introDone':'introNext'}">${last?'Los geht’s!':'Weiter'}</button></div>`;
  $('#intro').hidden = false; $('#intro').scrollTop = 0; document.body.style.overflow = 'hidden';
}
function closeIntro(){
  const n = $('#introName'); if(n) S.name = n.value.trim();
  S.introDone = true; save();
  $('#intro').hidden = true; document.body.style.overflow = '';
  render(true);
}

/* Zurück-Taste der Android-App: true = in der App behandelt */
window.ggafBack = () => {
  if(!$('#modal').hidden){ closeModal(); return true; }
  if(!$('#intro').hidden){ if(introStep>0) showIntro(introStep-1); else closeIntro(); return true; }
  if(!$('#result').hidden){ $('#resDone').click(); return true; }
  if(!$('#lesson').hidden){ L && L.mode==='blitz' ? endLesson() : quitLesson(); return true; }
  if(S.tab!=='learn'){ S.tab = 'learn'; save(); render(true); return true; }
  return false;
};
S.missed = S.missed.filter(byId);   /* veraltete Fragen-IDs aus alten Speicherständen entfernen */
applyFreeze();
$('#logoMark').innerHTML = mascot('happy');
render(true);
applyBg();
if(!S.introDone) showIntro(0);   /* Einführung beim ersten Start */
else weeklyRecap();              /* sonst ggf. Rückblick auf die Vorwoche */
</script>
