let introStep = 0;
function showIntro(i){
  introStep = Math.max(0, Math.min(INTRO.length-1, i));
  const s = INTRO[introStep], last = introStep===INTRO.length-1;
  const form = s.form ? `<div class="form">
      <label class="field" for="introName">${T('intro_name')}<input id="introName" maxlength="24" placeholder="${T('intro_name_ph')}" value="${esc(S.name)}"></label>
      <div class="field">${T('your_goal')}<div class="seg">${[[10,T('g_easy')],[20,T('g_normal')],[30,T('g_serious')],[50,T('g_intense')]].map(([g,l])=>`<button data-igoal="${g}" aria-pressed="${S.goal===g}">${g} XP<small>${l}</small></button>`).join('')}</div></div></div>` : '';
  $('#introIn').innerHTML = `${last?'':`<button class="skip" data-act="introDone">${T('skip')}</button>`}
    <div class="stage">${mascot(s.mood)}<div class="eb">${s.e}</div><h1>${s.t}</h1><p>${s.p}</p>${s.demo?`<div class="demo">${s.demo()}</div>`:''}${form}</div>
    <div class="dots" aria-label="${T('intro_step',{i:introStep+1, n:INTRO.length})}">${INTRO.map((_,j)=>`<i class="${j===introStep?'on':''}"></i>`).join('')}</div>
    <div class="nav">${introStep>0?`<button class="btn ghost" data-act="introBack">${T('back')}</button>`:''}<button class="btn" data-act="${last?'introDone':'introNext'}">${last?T('lets_go'):T('intro_next')}</button></div>`;
  $('#intro').hidden = false; $('#intro').scrollTop = 0; document.body.style.overflow = 'hidden';
}
function closeIntro(){
  const n = $('#introName'); if(n) S.name = n.value.trim();
  S.introDone = true; save();
  $('#intro').hidden = true; document.body.style.overflow = '';
  render(true);
}

/* Zurück-Taste der Android-App: true = in der App behandelt */
window.ggafBack = () => {
  if(!$('#modal').hidden){ closeModal(); return true; }
  if(!$('#intro').hidden){ if(introStep>0) showIntro(introStep-1); else closeIntro(); return true; }
  if(!$('#result').hidden){ $('#resDone').click(); return true; }
  if(!$('#lesson').hidden){ L && L.mode==='blitz' ? endLesson() : quitLesson(); return true; }
  if(S.tab!=='learn'){ S.tab = 'learn'; save(); render(true); return true; }
  return false;
};

{"q":"What share of Germany’s greenhouse gas emissions comes from transport?","x":"In 2023 it was around 22 %. By far the largest part comes from road traffic, especially cars and lorries.","o":["around one fifth","around one hundredth","around half","almost all of it"]},
{"q":"Greenhouse gas emissions from transport in Germany have fallen only slightly since 1990.","x":"By 2023 only by around 11 % – much less than in other sectors. Engines have become more efficient, but there are more and bigger cars and more traffic."},

{"q":"On average, how many hours a day does a car in Germany stand unused?","x":"On average, a car is driven for less than an hour a day – the rest of the time it needs a parking space.","o":["around 23 hours","around 2 hours","around 8 hours","around 12 hours"]},
{"q":"Which term goes with which description?","x":"This way you can get where you’re going flexibly, without everyone needing their own car.","p":[["Car sharing","Renting cars by the hour when needed"],["Pedelec","Bike with electric assistance"],["Park and ride","Drive to the station, then continue by train"],["Carpool","Several people travelling together in one car"]]},

{"q":"Over its whole life, an electric car is usually more climate-friendly than a petrol car – even though making the battery causes a lot of CO₂.","x":"After a while on the road, the e-car makes up for the disadvantage from production. The more green electricity it charges with, the bigger its lead becomes."},
{"q":"When children are driven right up to the school gate, people call it the “parent ___”.","x":"Parent taxis cause traffic jams and dangerous situations outside schools in the morning. Walking, cycling or taking the bus gives you exercise and makes you more independent.","o":["taxi","boat","plane","train"]},
{"q":"Put these milestones of mobility in chronological order.","x":"1835, 1886, 1991, 2023 – by the way, the first German railway ran in Bavaria.","o":["First German railway, Nuremberg–Fürth","Carl Benz patents his petrol-engine car","First ICE high-speed train in regular service","Launch of the Deutschlandticket"]},
{"q":"Which power source belongs to which vehicle?","x":"How climate-friendly an electric drive is depends on how the electricity or hydrogen is produced.","p":[["Electric car","Battery"],["Fuel cell car","Hydrogen"],["Tram","Electricity from overhead lines"],["Diesel bus","Fuel made from crude oil"]]},
{"q":"What are the rules on a bicycle street (Fahrradstraße)?","x":"All vehicles there must go no faster than 30 km/h – and cyclists must not be obstructed.","o":["Cyclists may ride side by side; cars only with an extra sign","Bikes must be pushed there","Cars always have priority over bikes there","There is no speed limit there"]},
{"q":"When flying, only the CO₂ emitted harms the climate.","x":"Contrails and nitrogen oxides at high altitude also heat up the Earth. According to the German Aerospace Center (DLR), only around a third of aviation’s climate impact is due to CO₂."},

{"q":"The idea that you can reach school, shops, the doctor and a park within a quarter of an hour on foot or by bike is called the “___-minute city”.","x":"Paris in particular made the concept famous. Short distances avoid traffic before it even starts.","o":["15","5","60","90"]},
{"q":"The principle of the transport transition: what comes first? Sort from the first to the last step.","x":"The most climate-friendly journey is the one you don’t need to make – just like with waste, where avoiding it comes first.","o":["Avoid traffic","Shift traffic (e.g. to trains and bikes)","Improve traffic (e.g. clean engines)"]},

]},
{"t":"Digital & Climate","d":"Streaming, data centres, AI and e-waste.","qs":[
{"q":"Roughly what share of global greenhouse gas emissions comes from digital technology (devices, networks and data centres)?","x":"That’s about as much as all air traffic – and the share is growing.","o":["around 2 to 4 %","around 30 to 40 %","around 60 to 70 %","less than 0.01 %"]},
{"q":"Which kind of data makes up most of the world’s internet traffic?","x":"High-resolution videos create huge amounts of data. Matching the resolution to your screen size saves data and energy.","o":["Videos, e.g. from streaming","Emails","Text messages","Web searches"]},
{"q":"An hour of video on a big TV uses more electricity than the same hour on a smartphone.","x":"When streaming, the device itself often uses the most electricity – a big TV many times more than a phone."},
{"q":"When streaming, sending data over fibre-optic cable is more climate-friendly than over the mobile network.","x":"According to a study for the German Environment Agency, one hour of HD streaming over fibre causes around 2 g of CO₂ (data centre and transmission); over the old 3G network it was around 90 g. So at home, use Wi-Fi!"},
{"q":"The symbol of a crossed-out ___ means: this device doesn’t belong in household waste.","x":"Electrical devices contain valuable raw materials and sometimes harmful substances. They belong at a recycling centre or a take-back point in a shop.","o":["wheelie bin","light bulb","plug socket","sun"]},
{"q":"Which term goes with which explanation?","x":"So the “cloud” isn’t a cloud at all: your photos are stored in data centres that need electricity around the clock.","p":[["Data centre","Building full of servers"],["Cloud","Storing data on someone else’s servers"],["E-waste","Old electrical devices that are no longer used"],["Refurbished","Used device that has been fully restored"]]},
{"q":"How much electronic waste was produced worldwide in 2022?","x":"Only just under a quarter of it was proven to be collected and recycled. According to the UN, it could reach around 82 million tonnes by 2030.","o":["around 62 million tonnes","around 62,000 tonnes","around 620 tonnes","around 6 billion tonnes"]},
{"q":"Large electronics shops and many supermarkets have to take back small old electrical devices for free – even if you don’t buy anything new.","x":"This applies to devices up to 25 cm on each side, e.g. phones, charging cables or headphones – up to three per type of device."},

{"q":"Sort by electricity use when watching videos – from least to most.","x":"A smartphone needs only a few watts, a big TV often more than 100 watts. Smaller screen means less electricity.","o":["Smartphone","Laptop","Big TV"]},
{"q":"What has the EU required for new smartphones since June 2025?","x":"Also: at least 5 years of updates after sales end, and batteries that still have at least 80 % capacity after 800 charging cycles. That way phones last longer.","o":["Important spare parts must still be available 7 years after sales end","Every phone must work for 20 years","Phones may only be made in Europe","Phones may no longer have a camera"]},

{"q":"What is currently pushing up the electricity demand of data centres especially strongly?","x":"Training and using large AI models requires especially powerful chips. According to the IEA, AI is the main driver of data centres’ growing electricity use.","o":["Artificial intelligence (AI)","Printed newspapers","Landline phone calls","Pocket calculators"]}

{"q":"In which year did the United Nations adopt the UN Convention on the Rights of the Child?","x":"It was adopted on 20 November 1989. That’s why 20 November is International Children’s Rights Day.","o":["1989","1948","1968","2015"]},
{"q":"According to the UN Convention on the Rights of the Child, everyone under the age of 18 counts as a child.","x":"That’s what Article 1 says. The rights apply to all children – no matter where they come from or what gender or religion they have."},
{"q":"The UN Convention on the Rights of the Child has ___ articles.","x":"The first 41 articles describe children’s rights. The rest set out how countries put them into practice and have them checked.","o":["54","10","17","100"]},
{"q":"Which country is the only UN member state that has not ratified the UN Convention on the Rights of the Child?","x":"All the others – 196 states parties in total – have joined. The USA signed the Convention in 1995 but never ratified it.","o":["the USA","Germany","France","Brazil"]},
{"q":"Which children’s right is affected here?","x":"These rights are found in Articles 28 (education), 31 (leisure and play), 19 (protection from violence) and 12 (participation).","p":[["A girl isn’t allowed to go to school","Right to education"],["A child never has time to play after school","Right to leisure and play"],["A child is hit","Right to protection from violence"],["The children aren’t asked when the schoolyard is being planned","Right to participation"]]},
{"q":"In Germany, children have a legal right to be brought up without violence.","x":"Since 2000, the Bürgerliches Gesetzbuch (German Civil Code) has stated: physical punishment, emotional harm and other degrading measures are forbidden."},
{"q":"What does the principle “the best interests of the child come first” mean?","x":"This is in Article 3 and applies, for example, to courts, authorities, parliaments and social services.","o":["In all decisions that affect children, their well-being must be a top priority","Children may make all decisions on their own","Children must always obey adults","Only children may vote on laws"]},
{"q":"At the helpline “Number against ___” (Nummer gegen Kummer, 116 111), children and young people can talk to someone for free and anonymously.","x":"You don’t have to give your name. On Saturdays, young counsellors aged 16 to 21 also answer the calls.","o":["worries","hunger","boredom","noise"]},
{"q":"What is the name of the United Nations children’s fund?","x":"UNICEF was founded in 1946 to help children after the Second World War. Today it works in more than 190 countries and territories.","o":["UNICEF","NATO","OPEC","FIFA"]},
{"q":"Put these children’s rights events in chronological order.","x":"1924, 1946, 1989, 1992. The League of Nations’ Geneva Declaration was not yet a binding treaty – the Convention is.","o":["Geneva Declaration of the Rights of the Child","UNICEF is founded","The UN Convention on the Rights of the Child is adopted","The Convention comes into force in Germany"]},
{"q":"Children’s rights are explicitly written into the Grundgesetz (Germany’s Basic Law).","x":"This has been debated for years, but so far (as of 2026) the necessary two-thirds majority is missing. Many state constitutions, however, already include children’s rights."},
{"q":"What does Article 12 of the UN Convention on the Rights of the Child guarantee?","x":"Children’s views are taken into account according to their age and maturity. Class representatives and student councils are an example of participation.","o":["Children may express their views on all matters that affect them – and these views must be taken into account","Children may vote from the age of 12","Children must work from the age of 12","Children get their own mobile phone at 12"]},
{"q":"What did the UN Committee on the Rights of the Child explicitly confirm in 2023?","x":"In “General Comment No. 26”, the Committee calls on countries to protect children from the effects of the climate crisis. More than 16,000 children from 121 countries helped write it.","o":["Children have a right to a clean, healthy and sustainable environment","Children have a right to their own smartphone","Children may take part in elections from the age of 12","Children don’t have to go to school"]},
{"q":"You are allowed to post photos of classmates online without their permission.","x":"Everyone has the right to their own image. The UN Convention on the Rights of the Child also protects children’s privacy (Article 16)."},
{"q":"When parents share lots of photos and videos of their children on social media, it’s called ___.","x":"The word combines “share” and “parenting”. Child protection experts advise: ask children first and don’t post embarrassing pictures.","o":["sharenting","upcycling","car sharing","greenwashing"]},
{"q":"What did the Bundesverfassungsgericht (Federal Constitutional Court) decide in 2021 after a lawsuit by young people?","x":"The court ruled that too little climate protection today would force very harsh cuts on younger people later. The Bundestag then tightened the climate targets.","o":["The Climate Protection Act had to be improved to protect the freedom of future generations","Schools may no longer teach about the climate","Cars with combustion engines were banned immediately","Climate protection is purely a private matter"]},
{"q":"How does a UN treaty like the Convention on the Rights of the Child take effect in a country? Put the steps in the right order.","x":"The UN Committee on the Rights of the Child reviews the reports and gives countries recommendations on what to improve.","o":["The UN General Assembly adopts the treaty","A country signs the treaty","The country ratifies the treaty","The country reports regularly to the UN Committee in Geneva"]},
{"q":"Which age limit applies to what in Germany?","x":"In the 2024 European elections, 16-year-olds in Germany were allowed to vote for the first time. For Bundestag and Bavarian state elections, the voting age is still 18.","p":[["7 years","Limited legal capacity (e.g. buying things with pocket money)"],["14 years","Criminally responsible"],["16 years","Voting in European elections"],["18 years","Legal adult"]]}
]},
{"t":"Forests & Moors in Bavaria","d":"Forests in a changing climate and moors as climate protectors.","qs":[
{"q":"What share of Bavaria’s land is covered by forest?","x":"According to the national forest inventory, it’s around 37 % – about 2.6 million hectares.","o":["just over a third","about a tenth","about two thirds","almost all of it"]},
{"q":"Bavaria has the largest forest area of all German states.","x":"With around 2.6 million hectares, Bavaria has just over a fifth of Germany’s forest."},
{"q":"Which tree species is the most common in Bavaria’s forests?","x":"Spruce grows on almost 40 % of the forest area, followed by pine and beech.","o":["Spruce","Beech","Oak","Birch"]},
{"q":"A forest has layers. Sort them from bottom to top.","x":"Each layer is home to different animals and plants – one reason why near-natural forests are so rich in species.","o":["Moss layer","Herb layer","Shrub layer","Tree layer"]},
{"q":"The term “sustainability” comes from ___: in 1713, Hans Carl von Carlowitz demanded that only as much wood be cut as grows back.","x":"Carlowitz was in charge of mining in Saxony. At the time, wood was running short because mines and smelters used huge amounts of it.","o":["forestry","fishing","the car industry","space travel"]},
{"q":"Which tree has which fruits or cones?","x":"Fir cones fall apart while still on the tree. The cones people find on the ground and call “fir cones” are usually spruce cones.","p":[["European beech","Beechnuts"],["Oak","Acorns"],["Spruce","Hanging cones"],["Silver fir","Upright cones"]]},
{"q":"Why are many spruce forests in Bavaria in danger?","x":"Weakened spruces can hardly defend themselves with resin. The European spruce bark beetle multiplies especially quickly in hot summers.","o":["Heat and drought weaken the trees, and then bark beetles attack them","There are too many squirrels","Spruces need more snow than falls today","Spruces grow too fast and snap"]},
{"q":"The spruce has deep roots and therefore copes well with drought.","x":"The spruce has shallow roots. Deep-rooted trees like silver fir or oak reach water in deeper soil layers – and stand more firmly in storms."},
{"q":"When pure conifer forests are gradually turned into climate-resilient mixed forests, this is called forest ___.","x":"By 2030, Bavaria wants to convert around 200,000 hectares of private and community forest. Mixed forests are more resistant to heat, storms and pests.","o":["conversion","fire","trail","dieback"]},
{"q":"Who owns most of the forest in Bavaria?","x":"Just over half is private forest; around 700,000 people own forest. About 30 % belongs to the Free State of Bavaria and is mostly managed by the Bayerische Staatsforsten (Bavarian State Forests).","o":["Private individuals","The federal government","The European Union","The churches"]},
{"q":"According to the national forest inventory, Germany’s forests lost more carbon than they stored between 2017 and 2022.","x":"Droughts, storms and bark beetles killed so many trees that during this time the forest became a source of CO₂ instead of a CO₂ store."},
{"q":"What is a protection forest in the Alps?","x":"If a protection forest dies, expensive barriers made of steel and concrete have to take over its job. That’s why Bavaria specifically looks after and restores it.","o":["A forest that protects villages and roads from avalanches, rockfall and mudflows","A forest that nobody is allowed to enter","A fenced-in forest for wild boar","A forest made up only of young saplings"]},
{"q":"Roughly how fast does the peat layer grow in an intact raised bog?","x":"So a bog needs about 1,000 years for one metre of peat. A drained bog, on the other hand, shrinks much faster.","o":["about 1 millimetre per year","about 1 metre per year","about 10 centimetres per month","about 1 centimetre per day"]},
{"q":"Buying peat-free potting soil helps protect moors.","x":"Peat is dug out of moors to make ordinary potting soil. Peat-free soil contains things like compost, wood fibres or bark humus instead."},
{"q":"What goes together?","x":"Raised bogs are very low in nutrients. The sundew makes up for this by catching small insects with sticky droplets.","p":[["Raised bog","Fed only by rainwater"],["Fen","Fed by groundwater"],["Peat moss","Soaks up water like a sponge"],["Sundew","Carnivorous bog plant"]]},
{"q":"When a drained moor is made wet again, this is called ___.","x":"When the water level is high again, the peat stops breaking down. The moor releases hardly any CO₂ and can grow again.","o":["rewetting","draining","reforestation","land consolidation"]},
{"q":"How does a raised bog form from a lake? Put the stages in the right order.","x":"This takes many thousands of years. Many Bavarian moors formed in the Alpine foothills after the last Ice Age.","o":["Shallow lake","Silting up with reeds and sedges","Fen","Raised bog"]},
{"q":"How much of Bavaria’s moorland has been drained?","x":"Drained moors release large amounts of CO₂. In the Donaumoos, the largest fen in southern Germany, the ground has already sunk by more than 3 metres as a result.","o":["about 95 %","about 5 %","about 25 %","about 50 %"]}
]},
{"t":"Germany: Energy & Climate in Numbers","d":"Emissions, green electricity and Bavaria’s solar boom.","qs":[

{"q":"By how much were greenhouse gas emissions in 2025 below the 1990 level?","x":"In 1990 they were around 1,253 million tonnes. By 2030 they are supposed to be 65 % lower.","o":["about 48 %","about 5 %","about 25 %","about 90 %"]},

{"q":"From 2024 to 2025, greenhouse gas emissions in Germany hardly fell at all.","x":"The drop was only about 0.1 % – just under one million tonnes. Emissions fell in industry but rose in transport and buildings."},
{"q":"In transport and buildings, emissions rose in 2025 compared with the previous year.","x":"Transport: up about 2.1 million tonnes; buildings: up about 3.4 million tonnes. The overall drop came mainly from industry."},
{"q":"Sort Germany’s greenhouse gas amounts from largest to smallest.","x":"By 2025, almost half of the way had been covered – the other half has to follow in the next 20 years.","o":["1990: about 1,253 million tonnes","2025: about 649 million tonnes","2030 target: about 438 million tonnes","2045 target: net zero"]},

    {

        "Devices use electricity even on standby. A power strip with an on/off switch helps.",
        "Just 1 °C lower room temperature saves about 6% of heating energy.",
        "Airing out fully (opening windows wide for 5–10 minutes several times a day) is better than leaving a window tilted open all the time.",
        "A heat pump heats using warmth from the air, the ground or groundwater – with green electricity, it is almost climate-neutral.",
        "On average, one person in Germany causes about 10 tonnes of greenhouse gases per year. In the long run, a climate-friendly level would be less than 1 tonne.",
        "Climate-neutral means: overall, no extra greenhouse gases are released – avoid emissions first, then offset the rest."
      ]
    },
    {
      "t": "Understanding Climate Change",
      "l": "Weather, climate and the effects of global warming.",
      "p": [
        "Since the start of industrialisation, the Earth has warmed by about 1.4 °C. The year 2024 was already above 1.5 °C.",
        "Weather is what’s happening outside today. Climate is the average weather over at least 30 years.",
        "The natural greenhouse effect keeps the Earth at about 15 °C instead of –18 °C. The problem is the extra, human-made part.",

{"t":"On the move – but how?","l":"Transport, climate and choosing how to travel.","p":[
"Transport causes around a fifth of greenhouse gases in Germany (2023: around 22%). By far the biggest part comes from road traffic.",
"Since 1990 transport emissions have fallen only a little (by around 11% up to 2023): engines have become more efficient, but there are more and bigger cars and more traffic.",

"Almost 50 million cars are registered in Germany. A car is parked for around 23 hours a day, and on average only around 1.4 people sit in it.",

"You can ride an e-scooter from age 14 – without a licence, only alone and not on the pavement.",
"Over its whole life an electric car is usually more climate-friendly than a petrol car, even though making the battery causes a lot of CO₂. With green electricity the advantage gets bigger.",
"Drive types: electric car – battery, fuel cell car – hydrogen, tram – electricity from overhead wires, diesel bus – fuel made from crude oil.",
"When parents drive their children right up to the school gate, it is called the “parent taxi”. It causes traffic jams and danger outside schools.",
"Milestones: first German railway Nuremberg–Fürth (1835), Benz patent for the petrol-engine car (1886), first ICE in regular service (1991), Deutschlandticket (2023)."]},

"In the “15-minute city” you can reach everything important within a quarter of an hour on foot or by bike. Paris made the idea famous.",

  "lexikon": [
    ["2030 Agenda", "A United Nations plan from 2015 with 17 goals for sustainable development to be reached by 2030."],
    ["Biodiversity", "The variety of all living things: different species, their habitats and the genetic variety within a species."],
    ["ESD – Education for Sustainable Development", "A United Nations education concept: people should understand how their actions affect the world and be able to make responsible decisions."],
    ["Organic label (EU)", "Marks food from organic farming, e.g. grown without chemical-synthetic pesticides. Organic doesn't automatically mean fair."],
    ["Blauer Engel (Blue Angel)", "Germany's official eco-label for especially environmentally friendly products and services."],
    ["CO₂ equivalent", "A unit that makes all greenhouse gases comparable: how much CO₂ would warm the climate by the same amount?"],
    ["Carbon footprint", "The amount of greenhouse gases caused by a person, a product or a company."],
    ["Carbon price", "A price that has to be paid for emitting CO₂ – this makes climate-damaging fuels more expensive and makes climate protection pay off."],
    ["Emissions trading", "A system in which companies have to buy permits to emit CO₂. The total amount is capped and goes down over time."],
    ["Earth Overshoot Day", "The day of the year when humanity has used more resources than the Earth can renew in a whole year."],
    ["Renewable energy", "Energy from sources that don't run out: sun, wind, water, geothermal heat and biomass."],
    ["Fair trade", "Trade with fair prices and working conditions for producers, especially in the Global South."],
    ["Fairtrade", "A well-known fair trade label: among other things, it guarantees a minimum price and a bonus for community projects."],
    ["Fast fashion", "Cheap clothing produced in quickly changing collections and often thrown away after a short time."],
    ["Crop rotation", "Different plants are grown on a field each year. This keeps the soil fertile and helps prevent pests."],
    ["Intergenerational justice", "Living today in a way that gives future generations good chances in life too."],
    ["Planned obsolescence", "The accusation that products are deliberately made to break early."],
    ["Greenwashing", "When a company makes itself look more environmentally friendly than it really is."],
    ["Grüner Knopf (Green Button)", "A German government label for textiles made to minimum social and environmental standards."],
    ["Invasive species", "Animal or plant species brought in from elsewhere that spread quickly and push out native species."],
    ["Climate justice", "The idea that the burdens of the climate crisis should be shared fairly – it often hits hardest those who contributed least."],
    ["Climate neutrality", "Overall, no extra greenhouse gases are released. Germany wants to achieve this by 2045."],
    ["Cooperative", "A group of producers who work together and so have more bargaining power."],
    ["Circular economy", "Products and raw materials are used, repaired and recycled for as long as possible instead of being thrown away."],
    ["Light pollution", "Too much artificial light at night. It disturbs insects, birds and other animals."],
    ["Supply chain", "All the steps a product goes through from raw material to shop – often across many countries."],
    ["Reusable packaging", "Packaging like bottles or cups that is cleaned and reused many times."],
    ["Microplastics", "Plastic particles smaller than 5 millimetres, e.g. from tyre wear, clothing or breaking-down rubbish."],
    ["Monoculture", "Only a single type of plant grows on a large area for years."],
    ["Peatland (bog)", "A permanently wet habitat where dead plants don't fully decompose. Peatlands store huge amounts of carbon."],
    ["Sustainability", "Living and doing business so that the environment, the economy and society are in balance – today and for future generations."],
    ["Ecological footprint", "Shows how much of the Earth's land is needed to support the lifestyle of a person or a country."],
    ["Paris Agreement", "A treaty from 2015: almost all countries aim to limit global warming to well below 2 °C, ideally to 1.5 °C."],
    ["Rebound effect", "When something becomes more efficient, it's often used more – so part of the savings gets eaten up again."],
    ["Recycling", "Waste is collected and turned into new raw materials."],
    ["Local", "Products made or grown nearby – with short transport routes."],
    ["Seasonal", "Eating fruit and vegetables when they naturally ripen where we live."],
    ["SDGs", "“Sustainable Development Goals” – the United Nations' 17 goals for sustainable development."],
    ["Self-efficacy", "The experience of being able to make a difference through your own actions."],
    ["Greenhouse effect", "Gases in the atmosphere trap heat. The natural greenhouse effect makes the Earth habitable; the extra, human-made one heats it up."],
    ["Upcycling", "Turning something old into something new and more valuable, e.g. a bag made from old jeans."],
    ["Virtual water", "The water used to make a product, e.g. clothing or food."],
    ["Heat pump", "A heating system that uses heat from the air, the ground or groundwater. Run on green electricity, it heats almost climate-neutrally."],
    ["Rewetting", "Drained peatlands are made wet again so they stop releasing carbon and can store it again."],
    ["Zero waste", "A lifestyle that creates as little waste as possible."]
  ],

    ["Leftover cooking", "Leftovers can become soup, a bake or fried rice – plan a leftovers day once a week."],

fr: {"units":[{"t":"Climat & énergie","d":"Gaz à effet de serre, électricité et pourquoi chaque degré compte.","qs":[{"q":"Quel gaz contribue le plus au réchauffement de la Terre à cause des activités humaines ?","x":"Le CO₂ est produit surtout en brûlant du charbon, du pétrole et du gaz. Il représente environ les trois quarts des émissions mondiales de gaz à effet de serre.","o":["Le dioxyde de carbone (CO₂)","L’oxygène","L’azote","L’hélium"]},{"q":"Avec l’accord de ___ sur le climat de 2015, presque tous les États se sont engagés à limiter le réchauffement nettement en dessous de 2 °C.","x":"L’objectif est même de limiter le réchauffement si possible à 1,5 °C.","o":["Paris","Vienne","Berlin","Genève"]},{"q":"Les appareils en mode veille ne consomment pas d’électricité.","x":"Même en veille, le courant passe – sur une année, cela fait vite quelques dizaines d’euros. Une multiprise à interrupteur aide."},{"q":"Classe selon les émissions de CO₂ par personne et par kilomètre – de la plus faible à la plus élevée.","x":"Le vélo ne produit pratiquement pas d’émissions, le train est bien meilleur pour le climat que la voiture et l’avion.","o":["Vélo","Train grandes lignes","Voiture (essence)","Vol intérieur"]},{"q":"Quelle source d’énergie va avec quelle technique ?","x":"Ce sont toutes les quatre des énergies renouvelables – elles ne s’épuisent pas.","p":[["Soleil","Photovoltaïque"],["Vent","Éolienne"],["Eau qui coule","Centrale hydroélectrique"],["Chaleur de la Terre","Géothermie"]]},{"q":"Environ combien d’énergie de chauffage économise-t-on en baissant la température de la pièce de 1 °C ?","x":"Un seul degré de moins économise déjà environ 6 % d’énergie de chauffage – sans qu’on le sente vraiment.","o":["environ 6 %","environ 0,5 %","environ 25 %","environ 50 %"]},{"q":"Aérer en grand (ouvrir la fenêtre en grand peu de temps) économise plus d’énergie qu’une fenêtre entrouverte en permanence.","x":"Avec une fenêtre toujours entrouverte, les murs se refroidissent. Mieux : ouvrir en grand 5 à 10 minutes plusieurs fois par jour."},{"q":"Combien de gaz à effet de serre une personne en Allemagne émet-elle en moyenne par an ?","x":"Pour être compatible avec le climat à long terme, il faudrait moins d’1 tonne par personne et par an.","o":["environ 10 tonnes","environ 1 tonne","environ 50 tonnes","environ 100 kilogrammes"]},{"q":"Quel gaz à effet de serre est produit entre autres dans l’estomac des bovins ?","x":"Sur 20 ans, le méthane a un effet environ 80 fois plus fort que le CO₂.","o":["Le méthane","L’ozone","L’hydrogène","L’argon"]},{"q":"En 2024, plus de la moitié de l’électricité en Allemagne provenait d’énergies renouvelables.","x":"Selon le mode de calcul, la part était d’environ 54 à 60 % – le vent est la source la plus importante."},{"q":"Une ___ utilise la chaleur de l’air, du sol ou des nappes souterraines pour chauffer.","x":"Alimentée par de l’électricité verte, une pompe à chaleur chauffe de façon presque neutre pour le climat.","o":["pompe à chaleur","chaudière au fioul","climatisation","bougie"]},{"q":"Que veut dire « neutre pour le climat » ?","x":"On évite les émissions autant que possible, et on compense le reste.","o":["Au bout du compte, aucun gaz à effet de serre supplémentaire n’est émis","Le mot climat n’apparaît pas","On ne consomme aucune énergie","On économise seulement de l’électricité"]},{"q":"De combien la Terre s’est-elle réchauffée environ depuis le début de l’industrialisation ?","x":"L’année 2024 a même déjà dépassé 1,5 °C – en moyenne sur plusieurs années, c’est environ 1,4 °C.","o":["environ 1,4 °C","environ 0,1 °C","environ 5 °C","environ 10 °C"]},{"q":"La météo et le climat, c’est la même chose.","x":"La météo, c’est ce que nous vivons dehors aujourd’hui. Le climat, c’est la moyenne de la météo sur au moins 30 ans."},{"q":"Grâce à ___ naturel, il fait en moyenne environ 15 °C sur Terre au lieu de –18 °C.","x":"Sans lui, la Terre serait glaciale. Le problème, c’est l’effet de serre supplémentaire causé par l’être humain.","o":["l’effet de serre","le trou d’ozone","le Gulf Stream","le cycle lunaire"]},{"q":"Quelle conséquence du changement climatique va avec quel exemple ?","x":"Beaucoup de conséquences touchent des personnes qui ont peu contribué à la crise.","p":[["Montée du niveau de la mer","Côtes inondées"],["Canicules","Plus de morts dues à la chaleur"],["Sécheresse","Récoltes perdues"],["Fonte des glaciers","Moins d’eau dans les régions de montagne"]]},{"q":"Quel pays émet actuellement le plus de CO₂ au total ?","x":"Mais par habitant, les États-Unis par exemple sont nettement devant la Chine – et historiquement, ce sont les pays industrialisés qui ont le plus émis.","o":["La Chine","L’Allemagne","Le Brésil","La Suisse"]},{"q":"Classe selon le CO₂ par kilowattheure d’électricité – du plus faible au plus élevé.","x":"Le lignite est la source d’énergie la plus nuisible au climat – le vent n’en produit qu’une infime partie.","o":["Éolien","Gaz naturel","Lignite"]}]},
{"t":"Commerce équitable","d":"Qui gagne de l’argent avec ton chocolat – et ce que signifient les labels.","qs":[{"q":"Que garantit entre autres le label Fairtrade aux producteurs et productrices ?","x":"Le prix minimum protège contre les chutes de prix sur le marché mondial, la prime finance des projets collectifs.","o":["Un prix minimum et une prime pour des projets collectifs","Des machines gratuites","Un emploi en Europe","L’utilisation d’engrais bio uniquement"]},{"q":"Quel pays est le premier producteur de cacao au monde ?","x":"Avec le Ghana, elle fournit environ la moitié du cacao – souvent grâce à des familles qui vivent sous le seuil de pauvreté.","o":["La Côte d’Ivoire","La Suisse","La Belgique","L’Allemagne"]},{"q":"Les produits équitables ne se trouvent que dans les boutiques solidaires.","x":"On trouve aujourd’hui des produits Fairtrade dans presque tous les supermarchés et magasins discount."},{"q":"Quel label signifie quoi ?","x":"Les labels aident à faire ses courses – mais chacun contrôle des choses très différentes.","p":[["Fairtrade","Conditions commerciales justes"],["Blauer Engel (Ange bleu)","Produits écologiques"],["FSC","Gestion durable des forêts"],["MSC","Pêche durable"]]},{"q":"Combien d’enfants dans le monde sont concernés par le travail des enfants, selon l’OIT et l’UNICEF ?","x":"Selon une estimation de 2025, environ 138 millions d’enfants – beaucoup d’entre eux dans l’agriculture.","o":["environ 140 millions","environ 1 million","environ 14 000","environ 1,4 milliard"]},{"q":"En Allemagne, depuis 2023, la ___ oblige les grandes entreprises à veiller au respect des droits humains dans leurs chaînes d’approvisionnement.","x":"Depuis 2024, elle s’applique aux entreprises de plus de 1 000 salariés en Allemagne (2023 : plus de 3 000). Le gouvernement fédéral veut la réviser dans le cadre de la directive européenne sur le devoir de vigilance.","o":["Lieferkettengesetz (loi sur le devoir de vigilance)","Grundgesetz (Loi fondamentale)","Pfandgesetz (loi sur la consigne)","Tierschutzgesetz (loi sur la protection des animaux)"]},{"q":"Avec Fairtrade, les coopératives décident ensemble à quoi sert la prime Fairtrade.","x":"Par exemple pour des écoles, des puits, des centres de santé ou de meilleures méthodes de culture."},{"q":"Remets dans l’ordre le chemin d’une tablette de chocolat.","x":"La plus grande partie de la valeur est créée seulement en Europe – pas chez les familles de paysans.","o":["Récolter les cabosses de cacao","Faire fermenter et sécher les fèves","Transport par bateau","Transformation à l’usine","Vente au supermarché"]},{"q":"Quels produits font partie des produits Fairtrade les plus connus ?","x":"Ces produits poussent surtout dans les pays du Sud et sont vendus dans le monde entier.","o":["Le café, les bananes et le cacao","Les pommes, les poires et les prunes","Le lait, le fromage et le beurre","Les pommes de terre, le chou et les betteraves"]},{"q":"Qu’est-ce qu’une boutique solidaire (Weltladen) ?","x":"En Allemagne, il existe environ 900 boutiques solidaires – beaucoup sont tenues par des bénévoles.","o":["Un magasin spécialisé dans les produits équitables","Une agence de voyages pour faire le tour du monde","Un magasin de globes et de cartes","Un magasin réservé aux importations de luxe"]},{"q":"Dans le commerce classique du café, les familles de petits paysans ne reçoivent souvent qu’une petite fraction du prix en magasin.","x":"Une grande partie du prix revient aux torréfacteurs, aux commerçants et aux impôts dans le pays de vente."},{"q":"Le commerce équitable doit permettre aux producteurs et productrices d’avoir un ___ qui permet de vivre dignement.","x":"Vivre dignement veut dire : assez pour se nourrir, se loger, s’instruire et se soigner.","o":["revenu","loisir","bulletin","temps"]},{"q":"Qu’est-ce qu’une coopérative ?","x":"Ensemble, les familles de petits paysans ont plus de poids dans les négociations.","o":["Un regroupement de producteurs et productrices qui travaillent ensemble","Un supermarché","Une banque réservée aux riches","Une recette de chocolat"]},{"q":"Les standards Fairtrade interdisent l’exploitation des enfants par le travail.","x":"Des contrôles et des programmes de protection doivent empêcher le travail des enfants et leur permettre d’aller à l’école."},{"q":"Quel produit vient particulièrement souvent de quel pays ?","x":"Le Brésil est le premier producteur de café, l’Équateur le premier exportateur de bananes au monde. L’Inde fait partie des plus grands producteurs de coton.","p":[["Café","Brésil"],["Bananes","Équateur"],["Cacao","Côte d’Ivoire"],["Coton","Inde"]]},{"q":"L’Organisation internationale ___ (OIT) est l’organisation de l’ONU pour les droits des travailleurs.","x":"Elle fixe des normes minimales dans le monde entier, par exemple contre le travail des enfants et le travail forcé.","o":["du travail","du commerce","des banques","de l’espace"]},{"q":"Quel label ne concerne PAS le commerce équitable ?","x":"Le Blauer Engel est un écolabel – il ne contrôle pas les conditions commerciales justes.","o":["Blauer Engel","Fairtrade","GEPA fair+","Naturland Fair"]},{"q":"Il existe aussi des fleurs comme des roses avec le label Fairtrade.","x":"Beaucoup de roses Fairtrade viennent du Kenya et d’Éthiopie."}]},
{"t":"Déchets & recyclage","d":"Éviter, trier, réutiliser.","qs":[{"q":"Classe selon la durée de décomposition dans la nature – de la plus courte à la plus longue.","x":"Peau de banane : quelques semaines à quelques mois. Filtre de cigarette : plusieurs années. Canette en alu : jusqu’à 200 ans. Bouteille en plastique : environ 450 ans.","o":["Peau de banane","Filtre de cigarette","Canette (alu)","Bouteille en plastique"]},{"q":"Quel déchet va dans quelle poubelle ?","x":"Les tickets de caisse sont généralement en papier thermique – cela perturbe le recyclage du papier.","p":[["Pot de yaourt","Poubelle jaune"],["Journal","Poubelle à papier"],["Épluchures de pommes de terre","Poubelle bio"],["Ticket de caisse","Ordures ménagères"]]},{"q":"Les verres à boire et la céramique vont dans le conteneur à verre.","x":"Ils fondent à d’autres températures et polluent le verre recyclé. Ils vont dans les ordures ménagères."},{"q":"La hiérarchie des déchets : quelle est la meilleure solution ? Classe de la meilleure à la pire.","x":"Le meilleur déchet, c’est celui qui n’existe pas.","o":["Éviter","Réutiliser","Recycler","Incinérer (produire de l’énergie)","Mettre en décharge"]},{"q":"Quelle est la consigne en Allemagne sur une bouteille en plastique jetable ?","x":"Les bouteilles réutilisables ont généralement une consigne de 8 ou 15 centimes – et sont remplies de nombreuses fois.","o":["25 centimes","8 centimes","15 centimes","50 centimes"]},{"q":"On appelle ___ les minuscules particules de plastique de moins de 5 millimètres.","x":"Les microplastiques viennent par exemple de l’usure des pneus et des déchets plastiques qui se décomposent.","o":["microplastiques","nanopapier","macroverre","bioplastique"]},{"q":"Les bouteilles en verre consignées peuvent être remplies jusqu’à 50 fois.","x":"C’est pourquoi les bouteilles consignées locales sont généralement le choix le plus écologique."},{"q":"Où mettre les piles usagées ?","x":"Les piles contiennent des substances toxiques et des métaux précieux. Les magasins qui vendent des piles doivent les reprendre.","o":["Dans une boîte de collecte en magasin ou à la déchetterie","Dans les ordures ménagères","Dans la poubelle jaune","Dans la poubelle bio"]},{"q":"Que veut dire « upcycling » ?","x":"Un vieux jean devient un sac, des palettes deviennent un canapé.","o":["Transformer du vieux en quelque chose de nouveau et de plus précieux","Monter les déchets à l’étage","Faire du vélo en montée","Brûler du plastique"]},{"q":"Il faut séparer l’opercule en alu du pot de yaourt avant de le jeter.","x":"Ainsi, le centre de tri peut bien reconnaître et séparer les matériaux."},{"q":"Pourquoi les gobelets de café à emporter posent-ils problème ?","x":"Un gobelet réutilisable remplace beaucoup de gobelets jetables en quelques semaines seulement.","o":["Ils sont généralement recouverts de plastique et difficiles à recycler","Ils sont en verre pur","Ils se mangent","Ils se dissolvent dans le café"]},{"q":"Un mode de vie qui produit le moins de déchets possible s’appelle « Zero ___ » (zéro déchet).","x":"Les magasins de vrac, les boîtes réutilisables et les sacs en tissu aident.","o":["Waste","Plastic","Water","Hero"]},{"q":"Qu’est-ce que l’économie circulaire ?","x":"Objectif : les déchets redeviennent des matières premières – au lieu d’en extraire toujours de nouvelles.","o":["Garder les produits et les matières premières le plus longtemps possible dans le circuit","Faire tourner les déchets en rond","Recycler seulement le papier","Tout brûler"]},{"q":"Par rapport aux autres pays de l’UE, l’Allemagne produit particulièrement beaucoup de déchets d’emballage par habitant.","x":"L’Allemagne est nettement au-dessus de la moyenne de l’UE."},{"q":"Les produits jetables en plastique comme les pailles et les couverts à usage unique sont interdits dans l’UE depuis ___.","x":"L’interdiction s’applique depuis le 3 juillet 2021.","o":["2021","1990","2010","2035"]},{"q":"Que deviennent les déchets ?","x":"Bien triés, les déchets deviennent des matières premières.","p":[["Vieux papier","Papier recyclé"],["Bouteilles en PET","Polaire et nouvelles bouteilles"],["Vieux verre","Nouvelles bouteilles en verre"],["Biodéchets","Compost et biogaz"]]},{"q":"Dans quel conteneur à verre va une bouteille en verre bleu ?","x":"Toutes les couleurs sauf le blanc et le brun – donc aussi le bleu ou le rouge – vont avec le verre vert.","o":["Verre vert","Verre blanc","Verre brun","Ordures ménagères"]},{"q":"Recycler vaut toujours mieux que réutiliser.","x":"Selon la hiérarchie des déchets, réutiliser passe avant recycler."}]},{"t":"La politique environnementale en Allemagne","d":"Ministères, lois et prix du CO₂.","qs":[{"q":"Quel ministère fédéral est chargé de la protection du climat depuis 2025 ?","x":"Jusqu’en 2025, la protection du climat relevait du ministère de l’Économie. Aujourd’hui, le sigle du ministère de l’Environnement est BMUKN.","o":["Le ministère fédéral de l’Environnement, de la Protection du climat, de la Protection de la nature et de la Sûreté nucléaire","Le ministère fédéral des Finances","Le ministère des Affaires étrangères","Le ministère fédéral de la Défense"]},{"q":"L’Umweltbundesamt (Agence fédérale de l’environnement) a son siège à Dessau-Roßlau (Saxe-Anhalt).","x":"L’Umweltbundesamt est l’autorité scientifique de l’État fédéral pour l’environnement. Elle rassemble par exemple chaque année les données sur les émissions de gaz à effet de serre."},{"q":"Depuis 1994, la protection des fondements naturels de la vie est un objectif de l’État inscrit à l’article ___ de la Loi fondamentale (Grundgesetz).","x":"Un objectif de l’État oblige le Bundestag, le gouvernement et les tribunaux à tenir compte de la protection de l’environnement dans leurs décisions – en pensant aussi aux générations futures.","o":["20a","1","38","116"]},{"q":"Par quel organe constitutionnel les 16 Länder participent-ils à l’élaboration des lois fédérales ?","x":"Le Bundesrat réunit des membres des gouvernements des Länder. Beaucoup de lois environnementales sont appliquées par les Länder, par exemple pour la protection de la nature ou les autorisations d’éoliennes.","o":["Le Bundesrat","Le Bundestag","La Cour constitutionnelle fédérale","Le président fédéral"]},{"q":"Quel ministère fédéral est chargé de quoi ?","x":"La politique environnementale est un travail d’équipe : beaucoup de décisions pour le climat sont aussi prises dans les ministères de l’Énergie, des Transports et de l’Agriculture.","p":[["Ministère de l’Environnement (BMUKN)","Protection du climat, de la nature et de l’environnement"],["Ministère de l’Économie (BMWE)","Énergie et marché de l’électricité"],["Ministère des Transports","Routes et rails"],["Ministère de l’Agriculture (BMLEH)","Agriculture, alimentation et forêt"]]},{"q":"Comment naît une loi fédérale ? Classe les étapes.","x":"La promulgation se fait au Journal officiel fédéral (Bundesgesetzblatt). Ce n’est qu’après qu’une loi peut entrer en vigueur.","o":["Un projet de loi est déposé, souvent par le gouvernement fédéral","Le Bundestag débat de la loi et la vote","Le Bundesrat examine la loi","Le président fédéral signe, la loi est promulguée"]},{"q":"D’ici quand l’Allemagne doit-elle être neutre en gaz à effet de serre selon la loi sur la protection du climat ?","x":"Neutre en gaz à effet de serre veut dire : on n’émet pas plus que ce que les forêts et les tourbières, par exemple, peuvent absorber. L’UE s’est fixé cet objectif pour 2050.","o":["2045","2030","2060","2100"]},{"q":"D’ici 2030, les émissions de gaz à effet de serre en Allemagne doivent baisser d’au moins ___ % par rapport à 1990.","x":"D’ici 2040, elles doivent baisser d’au moins 88 %. Ces objectifs intermédiaires figurent dans la loi fédérale sur la protection du climat.","o":["65","15","35","100"]},{"q":"En avril 2023, les trois dernières centrales nucléaires d’Allemagne ont été arrêtées.","x":"Le 15 avril 2023, Isar 2 (Bavière), Emsland et Neckarwestheim 2 ont été débranchées du réseau. C’était la fin de la production d’électricité nucléaire en Allemagne."},{"q":"Selon la loi, à partir de quand au plus tard l’Allemagne ne doit-elle plus produire d’électricité à partir du charbon ?","x":"La loi sur la sortie du charbon de 2020 fixe 2038 comme date limite. Les centrales sont fermées petit à petit.","o":["2038","2025","2050","2070"]},{"q":"Que règle l’EEG (loi sur les énergies renouvelables) ?","x":"L’EEG existe depuis l’an 2000. Elle garantit par exemple que l’électricité des installations solaires et éoliennes est injectée dans le réseau et rémunérée.","o":["Le développement et le soutien de l’électricité produite par le soleil, le vent et d’autres sources renouvelables","Le tri des déchets dans les foyers","Le montant de la taxe sur les chiens","Les limitations de vitesse sur l’autoroute"]},{"q":"Remets ces étapes clés de la politique environnementale dans l’ordre chronologique.","x":"1994, 2000, 2005, 2019 – la loi sur la protection du climat a encore été modifiée en 2021 et 2024.","o":["La protection de l’environnement devient un objectif de l’État dans la Loi fondamentale","La loi sur les énergies renouvelables (EEG) entre en vigueur","L’échange de quotas d’émission de l’UE démarre","La loi fédérale sur la protection du climat est adoptée"]},{"q":"Sur quoi porte le prix national du CO₂ selon la BEHG (loi sur l’échange de quotas d’émission pour les combustibles) ?","x":"Ce sont d’abord les entreprises qui vendent les combustibles qui paient ce prix. Elles le répercutent sur le prix à la pompe ou sur les frais de chauffage.","o":["Sur les combustibles comme le fioul, le gaz naturel, l’essence et le diesel","Sur les fruits et légumes","Sur l’électricité des panneaux solaires","Sur les livres et les journaux"]},{"q":"Le prix national du CO₂ pour le chauffage et le carburant existe en Allemagne depuis ___.","x":"Au départ, une tonne de CO₂ coûtait 25 euros. Le prix a ensuite augmenté pas à pas.","o":["2021","1990","2010","2030"]},{"q":"En 2026 et 2027, le prix du CO₂ selon la BEHG se situe dans une fourchette de 55 à 65 euros par tonne.","x":"La fourchette doit permettre de mieux planifier. À partir de 2028, le prix ne sera plus fixé par l’État, mais par le marché."},{"q":"Qui doit avoir des certificats pour ses émissions de CO₂ depuis 2005 dans le système d’échange de quotas de l’UE (EU-ETS) ?","x":"Pour chaque tonne de CO₂ émise, un certificat doit être rendu. La quantité totale de certificats diminue chaque année.","o":["Les centrales électriques et les grandes installations industrielles","Seulement les automobilistes particuliers","Seulement les fermes","Seulement les écoles et les hôpitaux"]},{"q":"Prix du CO₂ : qu’est-ce qui va ensemble ?","x":"Les recettes du prix du CO₂ vont dans le Fonds pour le climat et la transformation (KTF).","p":[["EU-ETS","Centrales et industrie, depuis 2005"],["ETS2","Prix du CO₂ européen pour les bâtiments et les transports, à partir de 2028"],["BEHG","Prix national du CO₂ sur les combustibles, depuis 2021"],["Fonds pour le climat et la transformation","Caisse spéciale de l’État fédéral pour le climat et la transition énergétique"]]},{"q":"Le nouveau système d’échange de quotas de l’UE pour les bâtiments et les transports (ETS2) démarre comme prévu initialement en 2027.","x":"L’UE a repoussé le démarrage à 2028. D’ici là, le prix national du CO₂ continue de s’appliquer en Allemagne."}]},
{"t":"Le nouveau gouvernement fédéral & l’environnement","d":"Ce qui se passe dans la politique climatique depuis mai 2025.","qs":[{"q":"Depuis quand la coalition CDU/CSU et SPD dirigée par le chancelier Friedrich Merz gouverne-t-elle l’Allemagne ?","x":"Friedrich Merz a été élu chancelier fédéral par le Bundestag le 6 mai 2025.","o":["Depuis mai 2025","Depuis janvier 2021","Depuis décembre 2021","Depuis janvier 2027"]},{"q":"Avec le nouveau gouvernement, la protection du climat est passée du ministère de l’Économie au ministère de l’Environnement.","x":"Depuis, le ministère de l’Environnement s’appelle « ministère fédéral de l’Environnement, de la Protection du climat, de la Protection de la nature et de la Sûreté nucléaire » (BMUKN). La politique énergétique relève du ministère fédéral de l’Économie et de l’Énergie (BMWE)."},{"q":"Combien de milliards d’euros du fonds spécial pour les infrastructures doivent aller au Fonds pour le climat et la transformation ?","x":"Le Fonds pour le climat et la transformation (KTF) finance par exemple des aides pour les bâtiments, la mobilité électrique et la baisse du prix de l’électricité.","o":["100 milliards d’euros","1 milliard d’euros","10 milliards d’euros","500 milliards d’euros"]},{"q":"En mars 2025, le Bundestag a modifié la Loi fondamentale pour créer un fonds spécial de ___ milliards d’euros pour les infrastructures et la neutralité climatique.","x":"C’est encore l’ancien Bundestag qui l’a voté, peu avant l’entrée en fonction du nouveau gouvernement. L’argent doit être dépensé sur douze ans.","o":["500","5","50","5 000"]},{"q":"Qui dirige quelle fonction au gouvernement fédéral ?","x":"Friedrich Merz est le dixième chancelier de la République fédérale d’Allemagne.","p":[["Chancelier fédéral","Friedrich Merz (CDU)"],["Ministère de l’Environnement (BMUKN)","Carsten Schneider (SPD)"],["Ministère de l’Économie et de l’Énergie (BMWE)","Katherina Reiche (CDU)"],["Ministère des Transports","Patrick Schnieder (CDU)"]]},{"q":"Depuis la modification de 2025, l’objectif « neutralité climatique d’ici 2045 » figure aussi dans la Loi fondamentale.","x":"Il figure à l’article 143h, qui règle le fonds spécial : l’argent est destiné aux infrastructures et à l’atteinte de la neutralité climatique d’ici 2045."},{"q":"Avec combien d’argent du Fonds pour le climat et la transformation l’État fédéral subventionne-t-il les frais de réseau électrique en 2026 ?","x":"Les frais de réseau font partie du prix de l’électricité et paient les lignes électriques. Pour 2027 à 2029, environ 5,5 milliards d’euros par an sont prévus.","o":["6,5 milliards d’euros","65 millions d’euros","650 milliards d’euros","65 euros par ménage"]},{"q":"Pour l’industrie ainsi que l’agriculture et la sylviculture, la taxe sur l’électricité a été réduite durablement au taux ___ de l’UE.","x":"Elle est passée de 2,05 à 0,05 centime par kilowattheure. Cette baisse ne s’applique pas aux ménages.","o":["minimum","maximum","moyen","record"]},{"q":"La taxe sur le stockage du gaz, ajoutée au prix du gaz, a été supprimée en 2026.","x":"Cette taxe servait à remplir les réservoirs de gaz. Avec la baisse des frais de réseau, un ménage économise selon le gouvernement jusqu’à 150 euros par an."},{"q":"Quelle condition s’applique aux nouvelles centrales à gaz selon la stratégie du gouvernement pour les centrales ?","x":"Les centrales doivent fournir de l’électricité quand il y a peu de vent et pas de soleil. La Commission européenne a approuvé les grandes lignes en principe en janvier 2026.","o":["Elles doivent pouvoir passer plus tard à l’hydrogène (« H₂-ready »)","Elles doivent fonctionner au charbon","Elles ne peuvent fonctionner qu’en été","Elles doivent être installées sur des bateaux"]},{"q":"Quel est le montant maximum de la nouvelle aide de l’État pour l’achat d’une voiture électrique depuis 2026 ?","x":"L’aide est accordée aux ménages dont le revenu annuel imposable ne dépasse pas 80 000 euros (un peu plus avec des enfants). Elle concerne les voitures neuves immatriculées depuis le 1er janvier 2026.","o":["6 000 euros","600 euros","60 000 euros","Il n’y a pas d’aide"]},{"q":"Quelle mesure va avec quel contenu ?","x":"Beaucoup de ces mesures sont financées par le Fonds pour le climat et la transformation.","p":[["Gebäudemodernisierungsgesetz (loi sur la modernisation des bâtiments)","Remplace l’ancienne « loi sur le chauffage »"],["Stratégie pour les centrales","Nouvelles centrales à gaz compatibles avec l’hydrogène"],["Aide pour les voitures électriques","Prime allant jusqu’à 6 000 euros"],["Subvention du KTF","Frais de réseau électrique plus bas"]]},{"q":"Comment s’appelle la loi qui a remplacé en 2026 la Gebäudeenergiegesetz (la « loi sur le chauffage ») ?","x":"Elle s’applique depuis le 29 juillet 2026. Elle avait été votée auparavant par le Bundestag et le Bundesrat.","o":["Gebäudemodernisierungsgesetz (loi sur la modernisation des bâtiments)","Heizungsverbotsgesetz (loi d’interdiction des chauffages)","Kohleausstiegsgesetz (loi sur la sortie du charbon)","Lieferkettengesetz (loi sur le devoir de vigilance)"]},{"q":"Selon la nouvelle loi sur la modernisation des bâtiments, les nouveaux chauffages ne doivent plus fonctionner à 65 % avec des énergies renouvelables.","x":"Les propriétaires peuvent à nouveau choisir librement leur système de chauffage. En revanche, les combustibles doivent devenir progressivement plus respectueux du climat : une part obligatoire commence en 2029, et ils doivent être neutres pour le climat en 2045."},{"q":"La loi sur la modernisation des bâtiments est en vigueur depuis ___ 2026.","x":"Exactement : depuis le 29 juillet 2026. Depuis juillet 2026, les aides pour des chauffages respectueux du climat dépendent davantage du revenu.","o":["juillet","janvier","mars","décembre"]},{"q":"Remets dans l’ordre les étapes de la loi sur la modernisation des bâtiments.","x":"13 mai 2026 : conseil des ministres ; mi-juillet : Bundestag et Bundesrat ; 29 juillet 2026 : entrée en vigueur.","o":["Le conseil des ministres adopte le projet de loi","Le Bundestag et le Bundesrat l’approuvent","La loi entre en vigueur"]},{"q":"Quel objectif climatique pour 2040 le Parlement européen et les États de l’UE se sont-ils fixé ?","x":"À partir de 2036, jusqu’à 5 points de pourcentage pourront être obtenus grâce à des certificats internationaux de protection du climat de haute qualité. Les associations environnementales le critiquent, d’autres y voient plus de marge de manœuvre.","o":["90 % de gaz à effet de serre en moins qu’en 1990","20 % de gaz à effet de serre en moins qu’en 1990","Deux fois plus de gaz à effet de serre qu’en 1990","Aucun objectif, seulement des recommandations"]},{"q":"Comment le prix mensuel du Deutschlandticket (abonnement national de transports) a-t-il évolué ? Classe du premier au prix actuel.","x":"À partir de 2027, le prix ne doit plus être négocié par les politiques, mais suivre un indice des coûts (personnel, énergie et autres coûts).","o":["49 euros (lancement en 2023)","58 euros (2025)","63 euros (2026)"]}]},
{"t":"Eau & océans","d":"Eau virtuelle, plastique dans la mer et coraux.","qs":[{"q":"Quelle part de l’eau sur Terre est de l’eau douce ?","x":"Et la plus grande partie est prisonnière des glaciers et des calottes polaires.","o":["environ 2,5 %","environ 25 %","environ 50 %","environ 97 %"]},{"q":"Classe selon l’« eau virtuelle » nécessaire à la fabrication – de la plus faible à la plus grande quantité.","x":"Tomate : env. 13 l, café : env. 130 l, t-shirt : env. 2 700 l, bœuf : env. 15 000 l.","o":["1 tomate","1 tasse de café","1 t-shirt en coton","1 kg de bœuf"]},{"q":"En Allemagne, une personne consomme en moyenne environ 122 litres d’eau potable par jour.","x":"La plupart pour la douche, le bain et la chasse d’eau – seulement quelques litres pour boire et cuisiner."},{"q":"Qu’est-ce que la mer absorbe en grandes quantités, au point de devenir plus acide ?","x":"Les océans absorbent environ un quart du CO₂ produit par l’être humain – cela fait baisser le pH.","o":["Le CO₂ de l’air","Le sel des rivières","Le sable de la plage","L’oxygène des poissons"]},{"q":"Quand les coraux perdent leur couleur parce que l’eau est trop chaude, on parle de ___ des coraux.","x":"Les coraux rejettent leurs algues colorées – si la chaleur dure trop longtemps, ils meurent.","o":["blanchissement","floraison","sommeil","fête"]},{"q":"Une douche consomme généralement moins d’eau qu’un bain.","x":"Un bain demande environ 150 litres, une douche de 5 minutes avec un pommeau économique nettement moins."},{"q":"Quelle menace a quelle cause ?","x":"Beaucoup de menaces se renforcent les unes les autres.","p":[["Surpêche","Trop de bateaux de pêche"],["Déchets plastiques","Emballages jetés"],["Acidification","Absorption de CO₂"],["Blanchissement des coraux","Eau plus chaude"]]},{"q":"Qu’est-ce que le « Great Pacific Garbage Patch » ?","x":"Les courants marins y rassemblent des déchets plastiques sur une surface de plus d’un million de kilomètres carrés.","o":["Un immense tourbillon de déchets dan dent beaucoup d’espèces à se rétablir.","p":[["Tortue marine","Confond les sacs plastiques avec des méduses"],["Morue","Surpêche"],["Baleine","Bruit des bateaux et collisions"],["Récif de corail","Réchauffement de la mer"]]},{"q":"En Allemagne, économiser l’eau chaude est particulièrement efficace – à cause de l’énergie nécessaire pour la chauffer.","x":"Une douche plus courte et moins chaude économise de l’eau, de l’énergie et de l’argent."}]},{"t":"Alimentation & climat","d":"De saison, local et sans gaspillage.","qs":[{"q":"Classe selon les gaz à effet de serre par kilogramme – du plus faible au plus élevé.","x":"Le bœuf cause plusieurs fois plus d’émissions que les aliments végétaux.","o":["Pommes de terre","Tofu","Poulet","Bœuf"]},{"q":"Quand ces aliments sont-ils de saison en Allemagne ?","x":"Achetés de saison, ils évitent les serres chauffées et les longs trajets.","p":[["Asperges","D’avril à juin"],["Fraises","De mai à juillet"],["Courge","De septembre à novembre"],["Chou kale","De novembre à février"]]},{"q":"Une fois la date de durabilité minimale (« à consommer de préférence avant ») dépassée, il faut jeter les aliments tout de suite.","x":"Regarder, sentir, goûter ! Il faut seulement faire attention à la date « à consommer jusqu’au », par exemple pour la viande hachée."},{"q":"Quelle quantité de nourriture est jetée chaque année en Allemagne ?","x":"Plus de la moitié dans les foyers – environ 75 kg par personne.","o":["environ 11 millions de tonnes","environ 11 000 tonnes","environ 110 tonnes","environ 1 milliard de tonnes"]},{"q":"Pourquoi les fraises en janvier sont-elles généralement plus nuisibles au climat ?","x":"Local et de saison, c’est presque toujours le meilleur choix.","o":["Longs trajets, parfois en avion, ou serres chauffées","Elles contiennent plus de sucre en hiver","Elles sont plus rouges","Elles ne sont pas plus nuisibles au climat"]},{"q":"Les fruits et légumes cultivés à proximité sont dits ___.","x":"Local veut dire trajets courts – {"t":"Biodiversité","d":"Abeilles, tourbières et pourquoi le bois mort est plein de vie.","qs":[{"q":"Combien d’espèces animales et végétales sont menacées d’extinction selon la Plateforme intergouvernementale sur la biodiversité ?","x":"C’est ce qu’a constaté l’IPBES en 2019.","o":["environ 1 million","environ 1 000","environ 100","environ 10 milliards"]},{"q":"Les tourbières stockent plus de carbone que toutes les forêts de la Terre réunies – alors qu’elles ne couvrent qu’environ 3 % des terres.","x":"C’est pourquoi il est si important de remettre en eau les tourbières asséchées."},{"q":"Quel animal vit où ?","x":"Protéger les habitats, c’est protéger les espèces qui y vivent.","p":[["Castor","Rivière et ruisseau"],["Phoque","Mer des Wadden"],["Pic","Forêt"],["Alouette des champs","Champs et prairies"]]},{"q":"Pourquoi les abeilles et les autres pollinisateurs sont-ils si importants ?","x":"Sans pollinisateurs, il y aurait beaucoup moins de pommes, de cerises, de courges et d’amandes.","o":["Environ les trois quarts des principales plantes cultivées profitent de leur pollinisation","Ils produisent de l’oxygène","Ils mangent du plastique","Ils éloignent les loups"]},{"q":"Quand une seule espèce de plante pousse pendant des années sur une grande surface, on parle de ___.","x":"Les monocultures offrent peu d’habitats et sont sensibles aux parasites.","o":["monoculture","forêt mixte","bande fleurie","rotation des cultures"]},{"q":"Un jardin bien rangé avec une pelouse tondue ras est particulièrement bon pour les insectes.","x":"Les coins sauvages, les fleurs locales et les tas de feuilles ont beaucoup plus de valeur."},{"q":"Selon l’étude de Krefeld, de combien la masse d’insectes volants a-t-elle baissé dans les zones protégées entre 1989 et 2016 ?","x":"Cette étude de 2017 a fait connaître le problème de la disparition des insectes.","o":["de plus de 75 %","d’environ 5 %","d’environ 20 %","pas du tout"]},{"q":"Quel habitat est particulièrement riche en espèces ?","x at"],["Écosystème","Êtres vivants et environnement formant un tout"],["Diversité des espèces","Nombre d’espèces différentes"],["Pollinisation","Transport du pollen"]]},{"q":"Quel rapace avait presque disparu d’Allemagne et niche aujourd’hui de nouveau dans de nombreuses régions ?","x":"Grâce à des mesures de protection et à l’interdiction de l’insecticide DDT, la population s’est rétablie.","o":["Le pygargue à queue blanche","Le merle","Le moineau","Le pigeon"]},{"q":"Un éclairage fort la nuit nuit aux insectes.","x":"La pollution lumineuse attire les insectes nocturnes, qui finissent par mourir d’épuisement."}]},
{"t":"Mode & consommation","d":"Fast fashion, smartphones et réparation.","qs":[{"q":"Qu’entend-on par « fast fashion » ?","x":"Certaines marques sortent de nouvelles collections chaque semaine.","o":["Des vêtements bon marché produits vite et jetés vite","Des vêtements de sport pour courir","Des vêtements en plastique recyclé","De la mode vendue uniquement en ligne"]},{"q":"En 2013, l’usine textile Rana Plaza s’est effondrée au Bangladesh. Combien de personnes sont mortes ?","x":"La catastrophe a conduit à un accord obligatoire pour une meilleure sécurité des bâtiments.","o":["plus de 1 100","environ 10","environ 50","personne"]},{"q":"Beaucoup de vêtements dans les armoires allemandes sont rarement ou jamais portés.","x":"Selon des sondages, environ 40 % des vêtements sont peu ou pas du tout portés."},{"q":"Quelle notion va avec quelle idée ?","x":"Le vêtement le plus durable, c’est celui qui existe déjà.","p":[["Seconde main","Acheter d’occasion"],["Upcycling","Valoriser au lieu de jeter"],["Repair Café","Réparer ensemble"],["Troc de vêtements","Échanger au lieu d’acheter"]]},{"q":"Quand des entreprises se présentent comme plus écologiques qu’elles ne le sont, on appelle cela du ___.","x":"Fie-toi aux labels indépendants plutôt qu’aux slogans publicitaires verts.","o":["greenwashing","brainstorming","upcycling","carsharing"]},{"q":"Quelle matière première pour les batteries de portables est souvent extraite en République démocratique du Congo – parfois dans des conditions dangereuses ?","x":"Des enfants aussi travaillent là-bas dans de petites mines.","o":["Le cobalt","Le bois","La laine de mouton","Le cacao"]},{"q":"Garder son smartphone plus longtemps est l’un des moyens les plus efficaces de réduire l’empreinte de son portable.","x":"La plus grande partie des émissions d’un smartphone vient de sa fabrication."},{"q":"Remets dans l’ordre le parcours d’un t-shirt.","x":"Souvent, ces étapes ont lieu dans des pays différents – un t-shirt parcourt des milliers de kilomètres.","o":["Cultiver le coton","Filer le fil","Tisser et teindre le tissu","Coudre le t-shirt","Le vendre en magasin"]},{"q":"Combien de vêtements neufs une personne achète-t-elle en moyenne par an en Allemagne ?","x":"C’est plus d’un nouveau vêtement par semaine.","o":["environ 60","environ 5","environ 500","environ 1"]},{"q":"Qu’est-ce que le « droit à la réparation » ?","x":"L’UE a adopté une directive à ce sujet en 2024.","o":["Des règles de l’UE qui rendent les réparations et les pièces détachées plus accessibles","Une loi qui interdit les réparations","Un portable gratuit pour tout le monde","Une garantie pour les vêtements neufs"]},{"q":"Les vêtements en polyester perdent des fibres de microplastique au lavage.","x":"Un sac de lavage avec filtre et des lavages moins fréquents aident."},{"q":"Emprunter, échanger ou utiliser des choses ensemble au lieu de les acheter neuves, on appelle cela le ___.","x":"Perceuse, vélo cargo, voiture – beaucoup de choses se partagent très bien.","o":["sharing","shopping","streaming","styling"]},{"q":"Qu’entend-on par « obsolescence programmée » ?","x":"On discute pour savoir si c’est fait exprès – mais une chose est sûre : les produits réparables durent plus longtemps.","o":["Le reproche selon lequel des produits sont conçus exprès pour tomber en panne tôt","Une réduction à l’achat","Une garantie plus longue","Un procédé de recyclage"]},{"q":"Le label officiel allemand pour les textiles produits de façon durable s’appelle « Grüner ___ » (« Grüner » veut dire « vert »).","x":"Il contrôle des exigences sociales et écologiques concernant le produit et l’entreprise.","o":["Knopf (bouton)","Faden (fil)","Punkt (point)","Engel (ange)"]},{"q":"Le coton bio est cultivé sans pesticides chimiques de synthèse.","x":"De plus, les semences génétiquement modifiées sont interdites."},{"q":"Quel label va avec quel domaine ?","x":"Les labels aident – mais seulement si on sait ce qu’ils contrôlent.","p":[["GOTS","Textiles bio"],["Grüner Knopf","Label textile officiel allemand"],["Étiquette énergie de l’UE","Consommation d’énergie des appareils"],["Blauer Engel","Produits écologiques"]]},{"q":"La fermeture éclair de ta veste préférée est cassée. Quelle est la solution la plus durable ?","x":"Une réparation coûte souvent peu et économise beaucoup de ressources.","o":["La faire réparer","Jeter la veste","Acheter une nouvelle veste","La mettre aux ordures ménagères"]},{"q":"Les vêtements commandés en ligne sont souvent renvoyés – cela cause des transports supplémentaires.","x":"L’Allemagne fait partie des pays d’Europe avec le plus de retours de colis."}]},
{"t":"Justice mondiale","d":"Les 17 objectifs, la justice climatique et l’égalité des chances.","qs":[{"q":"Combien d’objectifs de développement durable (ODD) les Nations unies ont-elles adoptés en 2015 ?","x":"Les 17 objectifs forment ensemble l’Agenda 2030.","o":["17","5","10","100"]},{"q":"Quel objectif de développement durable a quel thème ?","x":"Les 17 objectifs sont tous liés entre eux.","p":[["ODD 5","Égalité entre les sexes"],["ODD 6","Eau propre"],["ODD 12","Consommation durable"],["ODD 13","Lutte contre le changement climatique"]]},{"q":"Les objectifs de développement durable doivent être atteints d’ici l’année ___.","x":"C’est pourquoi ce plan s’appelle aussi « Agenda 2030 ».","o":["2030","2025","2050","2100"]},{"q":"Si tout le monde vivait comme nous en Allemagne, de combien de Terres aurions-nous besoin environ ?","x":"C’est pourquoi le jour du dépassement de l’Allemagne tombe déjà en mai (2026 : le 10 mai).","o":["environ 3","environ 1","environ 0,5","environ 10"]},{"q":"Les pays qui ont le moins contribué à la crise climatique sont souvent les plus touchés par ses conséquences.","x":"C’est exactement le sujet de la justice climatique."},{"q":"Que signifie le « jour du dépassement » ?","x":"Au niveau mondial, il tombe maintenant fin juillet.","o":["À partir de ce jour, l’humanité a consommé plus que ce que la Terre peut renouveler en un an","Le jour où il y a le plus de circulation","Le jour le plus chaud de l’année","Le Jour de la Terre, le 22 avril"]},{"q":"Quel était en 2025 en Allemagne l’écart de salaire brut entre femmes et hommes (Gender Pay Gap non corrigé, salaire horaire) ?","x":"En moyenne, les femmes gagnaient 16 % de moins par heure que les hommes.","o":["16 %","1 %","50 %","0 %"]},{"q":"Les 10 % les plus riches de la population mondiale causent environ la moitié des émissions mondiales liées à la consommation.","x":"La moitié la plus pauvre de l’humanité, elle, ne cause qu’environ 8 %."},{"q":"Remets ces étapes clés de la politique climatique dans l’ordre chronologique.","x":"Rio 1992, Kyoto 1997, Paris 2015.","o":["Sommet de la Terre à Rio de Janeiro","Protocole de Kyoto","Accord de Paris sur le climat"]},{"q":"Que signifie l’ODD 1 ?","x":"Plus de 800 millions de personnes vivent dans l’extrême pauvreté – avec moins de 3 dollars américains par jour.","o":["Pas de pauvreté","Pas de plastique","Pas de voitures","Pas de devoirs"]},{"q":"Quand on s’engage sans être payé pour une bonne cause, on travaille ___.","x":"En Allemagne, des millions de personnes font du bénévolat.","o":["bénévolement","à plein temps","à côté","en secret"]},{"q":"Le développement durable a trois dimensions : l’écologie, l’économie et le social.","x":"C’est seulement quand les trois vont ensemble que quelque chose est vraiment durable."},{"q":"En quelle année la Déclaration universelle des droits de l’homme a-t-elle été adoptée ?","x":"Les Nations unies l’ont adoptée le 10 décembre 1948.","o":["1948","1848","1989","2001"]},{"q":"Le mouvement pour le climat « Fridays for ___ » s’est fait connaître grâce à des grèves scolaires.","x":"Il a commencé en 2018 avec la grève scolaire de Greta Thunberg en Suède.","o":["Future","Freedom","Fun","Friends"]},{"q":"Le droit à l’éducation est un droit humain.","x":"Il figure à l’article 26 de la Déclaration universelle des droits de l’homme."},{"q":"Encore d’autres objectifs : quel ODD a quel thème ?","x":"Avec les ODD 1, 5, 6, 12 et 13, tu connais maintenant déjà beaucoup des 17 objectifs.","p":[["ODD 2","Faim zéro"],["ODD 4","Éducation de qualité"],["ODD 7","Énergie propre"],["ODD 14","Vie aquatique"]]},{"q":"Que signifie la « justice entre les générations » ?","x":"C’est le cœur de l’idée de développement durable.","o":["Vivre aujourd’hui de façon à ce que les générations futures aient elles aussi de bonnes chances dans la vie","Les personnes âgées doivent payer plus","Chaque génération a ses propres écoles","Seuls les enfants ont le droit de voter"]},{"q":"Même les jeunes de moins de 18 ans peuvent s’engager en politique, par exemple dans des parlements de jeunes.","x":"Dans beaucoup de villes, il existe des parlements de jeunes ou des conseils de jeunes."}]},{"t":"Mobilité & transports","d":"Voiture, vélo, train et transition des transports.","qs":[{"q":"Quelle part des émissions de gaz à effet de serre en Allemagne provient des transports ?","x":"En 2023, c’était environ 22 %. La très grande majorité vient de la circulation routière, surtout des voitures et des camions.","o":["environ un cinquième","environ un centième","environ la moitié","presque tout"]},{"q":"Les émissions de gaz à effet de serre des transports en Allemagne n’ont que peu baissé depuis 1990.","x":"Jusqu’en 2023, seulement d’environ 11 % – beaucoup moins que dans d’autres secteurs. Les moteurs sont certes devenus plus économes, mais il y a plus de voitures, des voitures plus grosses et plus de trafic."},{"q":"Avec le ___, on peut prendre les bus, les trams et les trains régionaux dans toute l’Allemagne pour un prix mensuel fixe.","x":"Ce ticket existe depuis mai 2023. Les trains ICE et IC ne sont pas inclus. Le prix a déjà été modifié plusieurs fois (2026 : 63 euros par mois).","o":["Deutschlandticket","billet d’avion","ticket de parking","ticket de cinéma"]},{"q":"Combien d’heures par jour une voiture reste-t-elle en moyenne inutilisée en Allemagne ?","x":"En moyenne, une voiture roule moins d’une heure par jour – le reste du temps, elle a besoin d’une place de stationnement.","o":["environ 23 heures","environ 2 heures","environ 8 heures","environ 12 heures"]},{"q":"Quelle notion va avec quelle description ?","x":"Ainsi, on arrive à destination de façon flexible, sans que chacun ait besoin de sa propre voiture.","p":[["Autopartage (carsharing)","Louer une voiture à l’heure quand on en a besoin"],["VAE (Pedelec)","Vélo à assistance électrique"],["Parking relais (Park-and-Ride)","En voiture jusqu’à la gare, puis en train"],["Covoiturage","Plusieurs personnes font le trajet ensemble dans une voiture"]]},{"q":"En Allemagne, on peut conduire une trottinette électrique à partir de 14 ans.","x":"Pas besoin de permis. Mais : une seule personne par trottinette – et il est interdit de rouler sur le trottoir."},{"q":"Combien de personnes y a-t-il en moyenne dans une voiture qui roule en Allemagne ?","x":"La plupart des places restent donc vides. Avec le covoiturage, on pourrait éviter beaucoup de trajets.","o":["environ 1,4","environ 2,5","environ 3,5","environ 4,5"]},{"q":"Environ combien de voitures sont immatriculées en Allemagne ?","x":"C’est plus d’une voiture pour deux habitants – et le nombre augmente encore légèrement.","o":["près de 50 millions","environ 5 millions","environ 150 millions","environ 500 000"]},{"q":"Sur toute sa durée de vie, une voiture électrique est généralement meilleure pour le climat qu’une voiture à essence – même si la fabrication de la batterie produit beaucoup de CO₂.","x":"La voiture électrique rattrape son désavantage de fabrication au bout d’un certain temps d’utilisation. Plus elle se recharge avec de l’électricité verte, plus son avance est grande."},{"q":"Quand les enfants sont conduits en voiture jusque devant la porte de l’école, on parle de « parents ___ ».","x":"Les parents taxi provoquent le matin des bouchons et des situations dangereuses devant les écoles. Venir à pied, à vélo ou en bus fait bouger et rend autonome.","o":["taxi","bateau","avion","train"]},{"q":"Remets ces étapes clés de la mobilité dans l’ordre chronologique.","x":"1835, 1886, 1991, 2023 – d’ailleurs, le premier chemin de fer allemand roulait en Bavière.","o":["Premier chemin de fer allemand Nuremberg–Fürth","Carl Benz dépose le brevet de sa voiture à moteur à essence","Premier ICE en service commercial","Lancement du Deutschlandticket"]},{"q":"Quelle motorisation va avec quel véhicule ?","x":"L’impact climatique d’une motorisation électrique dépend de la façon dont l’électricité ou l’hydrogène sont produits.","p":[["Voiture électrique",
