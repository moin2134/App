"Batterie"],["Voiture à pile à combustible","Hydrogène"],["Tram","Électricité de la caténaire"],["Bus diesel","Carburant issu du pétrole"]]},{"q":"Quelle règle s’applique dans une rue cyclable (Fahrradstraße) ?","x":"Tous les véhicules y sont limités à 30 km/h – et les cyclistes ne doivent pas être gênés.","o":["Les cyclistes peuvent rouler côte à côte, les voitures seulement avec un panneau complémentaire","Les vélos doivent y être poussés à la main","Les voitures y sont toujours prioritaires sur les vélos","Il n’y a pas de limitation de vitesse"]},{"q":"En avion, seul le CO₂ émis nuit au climat.","x":"Les traînées de condensation et les oxydes d’azote à haute altitude réchauffent aussi la Terre. Selon les calculs du DLR (Centre aérospatial allemand), seulement environ un tiers de l’effet du transport aérien sur le climat est dû au CO₂."},{"q":"Environ quelle surface occupe une seule place de stationnement pour voiture ?","x":"C’est à peu près la taille d’une chambre d’enfant. Sur la même surface, on peut garer environ huit à dix vélos.","o":["environ 12 m²","environ 1 m²","environ 100 m²","environ 1 000 m²"]},{"q":"L’idée qu’on peut rejoindre l’école, les magasins, le médecin et le parc en un quart d’heure à pied ou à vélo s’appelle la « ville des ___ minutes ».","x":"C’est surtout Paris qui a fait connaître ce concept. Les trajets courts évitent le trafic avant même qu’il n’existe.","o":["15","5","60","90"]},{"q":"Le principe de la transition des transports : qu’est-ce qui est prioritaire ? Classe de la première à la dernière étape.","x":"Le trajet le plus respectueux du climat, c’est celui qu’on n’a pas besoin de faire – comme pour les déchets, où éviter passe en premier.","o":["Éviter les déplacements","Reporter les déplacements (par ex. sur le train et le vélo)","Améliorer les déplacements (par ex. motorisations propres)"]},{"q":"Jusqu’à quelle vitesse le moteur d’un VAE normal aide-t-il à pédaler ?","x":"C’est pourquoi un VAE est juridiquement un vélo – sans permis ni plaque d’assurance. Les speed bikes plus rapides (S-Pedelecs, jusqu’à 45 km/h) sont en revanche considérés comme des cyclomoteurs.","o":["25 km/h","10 km/h","60 km/h","120 km/h"]}]},
{"t":"Numérique & climat","d":"Streaming, centres de données, IA et déchets électroniques.","qs":[{"q":"Environ quelle part des émissions mondiales de gaz à effet de serre est due au numérique (appareils, réseaux et centres de données) ?","x":"C’est à peu près autant que tout le transport aérien – et cette part augmente.","o":["environ 2 à 4 %","environ 30 à 40 %","environ 60 à 70 %","moins de 0,01 %"]},{"q":"Quelles données représentent la plus grande partie du trafic mondial sur Internet ?","x":"Les vidéos en haute résolution produisent d’énormes quantités de données. Adapter la résolution à la taille de l’écran économise des données et de l’énergie.","o":["Les vidéos, par exemple en streaming","Les e-mails","Les messages texte","Les recherches sur le web"]},{"q":"Une heure de vidéo sur un grand téléviseur consomme plus d’électricité que la même heure sur un smartphone.","x":"En streaming, c’est souvent l’appareil lui-même qui consomme le plus – un grand téléviseur plusieurs fois plus qu’un portable."},{"q":"En streaming, la transmission des données par la fibre optique est meilleure pour le climat que par le réseau mobile.","x":"Selon une étude pour l’Umweltbundesamt (Agence fédérale de l’environnement), une heure de streaming HD par la fibre produit environ 2 g de CO₂ (centre de données et transmission), par l’ancien réseau 3G c’était environ 90 g. À la maison, mieux vaut donc utiliser le Wi-Fi !"},{"q":"Le symbole de la ___ barrée signifie : cet appareil ne va pas dans les ordures ménagères.","x":"Les appareils électriques contiennent des matières premières précieuses et parfois des substances toxiques. Ils vont à la déchetterie ou dans un point de collecte en magasin.","o":["poubelle","ampoule","prise","étoile"]},{"q":"Quelle notion va avec quelle explication ?","x":"Le « cloud » n’est donc pas un nuage : tes photos sont stockées dans des centres de données qui consomment de l’électricité jour et nuit.","p":[["Centre de données","Bâtiment rempli de serveurs"],["Cloud","Stocker des données sur les serveurs de quelqu’un d’autre"],["Déchets électroniques","Appareils électriques hors d’usage"],["Reconditionné","Appareil d’occasion remis à neuf"]]},{"q":"Quelle quantité de déchets électroniques le monde a-t-il produite en 2022 ?","x":"À peine un quart a été collecté et recyclé de façon prouvée. D’ici 2030, cela pourrait atteindre environ 82 millions de tonnes selon l’ONU.","o":["environ 62 millions de tonnes","environ 62 000 tonnes","environ 620 tonnes","environ 6 milliards de tonnes"]},{"q":"Les grands magasins d’électronique et beaucoup de supermarchés doivent reprendre gratuitement les petits appareils électriques usagés – même si on n’achète rien de neuf.","x":"Cela concerne les appareils jusqu’à 25 cm de côté, par exemple les portables, les câbles de charge ou les écouteurs – jusqu’à trois par type d’appareil."},{"q":"Selon un sondage de Bitkom (fédération allemande du numérique), combien de vieux portables inutilisés traînent dans les foyers allemands ?","x":"Ils contiennent de l’or, de l’argent et d’autres matières premières précieuses. Le nombre baisse – fin 2022, il y en avait encore environ 210 millions –, mais il reste énorme.","o":["environ 170 millions","environ 1,7 million","environ 17 000","environ 1,7 milliard"]},{"q":"Depuis fin 2024, les nouveaux portables vendus dans l’UE doivent avoir un port de charge ___ commun.","x":"Ainsi, un seul chargeur convient à beaucoup d’appareils. Les nouveaux appareils peuvent aussi être vendus sans bloc d’alimentation – cela évite des déchets électroniques.","o":["USB-C","HDMI","VGA","jack"]},{"q":"Classe selon la consommation d’électricité quand on regarde une vidéo – de la plus faible à la plus élevée.","x":"Un smartphone ne consomme que quelques watts, un grand téléviseur souvent plus de 100 watts. Plus l’écran est petit, moins on consomme.","o":["Smartphone","Ordinateur portable","Grand téléviseur"]},{"q":"Qu’impose l’UE depuis juin 2025 pour les nouveaux smartphones ?","x":"En plus : au moins 5 ans de mises à jour après la fin de la vente, et des batteries qui gardent au moins 80 % de leur capacité après 800 cycles de charge. Ainsi, les portables durent plus longtemps.","o":["Les pièces détachées importantes doivent rester disponibles 7 ans après la fin de la vente","Chaque portable doit fonctionner pendant 20 ans","Les portables ne peuvent plus être fabriqués qu’en Europe","Les portables ne peuvent plus avoir d’appareil photo"]},{"q":"Quelle part de l’électricité mondiale les centres de données ont-ils consommée en 2024 selon l’Agence internationale de l’énergie (AIE) ?","x":"D’ici 2030, leur consommation pourrait plus que doubler selon l’AIE – pour atteindre à peu près la consommation totale actuelle du Japon.","o":["environ 1,5 %","environ 15 %","environ 50 %","environ 0,001 %"]},{"q":"Les centres de données n’ont pas seulement besoin d’électricité, mais souvent aussi de beaucoup d’eau pour le refroidissement.","x":"Les serveurs chauffent quand ils calculent. Beaucoup d’installations sont refroidies avec de l’eau, qui s’évapore en partie – dans les régions sèches, cela peut devenir un problème."},{"q":"Quand la technique devient plus économe mais qu’on l’utilise du coup beaucoup plus et qu’on n’économise presque pas d’énergie au final, on appelle cela l’effet ___.","x":"Exemple : le streaming devient plus efficace, mais nous regardons de plus en plus de vidéos dans une résolution de plus en plus haute.","o":["rebond","domino","de serre","placebo"]},{"q":"Centres de données : qu’est-ce qui va ensemble ?","x":"L’Energieeffizienzgesetz (loi allemande sur l’efficacité énergétique) exige que les centres de données utilisent à partir de 2027 une électricité entièrement renouvelable.","p":[["Serveur","Ordinateur qui fournit des données et des services à d’autres"],["Entraînement d’IA","Un modèle apprend à partir d’énormes quantités de données"],["Chaleur perdue","Chaleur des serveurs qui peut chauffer des logements"],["Électricité verte","Électricité produite par le soleil, le vent et l’eau"]]},{"q":"Classe ces quantités de données – de la plus petite à la plus grande.","x":"Chaque niveau est environ 1 000 fois plus grand que le précédent. Une heure de vidéo en qualité HD peut déjà représenter plusieurs gigaoctets.","o":["Kilooctet","Mégaoctet","Gigaoctet","Téraoctet"]},{"q":"Qu’est-ce qui fait actuellement grimper particulièrement fort les besoins en électricité des centres de données ?","x":"Entraîner et utiliser de grands modèles d’IA demande des puces particulièrement puissantes. Selon l’AIE, l’IA est le principal moteur de la hausse de la consommation des centres de données.","o":["L’intelligence artificielle (IA)","Les journaux imprimés","Les appels sur le téléphone fixe","Les calculatrices"]}]},
{"t":"Droits de l’enfant","d":"Tes droits – à l’école, en ligne et dans le monde.","qs":[{"q":"En quelle année les Nations unies ont-elles adopté la Convention relative aux droits de l’enfant ?","x":"Elle a été adoptée le 20 novembre 1989. C’est pourquoi le 20 novembre est la Journée internationale des droits de l’enfant.","o":["1989","1948","1968","2015"]},{"q":"Selon la Convention de l’ONU relative aux droits de l’enfant, toute personne de moins de 18 ans est un enfant.","x":"C’est écrit à l’article 1. Les droits s’appliquent à tous les enfants – peu importe leur origine, leur sexe ou leur religion."},{"q":"La Convention de l’ONU relative aux droits de l’enfant compte ___ articles.","x":"Les 41 premiers articles décrivent les droits des enfants. Les autres règlent la façon dont les États les appliquent et les font contrôler.","o":["54","10","17","100"]},{"q":"Quel est le seul État membre de l’ONU à ne pas avoir ratifié la Convention relative aux droits de l’enfant ?","x":"Tous les autres – 196 États parties au total – l’ont fait. Les États-Unis ont bien signé la Convention en 1995, mais ne l’ont jamais ratifiée.","o":["les États-Unis","l’Allemagne","la France","le Brésil"]},{"q":"Quel droit de l’enfant est concerné ici ?","x":"Ces droits figurent aux articles 28 (éducation), 31 (loisirs et jeu), 19 (protection contre la violence) et 12 (participation).","p":[["Une fille n’a pas le droit d’aller à l’école","Droit à l’éducation"],["Un enfant n’a jamais le temps de jouer après l’école","Droit aux loisirs et au jeu"],["Un enfant est frappé","Droit à la protection contre la violence"],["On ne demande pas l’avis des enfants pour aménager la cour de l’école","Droit à la participation"]]},{"q":"En Allemagne, les enfants ont légalement droit à une éducation sans violence.","x":"Depuis 2000, le Code civil allemand précise : les punitions corporelles, les blessures psychologiques et les autres mesures humiliantes sont interdites."},{"q":"Que signifie le principe de « primauté de l’intérêt de l’enfant » ?","x":"C’est écrit à l’article 3 et s’applique par exemple aux tribunaux, aux administrations, aux parlements et aux institutions sociales.","o":["Dans toutes les décisions qui concernent les enfants, leur bien-être doit être pris en compte en priorité","Les enfants peuvent prendre toutes les décisions seuls","Les enfants doivent toujours obéir aux adultes","Seuls les enfants peuvent voter les lois"]},{"q":"Au « Nummer gegen ___ » (116 111), les enfants et les jeunes trouvent gratuitement et anonymement une oreille attentive.","x":"On n’est pas obligé de donner son nom. Le samedi, de jeunes conseillers et conseillères de 16 à 21 ans répondent aussi.","o":["Kummer (chagrin)","Hunger (faim)","Langeweile (ennui)","Lärm (bruit)"]},{"q":"Comment s’appelle le Fonds des Nations unies pour l’enfance ?","x":"L’UNICEF a été fondé en 1946 pour aider les enfants après la Seconde Guerre mondiale. Aujourd’hui, il agit dans plus de 190 pays et territoires.","o":["UNICEF","OTAN","OPEP","FIFA"]},{"q":"Remets ces événements des droits de l’enfant dans l’ordre chronologique.","x":"1924, 1946, 1989, 1992. La Déclaration de Genève de la Société des Nations n’était pas encore un traité obligatoire – la Convention, si.","o":["Déclaration de Genève sur les droits de l’enfant","Création de l’UNICEF","Adoption de la Convention de l’ONU relative aux droits de l’enfant","Entrée en vigueur de la Convention en Allemagne"]},{"q":"Les droits de l’enfant sont inscrits explicitement dans la Loi fondamentale allemande.","x":"On en débat depuis des années, mais jusqu’à présent (état en 2026), il manque la majorité des deux tiers nécessaire. Beaucoup de constitutions des Länder contiennent en revanche déjà des droits de l’enfant."},{"q":"Que garantit l’article 12 de la Convention de l’ONU relative aux droits de l’enfant ?","x":"L’avis est pris en compte selon l’âge et la maturité. Les délégués de classe et les représentants des élèves sont un exemple de participation.","o":["Les enfants ont le droit de donner leur avis sur tout ce qui les concerne – et cet avis doit être pris en compte","Les enfants peuvent voter dès 12 ans","Les enfants doivent travailler dès 12 ans","Les enfants reçoivent leur propre portable dès 12 ans"]},{"q":"Qu’a confirmé explicitement le Comité des droits de l’enfant de l’ONU en 2023 ?","x":"Dans l’« Observation générale n° 26 », le Comité demande aux États de protéger les enfants contre les conséquences de la crise climatique. Plus de 16 000 enfants de 121 pays y ont participé.","o":["Les enfants ont droit à un environnement propre, sain et durable","Les enfants ont droit à leur propre smartphone","Les enfants peuvent participer aux élections dès 12 ans","Les enfants ne sont pas obligés d’aller à l’école"]},{"q":"On a le droit de publier sur Internet des photos de ses camarades de classe sans leur permission.","x":"Chacun a un droit à l’image. La Convention de l’ONU relative aux droits de l’enfant protège en plus la vie privée des enfants (article 16)."},{"q":"Quand des parents partagent beaucoup de photos et de vidéos de leurs enfants sur les réseaux sociaux, on appelle cela le ___.","x":"Le mot associe « share » (partager) et « parenting » (éducation des enfants). Les spécialistes de la protection de l’enfance conseillent : demander d’abord aux enfants et ne pas poster d’images gênantes.","o":["sharenting","upcycling","carsharing","greenwashing"]},{"q":"Qu’a décidé la Cour constitutionnelle fédérale en 2021 après une plainte de jeunes ?","x":"La Cour a constaté que trop peu de protection du climat aujourd’hui imposerait plus tard aux plus jeunes des restrictions très dures. Le Bundestag a ensuite renforcé les objectifs climatiques.","o":["La loi sur la protection du climat devait être améliorée pour protéger la liberté des générations futures","Les écoles ne peuvent plus proposer de cours sur le climat","Les voitures à moteur thermique ont été interdites immédiatement","La protection du climat est une affaire purement privée"]},{"q":"Comment un traité de l’ONU comme la Convention relative aux droits de l’enfant prend-il effet dans un pays ? Remets les étapes dans l’ordre.","x":"Le Comité des droits de l’enfant de l’ONU examine les rapports et fait des recommandations aux États sur ce qu’ils doivent améliorer.","o":["L’Assemblée générale de l’ONU adopte le traité","Un État signe le traité","L’État ratifie le traité","L’État rend régulièrement des rapports au comité de l’ONU à Genève"]},{"q":"Quelle limite d’âge s’applique à quoi en Allemagne ?","x":"Aux élections européennes de 2024, les jeunes de 16 ans ont pu voter pour la première fois en Allemagne. Pour les élections au Bundestag et au Landtag de Bavière, l’âge reste fixé à 18 ans.","p":[["7 ans","Capacité juridique limitée (par ex. achats avec l’argent de poche)"],["14 ans","Responsabilité pénale"],["16 ans","Droit de vote aux élections européennes"],["18 ans","Majorité"]]}]},{"t":"Forêts & tourbières en Bavière","d":"Les forêts face au changement climatique et les tourbières, protectrices du climat.","qs":[{"q":"Quelle part de la surface de la Bavière est couverte de forêts ?","x":"Selon l’inventaire forestier national, c’est environ 37 % – soit environ 2,6 millions d’hectares.","o":["un bon tiers","environ un dixième","environ deux tiers","presque toute la surface"]},{"q":"La Bavière a la plus grande surface forestière de tous les Länder allemands.","x":"Avec environ 2,6 millions d’hectares, la Bavière abrite un bon cinquième de la forêt allemande."},{"q":"Quelle essence d’arbre est la plus répandue dans les forêts bavaroises ?","x":"L’épicéa pousse sur presque 40 % de la surface forestière, suivi du pin et du hêtre.","o":["L’épicéa","Le hêtre","Le chêne","Le bouleau"]},{"q":"Une forêt a des étages. Classe-les de bas en haut.","x":"Chaque étage offre un habitat à d’autres animaux et plantes – c’est une des raisons pour lesquelles les forêts proches de l’état naturel sont si riches en espèces.","o":["Strate des mousses","Strate herbacée","Strate arbustive","Strate arborée"]},{"q":"Le mot « durabilité » (Nachhaltigkeit) vient de la ___ : en 1713, Hans Carl von Carlowitz demandait de ne couper que la quantité de bois qui repousse.","x":"Carlowitz dirigeait les mines en Saxe. À l’époque, on risquait de manquer de bois, car les mines et les fonderies en consommaient d’énormes quantités.","o":["sylviculture","pêche","industrie automobile","conquête spatiale"]},{"q":"Quel arbre a quels fruits ou quels cônes ?","x":"Les cônes de sapin se désagrègent déjà sur l’arbre. Ce qu’on trouve par terre et qu’on appelle « pommes de pin » ou « cônes de sapin », ce sont souvent des cônes d’épicéa.","p":[["Hêtre commun","Faînes"],["Chêne","Glands"],["Épicéa","Cônes pendants"],["Sapin blanc","Cônes dressés"]]},{"q":"Pourquoi beaucoup de forêts d’épicéas sont-elles en danger en Bavière ?","x":"Les épicéas affaiblis ont du mal à se défendre avec leur résine. Le typographe, une espèce de scolyte, se multiplie particulièrement vite pendant les étés chauds.","o":["La chaleur et la sécheresse affaiblissent les arbres, puis le scolyte les attaque","Il y a trop d’écureuils","Les épicéas ont besoin de plus de neige qu’il n’en tombe aujourd’hui","Les épicéas poussent trop vite et se cassent"]},{"q":"L’épicéa a des racines profondes et supporte donc bien la sécheresse.","x":"L’épicéa a des racines peu profondes. Les arbres à racines profondes comme le sapin blanc ou le chêne atteignent l’eau dans les couches plus profondes du sol – et résistent mieux aux tempêtes."},{"q":"Quand on transforme petit à petit des forêts de conifères purs en forêts mixtes résistantes au climat, on parle de la ___ de la forêt.","x":"La Bavière veut transformer environ 200 000 hectares de forêts privées et communales d’ici 2030. Les forêts mixtes résistent mieux à la chaleur, aux tempêtes et aux parasites.","o":["transformation","combustion","course","mort"]},{"q":"À qui appartient la plus grande partie de la forêt en Bavière ?","x":"Un peu plus de la moitié est de la forêt privée : environ 700 000 personnes possèdent de la forêt. Environ 30 % appartiennent à l’État libre de Bavière et sont surtout gérés par les Bayerische Staatsforsten (forêts domaniales de Bavière).","o":["À des particuliers","À l’État fédéral","À l’Union européenne","Aux Églises"]},{"q":"Selon l’inventaire forestier national, la forêt en Allemagne a perdu plus de carbone qu’elle n’en a stocké entre 2017 et 2022.","x":"La sécheresse, les tempêtes et les scolytes ont fait mourir tellement d’arbres que la forêt est devenue pendant cette période une source de CO₂ au lieu d’un puits de CO₂."},{"q":"Qu’est-ce qu’une forêt de protection dans les Alpes ?","x":"Si une forêt de protection meurt, de coûteux ouvrages en acier et en béton doivent prendre le relais. C’est pourquoi la Bavière l’entretient et la restaure de façon ciblée.","o":["Une forêt qui protège les villages et les routes des avalanches, des chutes de pierres et des coulées de boue","Une forêt où personne n’a le droit d’entrer","Une forêt clôturée pour les sangliers","Une forêt composée seulement de jeunes arbres"]},{"q":"À quelle vitesse environ la couche de tourbe grandit-elle dans une tourbière haute intacte ?","x":"Il faut donc environ 1 000 ans à une tourbière pour former un mètre de tourbe. Une tourbière drainée, elle, rétrécit beaucoup plus vite.","o":["environ 1 millimètre par an","environ 1 mètre par an","environ 10 centimètres par mois","environ 1 centimètre par jour"]},{"q":"Acheter du terreau sans tourbe aide à protéger les tourbières.","x":"Pour le terreau classique, on extrait de la tourbe des tourbières. Le terreau sans tourbe contient à la place par exemple du compost, des fibres de bois ou de l’humus d’écorce."},{"q":"Qu’est-ce qui va ensemble ?","x":"Les tourbières hautes sont très pauvres en nutriments. Le rossolis compense en attrapant de petits insectes avec des gouttelettes collantes.","p":[["Tourbière haute","Alimentée uniquement par l’eau de pluie"],["Tourbière basse","Alimentée par les eaux souterraines"],["Sphaigne","Se gorge d’eau comme une éponge"],["Rossolis (drosera)","Plante carnivore des tourbières"]]},{"q":"Quand on remet en eau une tourbière drainée, on parle de ___.","x":"Quand l’eau remonte, la tourbe ne se décompose plus. La tourbière ne libère presque plus de CO₂ et peut recommencer à grandir.","o":["réhumidification","drainage","reboisement","remembrement"]},{"q":"Comment un lac devient-il une tourbière haute ? Remets les étapes dans l’ordre.","x":"Cela prend des milliers d’années. Beaucoup de tourbières bavaroises se sont formées après la dernière glaciation dans les Préalpes.","o":["Lac peu profond","Comblement par les roseaux et les laîches","Tourbière basse","Tourbière haute"]},{"q":"Quelle part des tourbières de Bavière est drainée ?","x":"Les tourbières drainées libèrent de grandes quantités de CO₂. Dans le Donaumoos, la plus grande tourbière basse du sud de l’Allemagne, le sol s’est ainsi déjà affaissé de plus de 3 mètres.","o":["environ 95 %","environ 5 %","environ 25 %","environ 50 %"]}]},
{"t":"Allemagne : énergie & climat en chiffres","d":"Émissions, électricité verte et boom solaire en Bavière.","qs":[{"q":"Environ combien de gaz à effet de serre l’Allemagne a-t-elle émis en 2025 (en équivalents CO₂) ?","x":"Précisément, c’était environ 649 millions de tonnes. Cela fait environ 7,7 tonnes par personne.","o":["environ 650 millions de tonnes","environ 65 millions de tonnes","environ 6,5 milliards de tonnes","environ 65 milliards de tonnes"]},{"q":"De combien les émissions de gaz à effet de serre de 2025 étaient-elles inférieures à celles de 1990 ?","x":"En 1990, c’était environ 1 253 millions de tonnes. D’ici 2030, elles doivent baisser de 65 %.","o":["d’environ 48 %","d’environ 5 %","d’environ 25 %","d’environ 90 %"]},{"q":"Selon la loi sur la protection du climat, l’Allemagne ne pourra plus émettre en 2030 qu’environ ___ millions de tonnes de gaz à effet de serre.","x":"Cela correspond à l’objectif de 65 % de moins qu’en 1990. D’ici 2045, l’Allemagne doit être neutre en gaz à effet de serre.","o":["438","43","4 380","1 253"]},{"q":"Entre 2024 et 2025, les émissions de gaz à effet de serre en Allemagne n’ont presque pas baissé.","x":"La baisse n’a été que d’environ 0,1 % – à peine un million de tonnes. Les émissions ont baissé dans l’industrie, mais augmenté dans les transports et les bâtiments."},{"q":"Dans les transports et les bâtiments, les émissions de 2025 ont augmenté par rapport à l’année précédente.","x":"Transports : environ +2,1 millions de tonnes ; bâtiments : environ +3,4 millions de tonnes. La baisse globale est venue surtout de l’industrie."},{"q":"Classe les quantités de gaz à effet de serre de l’Allemagne de la plus grande à la plus petite.","x":"D’ici 2025, presque la moitié du chemin a été faite – l’autre moitié doit suivre dans les 20 prochaines années.","o":["1990 : environ 1 253 millions de tonnes","2025 : environ 649 millions de tonnes","Objectif 2030 : environ 438 millions de tonnes","Objectif 2045 : zéro net"]},{"q":"Quel pourcentage de la consommation d’électricité en Allemagne les énergies renouvelables ont-elles couvert en 2025 ?","x":"C’est 0,7 point de pourcentage de plus qu’en 2024 – alors que le vent était très faible en début d’année. Les nouvelles installations solaires ont compensé.","o":["presque 56 %","environ 16 %","environ 36 %","presque 96 %"]},{"q":"Quelle source d’énergie a produit le plus d’électricité en Allemagne en 2025 ?","x":"Pour la première fois, le photovoltaïque était à la 2e place. Le vent et le soleil étaient donc pour la première fois ensemble en tête.","o":["L’éolien","Le lignite","Le gaz naturel","Le nucléaire"]},{"q":"En 2025, les installations solaires ont produit pour la première fois plus d’électricité que les centrales au lignite.","x":"La production d’électricité solaire a augmenté d’environ 21 % en 2025. Les centrales au lignite ont produit environ 67 térawattheures, un peu moins que l’année précédente."},{"q":"Fin 2025, toutes les installations solaires d’Allemagne avaient ensemble une puissance d’environ ___ gigawatts.","x":"En 2025, environ 16,4 gigawatts ont été ajoutés. Un gigawatt correspond à peu près à la puissance d’une grande tranche de centrale électrique.","o":["117","11","1 170","11 700"]},{"q":"Environ quelle puissance avaient toutes les éoliennes terrestres d’Allemagne fin 2025 ?","x":"En 2025, environ 4,6 gigawatts ont été ajoutés – deux fois plus que l’année précédente.","o":["environ 68 gigawatts","environ 6,8 gigawatts","environ 680 gigawatts","environ 6 800 gigawatts"]},{"q":"Quelle puissance va avec quel type d’installation (Allemagne, fin 2025) ?","x":"La puissance des installations renouvelables a augmenté d’environ 11 % en 2025. Les éoliennes les plus puissantes en mer du Nord font chacune 15 mégawatts.","p":[["Installations solaires","environ 117 gigawatts"],["Éoliennes terrestres","environ 68 gigawatts"],["Éoliennes en mer","environ 9,5 gigawatts"],["Toutes les installations renouvelables ensemble","environ 210 gigawatts"]]},{"q":"Quel Land a installé la plus grande puissance solaire ?","x":"Fin 2025, la Bavière comptait des installations solaires d’environ 35 gigawatts – soit environ 30 % de toute la puissance solaire allemande.","o":["La Bavière","Brême","Hambourg","La Sarre"]},{"q":"Fin 2025, le nombre d’installations photovoltaïques en Bavière atteignait presque ___ (en millions).","x":"Beaucoup sont de petites installations sur les toits des maisons. S’y ajoutent de grands parcs solaires au sol.","o":["1,4","14","0,1","40"]},{"q":"En 2025, la Bavière a construit plus de nouvelle puissance solaire que n’importe quel autre Land.","x":"Environ 4,5 gigawatts ont été ajoutés en Bavière en 2025 – plus d’un quart des nouvelles installations en Allemagne."},{"q":"Que disait la « règle 10H » bavaroise pour les éoliennes ?","x":"Pour une éolienne de 200 mètres de haut, cela faisait 2 kilomètres de distance. C’est pourquoi, pendant des années, très peu de nouvelles éoliennes ont été construites en Bavière.","o":["Une éolienne doit se trouver à une distance d’au moins dix fois sa hauteur des habitations","Une éolienne ne doit pas dépasser 10 mètres de haut","Une éolienne ne peut fonctionner que 10 heures par jour","Chaque village doit avoir 10 éoliennes"]},{"q":"Remets l’histoire de la règle 10H en Bavière dans l’ordre.","x":"2014 : introduction ; 27 octobre 2022 : décision du Landtag ; 16 novembre 2022 : entrée en vigueur.","o":["La règle 10H est introduite","Le Landtag décide un assouplissement","L’assouplissement entre en vigueur"]},{"q":"Quel nombre va avec quel fait sur la Bavière ?","x":"Depuis l’assouplissement, la distance plus courte s’applique par exemple dans les forêts, le long des autoroutes et des voies ferrées, près des zones d’activités et dans les zones prioritaires pour l’éolien.","p":[["environ 35 gigawatts","Puissance solaire en Bavière fin 2025"],["environ 4,5 gigawatts","Nouvelle puissance solaire en Bavière en 2025"],["2014","Introduction de la règle 10H"],["1 000 mètres","Distance minimale après l’assouplissement, par ex. dans les forêts et le long des autoroutes"]]}]}],"ag":{"t":"Club « Going green und fair »","d":"Engagement pour l’environnement et le commerce équitable au MMG.","names":["Le club & l’EDD","Change Fashion & boutique solidaire","Portables & cahiers MMG"],"qs":[{"q":"De qui est la citation « Ce que nous faisons aujourd’hui décide de ce à quoi le monde ressemblera demain » ?","x":"Cette écrivaine a vécu de 1830 à 1916 – bien avant que des mots comme « changement climatique » existent. Sa phrase motive pourtant encore aujourd’hui.","o":["Marie von Ebner-Eschenbach","Greta Thunberg","Albert Einstein","Johann Wolfgang von Goethe"]},{"q":"Le club du MMG s’appelle « Going green und ___ ».","x":"Le club s’engage pour l’environnement et le commerce équitable (en anglais « fair »).","o":["fair","fit","fun","fast"]},{"q":"Que signifie l’abréviation allemande BNE ?","x":"La BNE doit rendre chacun capable de penser et d’agir de façon durable pour l’avenir.","o":["Éducation au développement durable (Bildung für nachhaltige Entwicklung)","Alliance pour la nature et l’énergie","Éducation réservée aux adultes","Initiative citoyenne Nouvelle Énergie"]},{"q":"L’éducation au développement durable (BNE) est une campagne éducative mondiale des Nations unies.","x":"Le club suit les principes de l’éducation au développement durable."},{"q":"Que doivent vivre les membres du club dans leurs projets ?","x":"L’efficacité personnelle, c’est sentir que ses propres actions changent quelque chose.","o":["L’efficacité personnelle et l’esprit d’équipe","Seulement de meilleures notes","Du temps libre sans tâches","Des compétitions les uns contre les autres"]},{"q":"L’éducation au développement durable doit permettre à chacun de comprendre les effets de ses propres ___ sur le monde.","x":"Qui comprend les conséquences de ses actes peut prendre des décisions responsables et durables.","o":["actions","siestes","chansons","calculs"]},{"q":"Comment s’appelait l’atelier du club pendant la semaine de la santé et du développement durable ?","x":"L’atelier était ouvert à tous les élèves et à leurs enseignant·e·s.","o":["« Change Fashion »","« Fast Food Fun »","« Green Gaming »","« Plastic Party »"]},{"q":"La fast fashion est une mode tendance qui sort en collections très rapprochées.","x":"C’est justement ce problème que l’atelier « Change Fashion » a examiné."},{"q":"Où les produits équitables de la boutique solidaire du MMG sont-ils bien exposés ?","x":"Comme ça, on peut réfléchir à l’avance à ce qu’on veut acheter lors de la prochaine vente équitable à la récré.","o":["Dans une vitrine en verre à la cantine","Dans la salle des profs","Dans le gymnase","À la cave"]},{"q":"À quelle fréquence la boutique solidaire du MMG ouvre-t-elle ?","x":"Il y a alors la vente équitable à la récré avec des produits du commerce équitable.","o":["Une fois par mois","Tous les jours","Une fois par an","Seulement pendant les vacances"]},{"q":"Pendant l’Avent, saint Nicolas, le Père Fouettard et des anges ont distribué des ___ équitables à tous les élèves du MMG.","x":"C’était la première fois cette année scolaire.","o":["Saint-Nicolas en chocolat","pommes","cœurs en pain d’épices","bananes"]},{"q":"Saint Nicolas, le Père Fouettard et les anges étaient membres de la SMV.","x":"La SMV (Schülermitverantwortung), ce sont les délégués des élèves."},{"q":"Combien d’argent l’association caritative « Missio » a-t-elle reçu par portable donné ?","x":"L’argent soutient des projets pour les enfants.","o":["50 centimes","5 centimes","5 euros","50 euros"]},{"q":"Combien de portables le MMG a-t-il envoyés au centre de collecte ?","x":"Le lycée a reçu un certificat pour cela.","o":["49","9","149","490"]},{"q":"Grâce aux dons de portables, des projets pour les enfants sont soutenus, entre autres au Ghana et aux Philippines.","x":"Les projets améliorent l’éducation, la santé et les conditions de vie des enfants."},{"q":"Quelle caractéristique des cahiers MMG apporte quel avantage ?","x":"Le club a conçu lui-même ces cahiers – pour les petites classes à partir de l’année scolaire prochaine.","p":[["100 % papier recyclé","Préserve les forêts"],["Fabriqués à Dorfen","Trajets de transport courts"],["Couverture solide","Pas besoin de protège-cahier en plastique"],["Bande de classement intégrée","Pas besoin de chemise en plus"]]},{"q":"Les cahiers MMG sont fabriqués près de chez nous par la maison d’édition musicale Streubel à ___.","x":"Local veut dire : trajets courts.","o":["Dorfen","Berlin","Hambourg","Vienne"]},{"q":"Comment reconnaît-on la matière d’un cahier MMG sans protège-cahier en plastique ?","x":"Comme ça, on se passe complètement du protège-cahier en plastique.","o":["On colorie le bord dans la couleur de la matière","Avec un autocollant en plastique","On ne peut pas","Avec du ruban adhésif"]}]},"infos":[[{"t":"Gaz à effet de serre & transition énergétique","l":"Ce qui réchauffe la Terre – et comment produire de l’électricité propre. En plus : économiser l’énergie à la maison.","p":["Le CO₂ est produit surtout en brûlant du charbon, du pétrole et du gaz. Il représente environ les trois quarts des émissions mondiales de gaz à effet de serre.","Le méthane est produit entre autres dans l’estomac des bovins, dans les rizières et dans les décharges. Sur 20 ans, il a un effet environ 80 fois plus fort que le CO₂.","Avec l’accord de Paris sur le climat (2015), presque tous les États se sont engagés à limiter le réchauffement nettement en dessous de 2 °C – si possible à 1,5 °C.","Énergies renouvelables : soleil (photovoltaïque), vent (éolienne), eau qui coule (centrale hydroélectrique) et chaleur de la Terre (géothermie). En 2024, elles ont fourni plus de la moitié de l’électricité en Allemagne.","Pour se déplacer, retiens : vélo, puis train, puis voiture, puis avion – dans cet ordre, les émissions de CO₂ par personne et par kilomètre augmentent.","Même en veille, les appareils consomment de l’électricité. Une multiprise à interrupteur aide.","Baisser la température de la pièce de seulement 1 °C économise environ 6 % d’énergie de chauffage.","Aérer en grand (ouvrir en grand 5 à 10 minutes plusieurs fois par jour) vaut mieux qu’une fenêtre entrouverte en permanence.","Une pompe à chaleur chauffe avec la chaleur de l’air, du sol ou des nappes souterraines – avec de l’électricité verte, de façon presque neutre pour le climat.","En Allemagne, une personne émet en moyenne environ 10 tonnes de gaz à effet de serre par an. Pour être compatible avec le climat à long terme, il faudrait moins d’1 tonne.","Neutre pour le climat veut dire : au bout du compte, aucun gaz à effet de serre supplémentaire n’est émis – d’abord éviter, puis compenser le reste."]},{"t":"Comprendre le changement climatique","l":"Météo, climat et conséquences du réchauffement.","p":["Depuis le début de l’industrialisation, la Terre s’est réchauffée d’environ 1,4 °C. L’année 2024 a déjà dépassé 1,5 °C.","La météo, c’est ce qui se passe dehors aujourd’hui. Le climat, c’est la moyenne de la météo sur au moins 30 ans.","L’effet de serre naturel maintient la Terre à environ 15 °C au lieu de –18 °C. Le problème, c’est la part supplémentaire causée par l’être humain.","Conséquences : la montée du niveau de la mer inonde les côtes, les canicules font des morts, les sécheresses détruisent les récoltes, la fonte des glaciers prive les régions de montagne d’eau.","La Chine émet au total le plus de CO₂ – mais par habitant, les États-Unis par exemple sont nettement devant la Chine.","L’électricité éolienne produit beaucoup moins de CO₂ que le gaz naturel ; le lignite est le plus nuisible au climat."]}],[{"t":"Qu’est-ce que le commerce équitable ?","l":"Prix justes, labels et droits humains. En plus : de la fève au rayon.","p":["Le label Fairtrade garantit un prix minimum et une prime. Les coopératives décident ensemble de l’utilisation de la prime – par exemple pour des écoles ou des puits.","La Côte d’Ivoire est le premier producteur de cacao au monde. Avec le Ghana, elle fournit environ la moitié du cacao.","Selon l’OIT et l’UNICEF, environ 138 millions d’enfants sont concernés par le travail des enfants (estimation 2025).","Les labels contrôlent des choses différentes : Fairtrade (conditions commerciales justes), Blauer Engel (produits écologiques), FSC (gestion des forêts), MSC (pêche).","La Lieferkettengesetz (loi allemande sur le devoir de vigilance) s’applique depuis 2023 et oblige les grandes entreprises à veiller au respect des droits humains dans leurs chaînes d’approvisionnement.","Le chemin du chocolat : récolter les cabosses de cacao → faire fermenter et sécher les fèves → transport par bateau → transformation à l’usine → vente au supermarché.","Une grande partie de la valeur est créée seulement en Europe. Pour le café aussi, les familles de petits paysans ne reçoivent souvent qu’une petite fraction du prix en magasin.","Les produits Fairtrade les plus connus sont le café, les bananes et le cacao. On les trouve aujourd’hui dans presque tous les supermarchés.","Les boutiques solidaires (Weltläden) sont des magasins spécialisés dans les produits équitables – beaucoup sont tenus par des bénévoles.","Objectif du commerce équitable : un revenu qui permet de vivre dignement – assez pour se nourrir, se loger, s’instruire et se soigner."]},{"t":"Travail & droits dans le monde","l":"Coopératives, droit du travail et pays d’origine.","p":["Dans une coopérative, des producteurs et productrices se regroupent et travaillent ensemble – ils ont ainsi plus de poids dans les négociations.","Les standards Fairtrade interdisent l’exploitation des enfants par le travail.","Principaux pays d’origine : café du Brésil, bananes d’Équateur, cacao de Côte d’Ivoire, coton d’Inde.","L’Organisation internationale du travail (OIT) est l’organisation de l’ONU pour les droits des travailleurs.","Des labels équitables sont par exemple Fairtrade, GEPA fair+ et Naturland Fair. Le Blauer Engel, lui, est un écolabel.","Il existe aussi des fleurs équitables, par exemple des roses du Kenya."]}],[{"t":"Bien trier","l":"Quoi va où – et combien de temps les déchets restent-ils dans la nature ? En plus : moins de déchets au quotidien.","p":["Poubelle jaune : emballages en plastique, en métal et en matériaux composites, par exemple les pots de yaourt. Le papier va dans la poubelle à papier, les épluchures dans la poubelle bio.","Les tickets de caisse en papier thermique vont dans les ordures ménagères. Les verres à boire et la céramique aussi – pas dans le conteneur à verre.","Durée de décomposition dans la nature : peau de banane de quelques semaines à quelques mois, filtre de cigarette plusieurs années, canette en alu jusqu’à 200 ans, bouteille en plastique environ 450 ans.","La hiérarchie des déchets : éviter → réutiliser → recycler → incinérer (produire de l’énergie) → mettre en décharge.","Consigne : 25 centimes sur les bouteilles jetables, généralement 8 ou 15 centimes sur les bouteilles réutilisables.","Les microplastiques sont des particules de plastique de moins de 5 millimètres.","Les bouteilles en verre consignées peuvent être remplies jusqu’à 50 fois.","Les piles usagées vont dans la boîte de collecte en magasin ou à la déchetterie.","Upcycling veut dire : transformer du vieux en quelque chose de nouveau et de plus précieux. Zéro déchet veut dire : le moins de déchets possible.","Les gobelets de café à emporter sont généralement recouverts de plastique et difficiles à recycler. Sépare l’opercule en alu du pot de yaourt pour que le centre de tri reconnaisse les matériaux."]},{"t":"Économie circulaire","l":"Les déchets deviennent de nouvelles matières premières.","p":["Économie circulaire veut dire : garder les produits et les matières premières le plus longtemps possible dans le circuit.","L’Allemagne produit nettement plus de déchets d’emballage par habitant que la moyenne de l’UE.","Depuis 2021, les produits en plastique à usage unique comme les pailles et les couverts en plastique sont interdits dans l’UE.","Le vieux papier devient du papier recyclé, les bouteilles en PET de la polaire ou de nouvelles bouteilles, le vieux verre du nouveau verre, les biodéchets du compost et du biogaz.","Le verre bleu ou rouge va avec le verre vert.","Réutiliser vaut mieux que recycler."]}],[{"t":"Qui fait la politique environnementale ?","l":"Ministères, administrations, parlements et lois importantes.","p":["Depuis 2025, la protection du climat relève du ministère fédéral de l’Environnement, de la Protection du climat, de la Protection de la nature et de la Sûreté nucléaire (BMUKN). L’énergie et le marché de l’électricité relèvent du ministère fédéral de l’Économie et de l’Énergie (BMWE).","Autres compétences : ministère des Transports – routes et rails ; ministère de l’Agriculture (BMLEH) – agriculture, alimentation et forêt.","L’Umweltbundesamt (Agence fédérale de l’environnement), dont le siège est à Dessau-Roßlau, est l’autorité scientifique de l’État fédéral pour l’environnement. Elle recense par exemple chaque année les émissions de gaz à effet de serre.","Depuis 1994, la protection des fondements naturels de la vie est un objectif de l’État inscrit à l’article 20a de la Loi fondamentale (Grundgesetz, la Constitution allemande).","Par le Bundesrat, les 16 Länder (États fédérés) participent à l’élaboration des lois fédérales. Beaucoup de lois environnementales sont appliquées par les Länder, par exemple pour la protection de la nature.","Comment naît une loi fédérale : projet de loi (souvent du gouvernement fédéral) → vote au Bundestag → examen au Bundesrat → signature par le président fédéral et promulgation.","La loi fédérale sur la protection du climat (2019, modifiée en 2021 et 2024) : au moins 65 % de gaz à effet de serre en moins d’ici 2030 et 88 % d’ici 2040 (par rapport à 1990), neutralité en gaz à effet de serre d’ici 2045.","Sortie du nucléaire : le 15 avril 2023, les trois dernières centrales nucléaires ont été débranchées du réseau. Sortie du charbon : au plus tard en 2038 (loi sur la sortie du charbon de 2020).","L’EEG (loi sur les énergies renouvelables, depuis 2000) règle le développement et le soutien de l’électricité produite par le soleil, le vent et d’autres sources renouvelables.","Étapes clés : protection de l’environnement comme objectif de l’État (1994), EEG (2000), échange de quotas d’émission de l’UE (2005), loi sur la protection du climat (2019)."]},{"t":"Le prix du CO₂","l":"Échange de quotas, prix du CO₂ et fonds pour le climat.","p":["Depuis 2021, la BEHG (loi sur l’échange de quotas d’émission pour les combustibles) impose un prix du CO₂ sur le fioul, le gaz naturel, l’essence et le diesel. Au départ, une tonne coûtait 25 euros.","En 2026 et 2027, le prix se situe dans une fourchette de 55 à 65 euros par tonne. À partir de 2028, il sera fixé librement par le marché.","Dans le système d’échange de quotas d’émission de l’UE (SEQE-UE, EU-ETS), les centrales électriques et les grandes installations industrielles ont besoin depuis 2005 d’un certificat pour chaque tonne de CO₂. Le nombre de certificats diminue chaque année.","Le nouveau système d’échange de quotas de l’UE pour les bâtiments et les transports (ETS2) devait démarrer en 2027, mais a été repoussé à 2028.","Les recettes vont dans le KTF (Fonds pour le climat et la transformation), une caisse spéciale de l’État fédéral pour la protection du climat et la transition énergétique."]}],[{"t":"Nouveau gouvernement, nouvelle politique","l":"Ce qui a changé depuis mai 2025.","p":["Depuis mai 2025, l’Allemagne est gouvernée par une coalition CDU/CSU et SPD. Friedrich Merz a été élu chancelier fédéral le 6 mai 2025.","La protection du climat est passée du ministère de l’Économie à celui de l’Environnement (BMUKN, ministre Carsten Schneider, SPD). L’Économie et l’Énergie (BMWE) sont dirigées par Katherina Reiche (CDU), les Transports par Patrick Schnieder (CDU).","En mars 2025, le Bundestag de l’époque a modifié la Loi fondamentale : un fonds spécial de 500 milliards d’euros pour les infrastructures et la neutralité climatique, dont 100 milliards d’euros pour le Fonds pour le climat et la transformation (KTF).","Depuis, l’article 143h de la Loi fondamentale contient l’objectif « neutralité climatique d’ici 2045 ».","Prix de l’électricité : en 2026, l’État fédéral subventionne les frais de réseau à hauteur de 6,5 milliards d’euros provenant du KTF ; pour 2027 à 2029, environ 5,5 milliards d’euros par an sont prévus.","La taxe sur l’électricité pour l’industrie ainsi que l’agriculture et la sylviculture a été réduite durablement au taux minimum de l’UE (0,05 au lieu de 2,05 centimes par kWh). Les ménages ne sont pas concernés.","La taxe sur le stockage du gaz a été supprimée en 2026. Avec la baisse des frais de réseau, un ménage économise selon le gouvernement jusqu’à 150 euros par an.","Stratégie pour les centrales : de nouvelles centrales à gaz doivent prendre le relais quand il n’y a ni vent ni soleil, et être « H₂-ready » (convertibles à l’hydrogène). La Commission européenne a approuvé les grandes lignes en principe en janvier 2026.","Aide à l’achat de voitures électriques depuis 2026 : jusqu’à 6 000 euros pour les ménages dont le revenu annuel imposable ne dépasse pas 80 000 euros (un peu plus avec des enfants)."]},{"t":"Chauffage, ticket, objectif de l’UE","l":"Nouvelles règles pour les bâtiments et les transports.","p":["La Gebäudemodernisierungsgesetz (loi sur la modernisation des bâtiments) a remplacé la Gebäudeenergiegesetz (loi sur l’énergie des bâtiments, dite « loi sur le chauffage ») : décision du gouvernement le 13 mai 2026, approbation du Bundestag et du Bundesrat mi-juillet, en vigueur depuis le 29 juillet 2026.","L’obligation de faire fonctionner les nouveaux chauffages à 65 % avec des énergies renouvelables est supprimée. À la place, les combustibles doivent devenir progressivement plus respectueux du climat à partir de 2029 et neutres pour le climat d’ici 2045.","Depuis juillet 2026, les aides pour un chauffage respectueux du climat dépendent davantage du revenu.","Objectif climatique de l’UE pour 2040 : 90 % de gaz à effet de serre en moins qu’en 1990. À partir de 2036, jusqu’à 5 points de pourcentage pourront être obtenus grâce à des certificats internationaux. Les associations environnementales le critiquent, les partisans y voient plus de marge de manœuvre.","Deutschlandticket (abonnement national de transports) : 49 euros (2023), 58 euros (2025), 63 euros (2026). À partir de 2027, le prix doit suivre un indice des coûts."]}],[{"t":"L’eau – précieuse et rare","l":"Eau douce, eau virtuelle et océan. En plus : les océans sous pression.","p":["Seulement environ 2,5 % de l’eau sur Terre est de l’eau douce – et la plus grande partie est prisonnière de la glace.","Eau virtuelle (fabrication) : 1 tomate env. 13 l, 1 tasse de café env. 130 l, 1 t-shirt en coton env. 2 700 l, 1 kg de bœuf env. 15 000 l.","En Allemagne, une personne consomme environ 122 litres d’eau potable par jour. Une douche consomme généralement moins qu’un bain.","L’océan absorbe environ un quart du CO₂ produit par l’être humain et devient ainsi plus acide.","Une eau trop chaude provoque le blanchissement des coraux. Autres menaces : la surpêche et les déchets plastiques.","Le « Great Pacific Garbage Patch » (grande zone d’ordures du Pacifique) est un immense tourbillon de déchets dans le Pacifique.","Plus de 2 milliards de personnes n’ont pas d’accès sûr à l’eau potable.","Les lingettes humides ne vont pas dans les toilettes : elles se décomposent à peine et bouchent les pompes et les stations d’épuration.","Les océans fournissent environ la moitié de l’oxygène que nous respirons – surtout grâce au plancton.","Le label MSC signale le poisson issu d’une pêche plus durable."]},{"t":"L’eau au quotidien","l":"Où va notre eau – à la maison et dans le monde.","p":["À la maison, la plus grande partie de l’eau potable sert au bain, à la douche et à l’hygiène, puis à la chasse d’eau.","Dans le monde, l’agriculture est le plus grand consommateur d’eau – environ 70 % de l’eau douce prélevée.","L’eau contenue dans les produits s’appelle l’eau virtuelle.","La mer d’Aral, en Asie centrale, est en grande partie asséchée, car ses affluents ont été utilisés pour des champs de coton.","Les animaux marins sont menacés : les tortues par le plastique, la morue par la surpêche, les baleines par le bruit des bateaux, les coraux par le réchauffement.","En Allemagne, c’est surtout en économisant l’eau chaude qu’on gagne le plus – à cause de l’énergie nécessaire pour la chauffer."]}],[{"t":"Manger bon pour le climat","l":"Ce qu’il y a dans l’assiette compte pour le climat. En plus : bio, surface et légumineuses.","p":["Gaz à effet de serre par kilogramme : pommes de terre < tofu < poulet < bœuf.","Saisons en Allemagne : asperges avril–juin, fraises mai–juillet, courge septembre–novembre, chou kale novembre–février.","La date de durabilité minimale (« à consommer de préférence avant ») n’est pas une date pour jeter : regarder, sentir, goûter. Attention en revanche à la date limite « à consommer jusqu’au ».","En Allemagne, environ 11 millions de tonnes de nourriture sont jetées chaque année, plus de la moitié dans les foyers.","Local veut dire produit à proximité. Les fraises en hiver viennent souvent de loin ou de serres chauffées.","Le bœuf a besoin de beaucoup plus de surface que les céréales ou les légumineuses pour la même valeur nutritive.","Avec le foodsharing (partage de nourriture), les aliments en trop sont donnés au lieu d’être jetés.","Le label bio de l’UE signifie entre autres qu’on renonce aux pesticides chimiques de synthèse. Mais bio ne veut pas automatiquement dire équitable.","Les légumes « moches » sont aussi nourrissants que les légumes parfaits.","Les légumineuses comme les lentilles, les haricots et les pois chiches sont riches en protéines. Le « Planetary Health Diet » (régime de santé planétaire) recommande beaucoup de végétal et peu de viande."]},{"t":"Du champ à l’assiette","l":"Saisons, sol et ce qui finit dans les mangeoires.","p":["De saison veut dire : manger des fruits et des légumes au moment où ils mûrissent naturellement chez nous.","Les légumes surgelés ne sont pas toujours moins bons – des légumes frais importés par avion peuvent être plus nuisibles au climat.","Avec la rotation des cultures, les plantes changent chaque année sur un champ. Cela préserve le sol.","Le tofu est fait à partir de graines de soja, le houmous de pois chiches, les frites de pommes de terre, le chocolat de fèves de cacao.","La plus grande partie de la récolte mondiale de soja sert à nourrir les animaux.","Transport : le train de marchandises émet le moins de CO₂, puis le camion – le fret aérien le plus."]}],[{"t":"La diversité du vivant","l":"Pourquoi les espèces, les tourbières et les abeilles sont si importantes. En plus : insectes & habitats.","p":["Selon la Plateforme intergouvernementale sur la biodiversité (IPBES, 2019), environ 1 million d’espèces sont menacées d’extinction.","Les tourbières ne couvrent qu’environ 3 % des terres, mais stockent plus de carbone que toutes les forêts de la Terre réunies.","Chaque espèce a besoin de son habitat : le castor près de la rivière, le phoque dans la mer des Wadden, le pic dans la forêt, l’alouette des champs dans les champs et les prairies.","Environ les trois quarts des principales plantes cultivées profitent de la pollinisation par les insectes.","Quand une seule espèce de plante pousse sur une surface pendant des années, on parle de monoculture.","Des coins sauvages, des fleurs locales et des tas de feuilles aident plus les insectes qu’une pelouse tondue ras.","L’étude de Krefeld l’a montré : la masse d’insectes volants dans les zones protégées a baissé de plus de 75 % entre 1989 et 2016.","Les forêts tropicales humides sont particulièrement riches en espèces.","Une chaîne alimentaire dans la mer : algues du plancton → petits crustacés → hareng → phoque.","Le bois mort est un habitat précieux. Les espèces invasives sont des espèces introduites qui évincent les espèces locales. Les bandes fleuries au bord des champs offrent de la nourriture aux insectes."]},{"t":"Protéger la nature","l":"Zones protégées, liste rouge et espèces de retour.","p":["Dans les parcs nationaux, la nature peut se développer le plus librement possible. L’Allemagne en compte 16.","La liste rouge montre quelles espèces sont menacées.","Les loups sont revenus en Allemagne depuis environ 2000. Le pygargue à queue blanche niche aussi à nouveau dans de nombreuses régions.","Notions : biotope = habitat, écosystème = êtres vivants et environnement formant un tout, diversité des espèces = nombre d’espèces, pollinisation = transport du pollen.","La pollution lumineuse la nuit nuit aux insectes."]}],[{"t":"La vraie histoire de tes vêtements","l":"La fast fashion et de meilleures alternatives. En plus : smartphone, t-shirt & co.","p":["La fast fashion, ce sont des vêtements bon marché produits vite et jetés vite.","En 2013, l’usine textile Rana Plaza s’est effondrée au Bangladesh – plus de 1 100 personnes sont mortes.","Une grande partie des vêtements dans les armoires allemandes est rarement ou jamais portée.","Alternatives : l’occasion (acheter de seconde main), l’upcycling (valoriser au lieu de jeter), le Repair Café (réparer ensemble), le troc de vêtements.","Greenwashing : des entreprises se présentent comme plus écologiques qu’elles ne le sont.","Le cobalt des batteries de portables vient souvent de la République démocratique du Congo – parfois de petites mines dangereuses.","La plus grande partie des émissions d’un smartphone vient de sa fabrication. Le garder longtemps, ça vaut le coup !","Le chemin d’un t-shirt : cultiver le coton → filer le fil → tisser et teindre le tissu → coudre → vendre en magasin.","En Allemagne, une personne achète environ 60 vêtements neufs par an. En 2024, l’UE a adopté un « droit à la réparation ».","Le polyester perd des fibres de microplastique au lavage. Le partage (sharing) veut dire : emprunter, échanger, utiliser ensemble."]},{"t":"Consommer malin","l":"Labels, réparation et retours de colis.","p":["L’obsolescence programmée, c’est le reproche selon lequel des produits tomberaient en panne tôt exprès.","Le « Grüner Knopf » (Bouton vert) est le label officiel allemand pour les textiles durables. GOTS désigne les textiles bio.","Le coton bio est cultivé sans pesticides chimiques de synthèse.","L’étiquette énergie de l’UE indique la consommation d’énergie des appareils, le Blauer Engel les produits écologiques.","Réparer est presque toujours plus durable qu’acheter neuf. Les retours de commandes en ligne causent des transports supplémentaires."]}],[{"t":"Les 17 objectifs du monde","l":"L’Agenda 2030 et la justice climatique. En plus : équitable pour tous.","p":["En 2015, les Nations unies ont adopté 17 objectifs de développement durable (ODD) – à atteindre d’ici 2030.","Exemples : ODD 1 Pas de pauvreté, ODD 5 Égalité entre les sexes, ODD 6 Eau propre, ODD 12 Consommation durable, ODD 13 Lutte contre le changement climatique.","Si tout le monde vivait comme nous en Allemagne, il nous faudrait environ 3 Terres.","Le jour du dépassement marque le moment où l’humanité a consommé plus que ce que la Terre peut renouveler en un an.","Justice climatique : ceux qui contribuent le moins à la crise climatique sont souvent les plus touchés.","En 2025, l’écart de salaire brut entre femmes et hommes (Gender Pay Gap non corrigé) était de 16 % en Allemagne.","Les 10 % les plus riches de l’humanité causent environ la moitié des émissions liées à la consommation.","Étapes clés de la politique climatique : Sommet de la Terre à Rio (1992), protocole de Kyoto (1997), accord de Paris (2015).","Plus de 800 millions de personnes vivent dans l’extrême pauvreté.","Le développement durable a trois dimensions : l’écologie, l’économie et le social. Quand on s’engage sans être payé, on fait du bénévolat."]},{"t":"Droits humains & engagement","l":"Des droits pour tous – et comment tu peux participer.","p":["La Déclaration universelle des droits de l’homme a été adoptée en 1948. L’éducation aussi est un droit humain.","Autres ODD : ODD 2 Faim zéro, ODD 4 Éducation de qualité, ODD 7 Énergie propre, ODD 14 Vie aquatique.","Justice entre les générations : vivre aujourd’hui de façon à ce que les générations futures aient elles aussi de bonnes chances.","« Fridays for Future » a commencé en 2018 avec des grèves scolaires pour le climat.","Même avant 18 ans, on peut s’engager, par exemple dans des parlements de jeunes."]}],[{"t":"Se déplacer – mais comment ?","l":"Transports, climat et choix du moyen de transport.","p":["Les transports causent environ un cinquième des gaz à effet de serre en Allemagne (2023 : environ 22 %). La très grande majorité vient de la circulation routière.","Depuis 1990, les émissions des transports n’ont que peu baissé (d’environ 11 % jusqu’en 2023) : les moteurs sont devenus plus économes, mais il y a plus de voitures, des voitures plus grosses et plus de trafic.","Avec le Deutschlandticket (depuis mai 2023), on voyage dans toute l’Allemagne en bus, en tram et en train régional pour un prix mensuel fixe – l’ICE et l’IC (trains grandes lignes) ne sont pas inclus. En 2026, il coûte 63 euros par mois.","En Allemagne, près de 50 millions de voitures sont immatriculées. Une voiture reste garée environ 23 heures par jour, et en moyenne seulement 1,4 personne environ est à bord.","Notions : autopartage (carsharing) = louer une voiture à l’heure quand on en a besoin, VAE (Pedelec) = vélo à assistance électrique, parking relais (Park-and-Ride) = aller en voiture jusqu’à la gare puis continuer en train, covoiturage = plusieurs personnes font le trajet ensemble.","On peut conduire une trottinette électrique à partir de 14 ans – sans permis, seul et pas sur le trottoir.","Sur toute sa durée de vie, une voiture électrique est généralement meilleure pour le climat qu’une voiture à essence, même si la fabrication de la batterie produit beaucoup de CO₂. Avec de l’électricité verte, l’avance est encore plus grande.","Motorisations : voiture électrique – batterie, voiture à pile à combustible – hydrogène, tram – électricité de la caténaire, bus diesel – carburant issu du pétrole.","Quand les parents déposent leurs enfants en voiture juste devant l’école, on parle de « parents taxi » (Elterntaxi). Cela crée des bouchons et du danger devant les écoles.","Étapes clés : premier chemin de fer allemand Nuremberg–Fürth (1835), brevet de Benz pour la voiture à moteur à essence (1886), premier ICE en service commercial (1991), Deutschlandticket (2023)."]},{"t":"La transition des transports","l":"Comment les villes et les voyages deviennent plus respectueux du climat.","p":["Dans une rue cyclable (Fahrradstraße), les cyclistes peuvent rouler côte à côte. Les voitures n’y entrent que si un panneau complémentaire l’autorise, et la vitesse est limitée à 30 km/h pour tout le monde.","En avion, les traînées de condensation et les oxydes d’azote agissent aussi sur le climat. Selon le DLR (Centre aérospatial allemand), seulement environ un tiers de l’effet du transport aérien sur le climat est dû au CO₂.","Une place de stationnement pour voiture occupe environ 12 m² – autant qu’une chambre d’enfant. Sur la même surface, on peut garer huit à dix vélos.","Dans la « ville du quart d’heure », on atteint tout ce qui est important en un quart d’heure à pied ou à vélo. Paris a fait connaître ce concept.","Le principe de la transition des transports : 1. éviter les déplacements, 2. les reporter (sur le train, le bus, le vélo), 3. les améliorer (motorisations propres).","Le moteur d’un VAE assiste jusqu’à 25 km/h – juridiquement, c’est un vélo. Les speed bikes (S-Pedelecs, jusqu’à 45 km/h) sont considérés comme des cyclomoteurs."]}],[{"t":"L’empreinte numérique","l":"Streaming, appareils et déchets électroniques.","p":["Le numérique (appareils, réseaux, centres de données) cause environ 2 à 4 % des gaz à effet de serre dans le monde – à peu près autant que le transport aérien.","Les vidéos (streaming) représentent la plus grande partie du trafic de données sur Internet. En streaming, c’est souvent l’appareil lui-même qui consomme le plus d’électricité : smartphone < ordinateur portable < grand téléviseur.","La transmission compte : une heure de streaming HD par la fibre optique produit environ 2 g de CO₂, par l’ancien réseau 3G c’était environ 90 g (étude pour l’Umweltbundesamt). À la maison, mieux vaut utiliser le Wi-Fi.","La poubelle barrée signifie : l’appareil ne va pas dans les ordures ménagères, mais à la déchetterie ou dans un point de collecte.","Notions : centre de données = bâtiment rempli de serveurs, cloud = stocker des données sur les serveurs de quelqu’un d’autre, déchets électroniques = appareils électriques hors d’usage, reconditionné = appareil d’occasion remis à neuf.","En 2022, le monde a produit environ 62 millions de tonnes de déchets électroniques ; à peine un quart a été recyclé de façon prouvée.","Les grands magasins d’électronique et beaucoup de supermarchés doivent reprendre gratuitement les petits appareils usagés (jusqu’à 25 cm) – même sans achat.","Selon Bitkom (fédération allemande du numérique), environ 170 millions de vieux portables inutilisés dorment dans les foyers allemands (2026) – pleins d’or, d’argent et d’autres matières premières.","Depuis fin 2024, les nouveaux portables vendus dans l’UE ont un port de charge USB-C commun.","Depuis juin 2025, dans l’UE : les pièces détachées pour smartphones doivent rester disponibles 7 ans après la fin de la vente, et les mises à jour sont fournies pendant au moins 5 ans."]},{"t":"Centres de données & IA","l":"Où vit Internet – et de quoi il a besoin.","p":["Selon l’AIE, les centres de données ont consommé environ 1,5 % de l’électricité mondiale en 2024. D’ici 2030, leur consommation pourrait plus que doubler.","Le principal moteur est l’intelligence artificielle (IA) : l’entraînement et l’utilisation de grands modèles demandent des puces particulièrement puissantes.","Les serveurs chauffent. Beaucoup de centres de données sont refroidis avec de l’eau – un problème dans les régions sèches. Leur chaleur perdue peut chauffer des logements.","Notions : serveur = ordinateur qui fournit des données et des services à d’autres, entraînement d’IA = un modèle apprend à partir d’énormes quantités de données, électricité verte = électricité produite par le soleil, le vent et l’eau. L’Energieeffizienzgesetz (loi sur l’efficacité énergétique) exige 100 % d’électricité verte pour les centres de données à partir de 2027.","Effet rebond : la technique devient plus économe, mais on l’utilise donc davantage – au final, on n’économise presque pas d’énergie.","Quantités de données : kilooctet < mégaoctet < gigaoctet < téraoctet – chaque niveau est environ 1 000 fois plus grand."]}],[{"t":"Tes droits","l":"La Convention de l’ONU relative aux droits de l’enfant et ce qu’elle signifie pour toi.","p":["La Convention de l’ONU relative aux droits de l’enfant a été adoptée le 20 novembre 1989. Le 20 novembre est la Journée internationale des droits de l’enfant.","Elle compte 54 articles et s’applique à toutes les personnes de moins de 18 ans (article 1).","196 États l’ont ratifiée – seuls les États-Unis ne l’ont pas fait.","Droits importants : l’éducation (art. 28), les loisirs et le jeu (art. 31), la protection contre la violence (art. 19), la participation (art. 12) : les enfants ont le droit de donner leur avis sur tout ce qui les concerne, et cet avis doit être pris en compte.","Primauté de l’intérêt de l’enfant (art. 3) : dans toutes les décisions qui concernent les enfants, leur bien-être passe en premier.","En Allemagne, depuis 2000, les enfants ont légalement droit à une éducation sans violence.","Au « Nummer gegen Kummer » (numéro contre le chagrin, 116 111), on trouve de l’aide gratuite et anonyme.","L’UNICEF est le Fonds des Nations unies pour l’enfance, fondé en 1946.","Frise chronologique : Déclaration de Genève sur les droits de l’enfant (1924), UNICEF (1946), Convention de l’ONU relative aux droits de l’enfant (1989), entrée en vigueur en Allemagne (1992).","Les droits de l’enfant ne sont pas encore inscrits explicitement dans la Loi fondamentale (état en 2026) – il manque pour cela une majorité des deux tiers."]},{"t":"Les droits de l’enfant aujourd’hui","l":"Climat, Internet et participation.","p":["En 2023, le Comité des droits de l’enfant de l’ONU a confirmé : les enfants ont droit à un environnement propre, sain et durable (Observation générale n° 26).","Chacun a un droit à l’image : on ne publie les photos des autres qu’avec leur permission. La Convention protège aussi la vie privée (art. 16).","On parle de « sharenting » quand des parents partagent beaucoup de photos et de vidéos de leurs enfants en ligne.","En 2021, après une plainte de jeunes, la Cour constitutionnelle fédérale a décidé : la loi sur la protection du climat doit être améliorée pour protéger la liberté des générations futures.","Un traité de l’ONU prend effet ainsi : l’Assemblée générale de l’ONU l’adopte → un État le signe → l’État le ratifie → l’État rend régulièrement des rapports au comité de l’ONU à Genève.","Limites d’âge en Allemagne : à 7 ans, capacité juridique limitée ; à 14 ans, responsabilité pénale ; à 16 ans, droit de vote aux élections européennes ; à 18 ans, majorité."]}],[{"t":"Les forêts de Bavière","l":"Beaucoup de forêt – et beaucoup de travail pour l’avenir.","p":["Un bon tiers de la Bavière (environ 37 %, soit environ 2,6 millions d’hectares) est boisé. La Bavière a la plus grande surface forestière de tous les Länder.","L’essence la plus répandue est l’épicéa (presque 40 % de la surface forestière), suivi du pin et du hêtre.","Les étages de la forêt, de bas en haut : strate des mousses, strate herbacée, strate arbustive, strate arborée.","Le mot « durabilité » (Nachhaltigkeit) vient de la sylviculture : en 1713, Hans Carl von Carlowitz demandait de ne couper que la quantité de bois qui repousse.","Fruits et cônes : hêtre commun – faînes, chêne – glands, épicéa – cônes pendants, sapin blanc – cônes dressés.","L’épicéa a des racines peu profondes. La chaleur et la sécheresse l’affaiblissent, puis le bostryche (scolyte) l’attaque. Les arbres à racines profondes comme le sapin et le chêne supportent mieux la sécheresse.","La transformation de la forêt, c’est faire de forêts de conifères purs des forêts mixtes résistantes au climat. La Bavière veut transformer environ 200 000 hectares d’ici 2030.","Un peu plus de la moitié de la forêt bavaroise appartient à des particuliers, environ 30 % à l’État libre de Bavière (Bayerische Staatsforsten).","Selon l’inventaire forestier national, la forêt en Allemagne a perdu plus de carbone qu’elle n’en a stocké entre 2017 et 2022.","Dans les Alpes, la forêt de protection protège les villages et les routes des avalanches, des chutes de pierres et des coulées de boue."]},{"t":"Les tourbières – des protectrices du climat humides","l":"Comment les tourbières grandissent et pourquoi elles doivent rester humides.","p":["Une tourbière haute intacte ne grandit que d’environ 1 millimètre par an – un mètre de tourbe met environ 1 000 ans à se former.","Les tourbières hautes ne sont alimentées que par l’eau de pluie, les tourbières basses par les eaux souterraines. La sphaigne se gorge d’eau comme une éponge, le rossolis (drosera) est une plante carnivore des tourbières.","Au fil des millénaires, un lac peu profond peut devenir une tourbière : lac → comblement par les roseaux et les laîches → tourbière basse → tourbière haute.","En Bavière, il y a environ 228 000 hectares de sols tourbeux – environ 95 % sont drainés et libèrent du CO₂. Dans le Donaumoos, le sol s’est déjà affaissé de plus de 3 mètres.","La réhumidification, c’est remettre en eau une tourbière drainée. La tourbe ne se décompose alors plus.","Le terreau sans tourbe protège les tourbières, car on extrait de la tourbe pour fabriquer le terreau classique."]}],[{"t":"Gaz à effet de serre & électricité","l":"Où en est l’Allemagne aujourd’hui.","p":["En 2025, l’Allemagne a émis environ 649 millions de tonnes de gaz à effet de serre (équivalents CO₂) – environ 48 % de moins qu’en 1990 (environ 1 253 millions de tonnes).","Par rapport à 2024, les émissions n’ont baissé que d’environ 0,1 %. L’industrie a émis moins, les transports (environ +2,1 millions de t) et les bâtiments (environ +3,4 millions de t) plus.","Objectif 2030 selon la loi sur la protection du climat : au maximum environ 438 millions de tonnes (65 % de moins qu’en 1990). Objectif 2045 : zéro net.","En 2025, les énergies renouvelables ont couvert presque 56 % de la consommation d’électricité – 0,7 point de pourcentage de plus qu’en 2024.","En 2025, l’éolien était la première source d’électricité ; pour la première fois, le photovoltaïque était à la 2e place. L’électricité solaire a dépassé pour la première fois le lignite (environ 67 TWh).","Puissance installée fin 2025 : solaire environ 117 gigawatts (ajout en 2025 : 16,4 GW), éolien terrestre environ 68 GW (ajout 4,6 GW), éolien en mer environ 9,5 GW, toutes les renouvelables ensemble environ 210 GW."]},{"t":"Bavière : soleil et vent","l":"Championne du solaire, avec un long débat sur l’éolien.","p":["La Bavière a la plus grande puissance solaire de tous les Länder : fin 2025, environ 35 gigawatts, soit environ 30 % de la puissance solaire allemande.","Fin 2025, la Bavière comptait presque 1,4 million d’installations photovoltaïques. En 2025, environ 4,5 gigawatts ont été ajoutés – plus que dans tout autre Land.","Règle 10H (depuis 2014) : une éolienne devait se trouver à une distance d’au moins dix fois sa hauteur des habitations.","Le Landtag (parlement bavarois) a décidé un assouplissement le 27 octobre 2022, en vigueur depuis le 16 novembre 2022 : dans les forêts, le long des autoroutes et des voies ferrées, près des zones d’activités et dans les zones prioritaires pour l’éolien, 1 000 mètres suffisent."]}]],"infosAg":[{"t":"Notre club","l":"Ce que représente « Going green und fair » – et ce qui a déjà été fait.","p":["« Ce que nous faisons aujourd’hui décide de ce à quoi le monde ressemblera demain. » – Marie von Ebner-Eschenbach (1830–1916)","Le club s’engage pour l’environnement et le commerce équitable. Ses membres y font l’expérience de l’efficacité personnelle et de l’esprit d’équipe.","Le club suit les principes de l’« éducation au développement durable » (EDD, en allemand BNE), une campagne éducative mondiale des Nations unies. Elle aide à comprendre les conséquences de ses propres actions.","Pendant la semaine de la santé et du développement durable, le club a organisé l’atelier « Change Fashion » sur la fast fashion – la mode tendance qui sort en collections très rapprochées.","Une fois par mois, la boutique solidaire (Weltladen) du MMG ouvre pour la vente équitable à la récré. Les produits équitables sont bien exposés dans une vitrine en verre à la cantine.","Pendant l’Avent, saint Nicolas, le Père Fouettard et des anges – tous membres de la SMV (délégués des élèves) – ont distribué des Saint-Nicolas en chocolat équitable à tout le monde."]},{"t":"Portables & cahiers MMG","l":"Deux projets qui changent directement les choses.","p":["Lors de la collecte de téléphones portables, l’association caritative « Missio » a reçu 50 centimes par portable. 49 portables ont été envoyés au centre de collecte – le MMG a reçu un certificat.","L’argent soutient des projets pour l’éducation, la santé et les conditions de vie des enfants, notamment au Ghana et aux Philippines.","Le club a conçu des cahiers MMG durables : 100 % papier recyclé, fabriqués près de chez nous par la maison d’édition musicale Streubel à Dorfen.","La couverture solide rend le protège-cahier en plastique inutile – on colorie le bord dans la couleur de la matière. Une bande de classement intégrée remplace la chemise à lamelle.","Les nouveaux membres sont toujours les bienvenus au club !"]}],
"lexikon":[["Agenda 2030","Plan des Nations unies de 2015 comprenant 17 objectifs de développement durable à atteindre d’ici 2030."],["Diversité des espèces (biodiversité)","La diversité de tous les êtres vivants : les différentes espèces, leurs habitats et la diversité génétique au sein d’une même espèce."],["EDD – éducation au développement durable (BNE)","Concept éducatif des Nations unies : chacun doit comprendre comment ses actions influencent le monde et pouvoir prendre des décisions responsables."],["Label bio (UE)","Signale les aliments issus de l’agriculture biologique, par exemple sans pesticides chimiques de synthèse. Bio ne veut pas automatiquement dire équitable."],["Blauer Engel (Ange bleu)","Écolabel officiel en Allemagne pour les produits et services particulièrement respectueux de l’environnement."],["Équivalent CO₂","Unité de mesure qui permet de comparer tous les gaz à effet de serre : quelle quantité de CO₂ réchaufferait le climat autant ?"],["Empreinte carbone","La quantité de gaz à effet de serre causée par une personne, un produit ou une entreprise."],["Prix du CO₂","Prix à payer pour émettre du CO₂ – ainsi, les combustibles nuisibles au climat coûtent plus cher et protéger le climat devient rentable."],["Échange de quotas d’émission","Système dans lequel les entreprises doivent acheter des droits pour émettre du CO₂. La quantité totale est limitée et diminue avec le temps."],["Jour du dépassement","Le jour de l’année à partir duquel l’humanité a consommé plus de ressources que la Terre ne peut en renouveler en un an."],["Énergies renouvelables","Énergie provenant de sources qui ne s’épuisent pas : soleil, vent, eau, chaleur de la Terre et biomasse."],["Commerce équitable","Commerce avec des prix et des conditions de travail justes pour les producteurs et productrices, surtout dans les pays du Sud."],["Fairtrade","Label connu du commerce équitable : il garantit entre autres un prix minimum et une prime pour des projets collectifs."],["Fast fashion","Mode bon marché, produite en collections qui changent très vite et souvent jetée après peu de temps."],["Rotation des cultures","Sur un champ, on cultive chaque année des plantes différentes. Cela garde le sol fertile et limite les parasites."],["Justice entre les générations","Vivre aujourd’hui de façon à ce que les générations futures aient elles aussi de bonnes chances dans la vie."],["Obsolescence programmée","Le reproche selon lequel certains produits seraient conçus exprès pour tomber en panne rapidement."],["Greenwashing (écoblanchiment)","Une entreprise se présente comme plus écologique qu’elle ne l’est vraiment."],["Grüner Knopf (Bouton vert)","Label officiel allemand pour les textiles fabriqués selon des normes sociales et écologiques minimales."],["Espèces invasives","Espèces animales ou végétales introduites qui se répandent fortement et évincent les espèces locales."],["Justice climatique","L’idée que les charges de la crise climatique doivent être réparties équitablement – elle frappe souvent le plus ceux qui y ont le moins contribué."],["Neutralité climatique","Au bout du compte, aucun gaz à effet de serre supplémentaire n’est émis. L’Allemagne veut y parvenir d’ici 2045."],["Coopérative","Regroupement de producteurs et productrices qui travaillent ensemble et ont ainsi plus de poids dans les négociations."],["Économie circulaire","Les produits et les matières premières sont utilisés, réparés et réutilisés le plus longtemps possible au lieu d’être jetés."],["Pollution lumineuse","Trop de lumière artificielle la nuit. Elle perturbe les insectes, les oiseaux et d’autres animaux."],["Chaîne d’approvisionnement","Toutes les étapes par lesquelles passe un produit, de la matière première jusqu’au magasin – souvent à travers de nombreux pays."],["Réutilisable (consigne)","Emballages comme les bouteilles ou les gobelets qui sont lavés et réutilisés de nombreuses fois."],["Microplastiques","Particules de plastique de moins de 5 millimètres, par exemple issues de l’usure des pneus, des vêtements ou de déchets qui se décomposent."],["Monoculture","Sur une grande surface, une seule espèce de plante pousse pendant des années."],["Tourbière","Milieu humide en permanence où les plantes mortes ne se décomposent pas complètement. Les tourbières stockent énormément de carbone."],["Développement durable","Vivre et produire de façon à ce que l’environnement, l’économie et le social soient en équilibre – aujourd’hui et pour les générations futures."],["Empreinte écologique","Indique quelle surface de la Terre est nécessaire pour permettre le mode de vie d’une personne ou d’un pays."],["Accord de Paris sur le climat","Traité de 2015 : presque tous les États veulent limiter le réchauffement nettement en dessous de 2 °C, si possible à 1,5 °C."],["Effet rebond","Quand quelque chose devient plus efficace, on l’utilise souvent davantage – une partie des économies est ainsi perdue."],["Recyclage","Les déchets sont collectés et transformés en nouvelles matières premières."],["Local","Produits fabriqués ou cultivés à proximité – avec des trajets de transport courts."],["De saison","Manger des fruits et des légumes au moment où ils mûrissent naturellement chez nous."],["ODD (SDGs)","« Sustainable Development Goals » – les 17 objectifs de développement durable des Nations unies."],["Efficacité personnelle","L’expérience de pouvoir changer quelque chose par ses propres actions."],["Effet de serre","Des gaz dans l’atmosphère retiennent la chaleur. L’effet de serre naturel rend la Terre habitable, l’effet supplémentaire causé par l’être humain la réchauffe."],["Upcycling (surcyclage)","Transformer quelque chose de vieux en un objet nouveau et de plus grande valeur, par exemple un sac fait à partir d’un vieux jean."],["Eau virtuelle","L’eau utilisée pour fabriquer un produit, par exemple des vêtements ou des aliments."],["Pompe à chaleur","Chauffage qui utilise la chaleur de l’air, du sol ou des nappes d’eau souterraines. Avec de l’électricité verte, elle chauffe de façon presque neutre pour le climat."],["Réhumidification","On remet en eau des tourbières asséchées pour qu’elles ne libèrent plus de carbone et puissent à nouveau en stocker."],["Zéro déchet","Un mode de vie qui produit le moins de déchets possible."]],

function applyContentPack(pack){
  if(!pack || typeof pack!=='object') return;
  const isStr = v => typeof v==='string';
  const arr = v => Array.isArray(v);
  const setStr = (obj, key, v) => { if(obj && isStr(v)) obj[key] = v; };
  /* String-Array gleicher Länge in place übernehmen (einzelne fehlende Einträge bleiben deutsch) */
  const setArr = (target, src) => { if(!arr(target) || !arr(src)) return; target.forEach((_,i)=>{ if(isStr(src[i])) target[i] = src[i]; }); };
  const setQ = (q, pq) => {
    if(!q || !pq || typeof pq!=='object') return;
    setStr(q,'q',pq.q); setStr(q,'x',pq.x);
    if(q.t==='tf') return;
    if(arr(q.o) && arr(pq.o) && pq.o.length===q.o.length) setArr(q.o, pq.o);
    if(arr(q.p) && arr(pq.p) && pq.p.length===q.p.length) q.p.forEach((pr,i)=>{ const s = pq.p[i]; if(arr(pr) && arr(s)) setArr(pr, s); });
  };
  const setInfo = (inf, p) => {
    if(!inf || !p || typeof p!=='object') return;
    setStr(inf,'t',p.t); setStr(inf,'l',p.l);
    if(arr(inf.p) && arr(p.p) && p.p.length===inf.p.length) setArr(inf.p, p.p);
  };
  try{
    if(arr(pack.units)) UNITS.forEach((u,i)=>{ const pu = pack.units[i]; if(!pu) return; setStr(u,'t',pu.t); setStr(u,'d',pu.d);
      if(arr(pu.qs)) u.qs.forEach((q,j)=>setQ(q, pu.qs[j])); });
    if(pack.ag && typeof pack.ag==='object'){ setStr(AG,'t',pack.ag.t); setStr(AG,'d',pack.ag.d); setArr(AG.names, pack.ag.names);
      if(arr(pack.ag.qs)) AG.qs.forEach((q,j)=>setQ(q, pack.ag.qs[j])); }
    if(arr(pack.infos)) INFOS.forEach((pair,i)=>{ const pp = pack.infos[i]; if(arr(pair) && arr(pp)) pair.forEach((inf,n)=>setInfo(inf, pp[n])); });
    if(arr(pack.infosAg)) INFOS_AG.forEach((inf,i)=>setInfo(inf, pack.infosAg[i]));
    if(arr(pack.lexikon)) LEXIKON.forEach((e,i)=>{ const s = pack.lexikon[i]; if(arr(e) && arr(s)) setArr(e, s); });
    if(arr(pack.tips)) TIPS.forEach((e,i)=>{ const s = pack.tips[i]; if(arr(e) && arr(s)) setArr(e, s); });
    if(arr(pack.intro)) INTRO.forEach((e,i)=>{ const s = pack.intro[i]; if(!s) return; setStr(e,'e',s.e); setStr(e,'t',s.t);
      if(isStr(s.p)) e.p = s.p.replace(/\{n\}/g, UNITS.length); });   /* {n} = Anzahl der Einheiten */
    if(arr(pack.estimates)) ESTIMATES.forEach((q,i)=>{ const s = pack.estimates[i]; if(!s) return; setStr(q,'q',s.q); setStr(q,'unit',s.unit); setStr(q,'x',s.x); });
    if(arr(pack.myths)) MYTHS.forEach((q,i)=>{ const s = pack.myths[i]; if(!s) return; setStr(q,'q',s.q); setStr(q,'x',s.x); });
    if(arr(pack.check)) CHECK.forEach((c,i)=>{ const s = pack.check[i]; if(!s) return; setStr(c,'q',s.q); setStr(c,'tip',s.tip);
      if(arr(s.o)) c.o.forEach((o,j)=>{ if(isStr(s.o[j])) o[0] = s.o[j]; }); });   /* nur Beschriftungen, Punkte bleiben */
    setArr(PRAISE, pack.praise);
    setArr(LESSON_NAMES, pack.lessonNames);
    if(arr(pack.shop)) SHOP.forEach((it,i)=>{ const s = pack.shop[i]; if(!s) return; setStr(it,'t',s.t); setStr(it,'d',s.d); });
    if(arr(pack.outfits)) OUTFITS.forEach((it,i)=>setStr(it,'t',pack.outfits[i]));
    if(arr(pack.bgs)) BGS.forEach((it,i)=>setStr(it,'t',pack.bgs[i]));
    if(arr(pack.badges)) BADGES.forEach((b,i)=>{ const s = pack.badges[i]; if(!s) return; setStr(b,'t',s.t); setStr(b,'d',s.d); });
    if(arr(pack.grow)) GROW.forEach((g,i)=>setStr(g,'t',pack.grow[i]));
  }catch(e){ /* ein fehlerhaftes Paket darf die App nicht blockieren */ }
}
