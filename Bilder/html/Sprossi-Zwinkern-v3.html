<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1500px;overflow:hidden}
.b{position:relative;width:1500px;height:500px;background:linear-gradient(115deg,#2E6417 0%,#1E440E 50%,#2E6417 100%);display:flex;align-items:center;justify-content:center;overflow:hidden}
.glow{position:absolute;left:490px;top:-10px;width:520px;height:520px;border-radius:50%;background:radial-gradient(#7ED957 0%,rgba(126,217,87,.35) 45%,transparent 70%)}
.leaf{position:absolute;border-radius:0 70% 0 70%;background:#C1FF72;opacity:.14}
</style></head><body><div class="b"><div class="glow" id="glow"></div>
<div class="leaf" style="width:130px;height:130px;right:70px;top:-30px"></div>
<div class="leaf" style="width:90px;height:90px;right:300px;bottom:40px;transform:rotate(40deg)"></div>
<div class="leaf" style="width:110px;height:110px;left:90px;top:40px;transform:rotate(70deg)"></div>
<div class="leaf" style="width:70px;height:70px;left:330px;bottom:-10px;transform:rotate(-20deg)"></div>
<svg viewBox="0 0 400 400" width="460" height="460" style="position:relative;margin-top:10px">
  <ellipse id="shadow" cx="200" cy="352" rx="88" ry="12" fill="#000" opacity=".18"/>
  <g id="body">
    <path d="M112 262 C92 272 82 290 88 304" stroke="#00A857" stroke-width="18" fill="none" stroke-linecap="round"/>
    <circle cx="88" cy="306" r="13" fill="#00BF63"/>
    <g id="sprout">
      <path d="M200 142 C198 116 200 100 205 84" stroke="#2E6417" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M203 104 C184 70 142 66 122 78 C136 112 176 120 203 104Z" fill="#7ED957"/>
      <path d="M203 104 C220 72 260 64 283 74 C271 108 231 120 203 104Z" fill="#C1FF72"/>
    </g>
    <path d="M200 136 C112 136 86 214 98 276 C110 338 290 338 302 276 C314 214 288 136 200 136Z" fill="#00BF63"/>
    <path d="M118 236 C122 190 146 162 178 156" stroke="#fff" stroke-width="9" fill="none" opacity=".35" stroke-linecap="round"/>
    <g id="arm"><path d="M288 262 C308 272 318 290 312 304" stroke="#00A857" stroke-width="18" fill="none" stroke-linecap="round"/><circle cx="312" cy="306" r="13" fill="#00BF63"/></g>
    <g id="waves"></g>
    <g id="eyes">
      <g id="eyeL"><ellipse cx="165" cy="222" rx="24" ry="27" fill="#fff"/><circle cx="170" cy="226" r="12" fill="#1E440E"/><circle cx="175" cy="220" r="4.5" fill="#fff"/></g>
      <g id="eyeR"><ellipse cx="235" cy="222" rx="24" ry="27" fill="#fff"/><circle cx="240" cy="226" r="12" fill="#1E440E"/><circle cx="245" cy="220" r="4.5" fill="#fff"/></g>
    </g>
    <path id="wink" d="M213 226 Q235 210 257 226" stroke="#1E440E" stroke-width="6" fill="none" stroke-linecap="round" opacity="0"/>
    <path id="blink" d="M143 224 Q165 234 187 224 M213 224 Q235 234 257 224" stroke="#1E440E" stroke-width="5" fill="none" stroke-linecap="round" opacity="0"/>
    <ellipse cx="130" cy="262" rx="15" ry="9" fill="#C1FF72" opacity=".85"/><ellipse cx="270" cy="262" rx="15" ry="9" fill="#C1FF72" opacity=".85"/>
    <path d="M172 262 Q200 300 228 262 Z" fill="#1E440E"/>
    <path d="M186 280 Q200 290 214 280 Q200 272 186 280Z" fill="#EE4B4F"/>
  </g>
</svg></div>
<script>
const N = 48, part = Number((location.hash.slice(1)||'0')), TAU = Math.PI*2;
const tpl = document.querySelector('.b');
for(let k=0;k<24;k++){
  const f = part*24+k, p = f/N, el = k===0 ? tpl : document.body.appendChild(tpl.cloneNode(true));
  const q = s => el.querySelector(s);
  const wave = 0, bob = Math.sin(p*TAU)*4;
  
  q('#body').setAttribute('transform', `translate(0 ${-Math.abs(bob)})`);
  q('#shadow').setAttribute('rx', 88 - Math.abs(bob)*1.5);
  q('#sprout').setAttribute('transform', `rotate(${Math.sin(p*TAU*2+1)*4} 200 140)`);
  q('#waves').setAttribute('opacity', (0.35 + 0.45*Math.max(0, wave)).toFixed(2));
  const blink = false;
  q('#eyes').setAttribute('opacity', blink?0:1);
  q('#blink').setAttribute('opacity', blink?1:0);
  const wink = p>0.40 && p<0.60;   /* Zwinkern: nur rechtes Auge */
  q('#eyeR').setAttribute('opacity', wink?0:1);
  q('#wink').setAttribute('opacity', wink?1:0);
  q('#glow').style.opacity = (0.85 + 0.15*Math.sin(p*TAU)).toFixed(3);
}
</script></body></html>
